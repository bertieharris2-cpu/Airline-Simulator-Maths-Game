html[data-look="signage"] .hd{background:#0b0c0e;border-bottom:3px solid #FFD200;box-shadow:none}
html[data-look="signage"] .hd::before{background:none}html[data-look="signage"] .hd::after{display:none}
html[data-look="signage"] .logo{background:#FFD200;color:#111;border-right:0}html[data-look="signage"] .logo small{color:#3a3a2a}html[data-look="signage"] .logo .badge{background:#111;border-color:#111;color:#FFD200;box-shadow:none;text-shadow:none}
html[data-look="signage"] .hd-cell{background:none;border-left-color:#2c3138}html[data-look="signage"] .hd-cell small{color:#9aa0a8}html[data-look="signage"] .hd-cell .gold{color:#FFD200;text-shadow:none}
html[data-look="signage"] .wallbtn{background:#FFD200;color:#111;border-color:#FFD200}html[data-look="signage"] .ic{background:#1d2025;border-color:#3a4049}
html[data-look="signage"] .nav{background:#141619;border-right-color:#2c3138;box-shadow:none}
html[data-look="signage"] .nav button{border-bottom-color:#22252a}html[data-look="signage"] .nav button:hover:not(.on){background:#1d2025}
html[data-look="signage"] .nav button.on{background:#FFD200;color:#111;box-shadow:none}html[data-look="signage"] .nav button.on small{color:#3a3a2a}html[data-look="signage"] .nav button.on::after{display:none}html[data-look="signage"] .nav button.on .tick{color:#111}

html[data-look="signage"] .pnl,html[data-look="signage"] .card,html[data-look="signage"] .sum{box-shadow:none;border-color:#30353d}
html[data-look="signage"] .pnl::before,html[data-look="signage"] .card::before,html[data-look="signage"] .sum::before{display:none}
html[data-look="signage"] .pnl h2{text-transform:uppercase;letter-spacing:.08em;font-size:15px}html[data-look="signage"] .pnl h2::before{background:#FFD200;box-shadow:none;width:4px;height:15px}
html[data-look="signage"] .card{background:#1a1d21}html[data-look="signage"] .q{background:#111316!important;border-color:#30353d}
html[data-look="signage"] .pnl.focus,html[data-look="signage"] .card.focus{box-shadow:inset 4px 0 0 #FFD200;border-color:#FFD200;background:#1f2227}
html[data-look="signage"] .btn,html[data-look="signage"] .fare,html[data-look="signage"] .chip{background:#24272d;border-color:#454b55;color:#fff}
html[data-look="signage"] .btn:hover,html[data-look="signage"] .fare:hover,html[data-look="signage"] .chip:hover{border-color:#FFD200;box-shadow:none}
html[data-look="signage"] .btn.pri,html[data-look="signage"] .chip.on,html[data-look="signage"] .blocks .on{background:#FFD200;border-color:#FFD200;color:#111;box-shadow:none}
html[data-look="signage"] .btn.go{background:#39D98A;border-color:#39D98A;color:#08140d;box-shadow:none}
html[data-look="signage"] .link,html[data-look="signage"] .lnk{color:#FFD200}
html[data-look="signage"] table.t th,html[data-look="signage"] table.t td{border-bottom-color:#2a2e35}

html[data-look="signage"] .unknown{color:#FFD200}html[data-look="signage"] .tag,html[data-look="signage"] .sumno,html[data-look="signage"] .card .num{background:#111;border-color:#454b55;color:#FFD200;box-shadow:none}
html[data-look="signage"] .lane .who{background:#1d2025;border-color:#30353d}html[data-look="signage"] .lane select{background:#24272d;border-color:#454b55}
html[data-look="signage"] .track{background:repeating-linear-gradient(90deg,#141619 0,#141619 calc(12.5% - 1px),#262a30 calc(12.5% - 1px),#262a30 12.5%);border-color:#30353d;box-shadow:none}
html[data-look="signage"] .blk{background:#2a2e35;border-color:#454b55}html[data-look="signage"] .blk.on{background:#33373f;box-shadow:0 0 0 2px #FFD200;animation:none}
html[data-look="signage"] .bands{background:#141619;border-color:#30353d}html[data-look="signage"] .band .bar2{background:rgba(255,255,255,.14)}html[data-look="signage"] .band .bar2 i{background:#d6d9de}
html[data-look="signage"] .band.top .bar2{background:rgba(255,210,0,.25);box-shadow:0 0 0 1px #FFD200}html[data-look="signage"] .band.top .bar2 i{background:#FFD200}
html[data-look="signage"] .spark div{background:#d6d9de;box-shadow:none}html[data-look="signage"] .fillbar{background:#2a2e35}
html[data-look="signage"] .tank{background:#111316;border-color:#454b55}html[data-look="signage"] .tank i{background:linear-gradient(180deg,#FFD200,#c9a400);box-shadow:none}
html[data-look="signage"] .mc{background:#141619;border-color:#2a2e35}html[data-look="signage"] .mc.wait{border-color:rgba(255,210,0,.55);background:rgba(255,210,0,.04)}

  sums:{}, ft:{}, buy:null, bought:0, clock:6 * 60, playing:null, landed:{}, cur:null, note:null, rm:false, since:{} };

const R = id => DATA.routes.find(r => r.id === id), P = t => DATA.planes[t];

const legH = (t, rid) => R(rid).km / P(t).speed;
const tripMin = (t, rid) => Math.round(legH(t, rid) * 60) * 2 + DATA.turnaroundMin;
const bandOf = m => DATA.bands.find(b => m >= b.h0 * 60 && m < b.h1 * 60) || DATA.bands[DATA.bands.length - 1];
const fuelToday = () => DATA.fuelHistory[DATA.fuelHistory.length - 1];
const fareOf = rid => S.fares[rid] !== undefined ? S.fares[rid] : +Object.keys(R(rid).fares)[Math.floor(Object.keys(R(rid).fares).length / 2)];
const demand = rid => { const r = R(rid), f = S.fares[rid]; return f !== undefined && r.fares[f] !== undefined ? r.fares[f] : 0; };

/* one day of the plan: each flight's passengers, tickets and costs */
function model(){
  const flights = []; S.fleet.forEach((a, ai) => a.flights.forEach(([rid, dep], fi) => flights.push({ ai, fi, rid, dep, type:a.type, reg:a.reg, seats:P(a.type).seats })));
  const byRoute = {};
  flights.forEach(f => (byRoute[f.rid] = byRoute[f.rid] || []).push(f));
  const routes = DATA.routes.map(r => {
    const D = demand(r.id), fl = byRoute[r.id] || [], must = D * (1 - r.flex), flex = D * r.flex;
    fl.forEach(f => { const b = bandOf(f.dep), inBand = fl.filter(g => bandOf(g.dep) === b).length; f.pax = Math.min(f.seats, Math.round(must * r.shares[b.id] / inBand)); });
    let left = Math.round(flex); fl.slice().sort((a, b) => (b.seats - b.pax) - (a.seats - a.pax)).forEach(f => { const add = Math.min(f.seats - f.pax, Math.round(left / Math.max(1, fl.length))); f.pax += add; });
    const pax = fl.reduce((t, f) => t + f.pax, 0), seats = fl.reduce((t, f) => t + f.seats, 0);
    return { id:r.id, D, n:fl.length, pax, seats, tk:pax ? pax * S.fares[r.id] : 0, away:Math.max(0, D - pax) };
  });
  const price = fuelToday();
  flights.forEach(f => { const h = legH(f.type, f.rid) * 2, p = P(f.type); f.h = h; f.fuelL = Math.round(p.fuelLph * h); f.cost = Math.round(f.fuelL * price + p.hourCost * h + DATA.landingFee * 2); f.tk = f.pax * S.fares[f.rid]; });
  const rev = routes.reduce((t, r) => t + r.tk, 0), dayCosts = S.fleet.reduce((t, a) => t + P(a.type).dayCost, 0), fcost = flights.reduce((t, f) => t + f.cost, 0);
  const pax = flights.reduce((t, f) => t + f.pax, 0), seats = flights.reduce((t, f) => t + f.seats, 0), fuelL = flights.reduce((t, f) => t + f.fuelL, 0);

/* where a new flight can go: the first time from 06:00 that fits */
function freeSlot(ai, rid){ const a = S.fleet[ai], len = tripMin(a.type, rid), taken = a.flights.map(([r, d]) => [d, d + tripMin(a.type, r)]).sort((x, y) => x[0] - y[0]);
  for(let t = DATA.dayStart * 60; t + len <= DATA.dayEnd * 60; t += 20){ if(taken.every(([s, e]) => t + len <= s || t >= e)) return t; } return null; }

/* =====================================================================
   MOTION THAT SURVIVES A REDRAW (Pazzaz pass 2)
   Every click redraws the screen, so on its own nothing could move from where it was. After each redraw, settle():
   · data-k="key" (+ data-kp="left width"): put back the last value, then let the transition carry it to the new one;
   · data-v="key": if the figure changed, light it once (data-good="up": higher is better, "down": lower is better;
     data-tone="au" for gold); data-delta also shows the change (▲ £86) for a moment;
   · data-fx="key": a one-off effect started by fx() (a pop, a stamp, a shimmer, an arrival), kept in step if the
     screen redraws while it plays.
   --loop on #app is minus the page's age, so the slow loops (header aircraft, breathing) continue rather than restart.
   With reduced motion: no swaps, no effects; the state is still in the colours, rails and words.
   ===================================================================== */
const T0 = performance.now(), PREV = {}, FX = {};
const age = () => (performance.now() - T0) / 1000;
const reduced = () => S.rm || matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx = (key, cls, ms, delay) => { FX[key] = { cls, t0:performance.now() + (delay || 0), ms }; };   // starts after delay, lasts ms
const numOf = t => { const m = String(t).replace(/[£,\s]/g, '').replace('−', '-').match(/-?\d+(\.\d+)?/); return m ? +m[0] : null; };
function settle(){
  const now = performance.now(), RM = reduced(), swaps = [];
  document.querySelectorAll('[data-k]').forEach(el => { const k = el.dataset.k, props = (el.dataset.kp || 'width').split(' '), to = props.map(p => el.style[p]), was = PREV[k];
    if(!RM && was && was.join() !== to.join()){ props.forEach((p, i) => { el.style[p] = was[i]; }); swaps.push([el, props, to]); }
    PREV[k] = to; });
  if(swaps.length){ document.body.offsetWidth; swaps.forEach(([el, props, to]) => props.forEach((p, i) => { el.style[p] = to[i]; })); }
  document.querySelectorAll('[data-v]').forEach(el => { const k = el.dataset.v, t = el.textContent.trim(), was = PREV['v:' + k];
    if(was !== undefined && was !== t){ const a = numOf(was), b = numOf(t), g = el.dataset.good, up = a !== null && b !== null && b > a;
      const dir = !g || a === null || b === null || a === b ? '' : up === (g === 'up') ? 'up' : 'dn';
      fx('v:' + k, 'chg ' + (dir || el.dataset.tone || ''), 1100);
      if(lab('roll') && !RM && a !== null && b !== null && !el.closest('.wall') && !el.querySelector('.fl')) odo(el, was, t);
      if(el.dataset.delta !== undefined && a !== null && b !== null && a !== b) FX['d:' + k] = { t0:now, ms:2600, dir:up ? 'up' : 'dn', text:(up ? '▲ ' : '▼ ') + money(Math.abs(b - a)) }; }
    PREV['v:' + k] = t; });
  document.getElementById('app').querySelectorAll('[data-flap]').forEach(el => { const k = el.dataset.flap, to = el.dataset.to, was = PREV['fl:' + k];
    if(lab('flap') && !RM && was !== to && !FLAP[k]) FLAP[k] = { t0:now + (was === undefined ? +el.dataset.d || 0 : 0) }; PREV['fl:' + k] = to; });
  if(Object.keys(FLAP).length) flapRun();
  if(RM) return;
  Object.keys(FX).forEach(k => { const f = FX[k], t = now - f.t0;   // t < 0: not started yet, so the animation waits
    if(t > f.ms){ delete FX[k]; return; }
    const key = k.slice(2), sel = k.startsWith('v:') || k.startsWith('d:') ? `[data-v="${key}"]` : `[data-fx="${k}"]`;
    document.querySelectorAll(sel).forEach(el => {
      if(k.startsWith('d:')){ el.insertAdjacentHTML('afterend', `<span class="delta ${f.dir}" style="animation-delay:${Math.round(-t)}ms">${f.text}</span>`); return; }
      f.cls.split(' ').filter(Boolean).forEach(c => el.classList.add(c)); el.style.animationDelay = `${Math.round(-t)}ms`; }); });
}

sums(){ const M = model(), ams = M.routes.find(r => r.id === 'ams'), blk = DATA.tank.block, per = Math.round(blk * fuelToday() * 100) / 100, need = Math.max(0, M.fuelL * 5 - DATA.tank.inTank), n = Math.ceil(need / blk);

fuel(){ const H = DATA.fuelHistory, F = DATA.fuelForecast, T = DATA.tank, M = model(), week = M.fuelL * 5, P0 = fuelToday(), blk = T.block, per = Math.round(blk * P0 * 100) / 100;

review(){ const D = DATA.lastWeekDays, mx = Math.max(...D.map(d => d[1])), tot = D.reduce((t, d) => t + d[1], 0), w = DATA.weeks[DATA.weeks.length - 1], best = D.slice().sort((a, b) => b[1] - a[1])[0];

function artSvg(type, reg, cls){ const src = ARTWORK[type]; if(!src) return ''; const u = 'lab' + (++ART_N);
  let h = src.replace(/@U/g, u).replace(/class="([^"]*)\bst st-([\w-]+)/g, (m, pre, id) => `class="${pre}st st-${id}${id === 'swoosh' ? ' on' : ''}`).replace(/class="([^"]*)\btl tl-([\w-]+)/g, (m, pre, id) => `class="${pre}tl tl-${id}${id === 'star' ? ' on' : ''}`);

/* ---------- the flight-progress bar: the week as one flight ---------- */
const PHASES = [ ['ft', 'Times'], ['plan', 'Plan'], ['sums', 'Sums'], ['fuel', 'Fuel'], ['fly', 'Fly'], ['review', 'Review'] ];
const PH_X = [6, 20, 35, 49, 68, 92], PROFILE = [[0, 44], [27, 44], [52, 16], [79, 16], [100, 44]];   // x in % of the bar, y in px: taxi, climb, cruise, descent
const phY = x => { for(let i = 1; i < PROFILE.length; i++){ const [x0, y0] = PROFILE[i - 1], [x1, y1] = PROFILE[i]; if(x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0); } return 44; };
function phaseBar(){ const cur = S.wall && S.wmode === 'live' ? 'fly' : S.view, idx = PHASES.findIndex(p => p[0] === cur), done = id => id === 'fly' ? !!S.done.review : !!S.done[id];
  const at = idx >= 0 ? PH_X[idx] : 1.5, y = phY(at), seg = pts => pts.map(([x, yy], i) => `${i ? 'L' : 'M'}${x} ${yy}`).join(' ');
  const cls = (id, i) => i === idx ? 'now' : done(id) ? 'done' : '';
  return `<div class="phase"><svg viewBox="0 0 100 78" preserveAspectRatio="none"><path class="pp" d="${seg(PROFILE)}"/><path class="pd" d="${seg(PROFILE.filter(p => p[0] < at).concat([[at, y]]))}"/></svg>
    ${PHASES.map(([id, t], i) => `<button class="wp ${cls(id, i)}" style="left:${PH_X[i]}%;top:${phY(PH_X[i])}px" ${id === 'fly' ? 'disabled' : `data-go="${id}"`} title="${t}"></button><button class="wl ${cls(id, i)}" style="left:${PH_X[i]}%" ${id === 'fly' ? 'disabled' : `data-go="${id}"`}>${t}</button>`).join('')}
    <span class="pl" data-k="phase-pl" data-kp="left top transform" style="left:${at}%;top:${y.toFixed(1)}px;transform:rotate(${at < 27 ? 0 : at < 52 ? -13 : at < 79 ? 0 : 12}deg)"><svg viewBox="-10 -8 20 16"><path d="${PLANE}" fill="#f1f8ff"/></svg></span></div>`; }

/* ---------- rolling figures: each digit rolls to its new value, the units first ---------- */
function odo(el, from, to){ const n = Math.max(from.length, to.length), f = from.padStart(n, ' '), t = to.padStart(n, ' ');
  el.innerHTML = [...t].map((c, i) => /\d/.test(c) ? `<span class="odo"><span class="odo-s" data-d="${c}" style="transform:translateY(-${(/\d/.test(f[i]) ? +f[i] : 0) * 10}%)">0<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9</span></span>` : c === ' ' ? '' : `<span class="odo-c">${c}</span>`).join('');
  el.offsetWidth; const all = el.querySelectorAll('.odo-s'); all.forEach((s, i) => { s.style.transitionDelay = ((all.length - 1 - i) * 45) + 'ms'; s.style.transform = `translateY(-${s.dataset.d * 10}%)`; });
  setTimeout(() => { if(el.isConnected) el.textContent = to; }, 1100); }

/* ---------- cockpit gauges ---------- */
function gauge(i, val, max, label, sub, o){ o = o || {}; const f = Math.max(0, Math.min(1, val / max)), a = -90 + 180 * f, pt = (t, r) => { const q = Math.PI * (1 - t); return [(60 + r * Math.cos(q)).toFixed(1), (60 - r * Math.sin(q)).toFixed(1)]; };
  const arc = (f0, f1) => { const [x0, y0] = pt(f0, 48), [x1, y1] = pt(f1, 48); return `M${x0} ${y0} A48 48 0 0 1 ${x1} ${y1}`; };
  const ticks = [0, .25, .5, .75, 1].map(t => { const [x0, y0] = pt(t, 40), [x1, y1] = pt(t, 34); return `<line class="tick" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`; }).join('');
  const tgt = o.target !== undefined ? (() => { const t = Math.min(1, o.target / max), [x0, y0] = pt(t, 55), [x1, y1] = pt(t, 42); return `<line class="tgt" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`; })() : '';
  return `<div class="gauge"><svg viewBox="0 0 120 68"><path class="arc" d="${arc(0, 1)}"/>${(o.zones || []).map(([f0, f1, c]) => `<path class="zone" d="${arc(f0, f1)}" stroke="${c}"/>`).join('')}${ticks}${tgt}<g class="needle" style="--a:${a.toFixed(1)}deg;--i:${i}"><path d="M58.4 60 L60 17 L61.6 60 Z"/></g><circle class="hub" cx="60" cy="60" r="5"/></svg><b>${label}</b><small>${sub}</small></div>`; }
function gaugesHtml(M){ const last = DATA.weeks[DATA.weeks.length - 1], target = Math.round(last.profit / 7), pct = Math.round(100 * M.pax / Math.max(1, M.seats)), days = DATA.tank.inTank / Math.max(1, M.fuelL);
  const R3 = 'rgba(255,95,95,.55)', A3 = 'rgba(255,181,71,.55)', G3 = 'rgba(60,227,148,.6)';
  return `<div class="gauges">${gauge(0, pct, 100, pct + '%', 'Seats filled', { zones:[[0, .5, R3], [.5, .8, A3], [.8, 1, G3]] })}${gauge(1, M.profit, target * 2, money(M.profit), `profit a day<br>target ${money(target)}`, { target })}${gauge(2, days, 14, days.toFixed(1) + ' days', 'of fuel in the tank', { zones:[[0, 3 / 14, R3], [3 / 14, 7 / 14, A3], [7 / 14, 1, G3]] })}</div>`; }

/* ---------- toasts, sounds ---------- */
function toast(html, kind, icon){ if(!lab('toast')) return; const box = document.getElementById('toasts'), t = document.createElement('div');
  t.className = 'toast ' + (kind || ''); t.innerHTML = IC(icon || 'check') + `<span>${html}</span>`; box.appendChild(t); while(box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 420); }, 3400); }
let ACX = null, lastFlap = 0;
function snd(kind){ if(!lab('sound')) return; try { ACX = ACX || new (window.AudioContext || window.webkitAudioContext)(); const c = ACX, t = c.currentTime, g = c.createGain(); g.connect(c.destination);
  const env = (peak, d) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d); };
  const tone = (type, f0, f1, d, peak) => { const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if(f1) o.frequency.setValueAtTime(f1, t + .11); o.connect(g); env(peak, d); o.start(t); o.stop(t + d + .02); };
  const noise = (d, freq, peak) => { const b = c.createBuffer(1, Math.round(c.sampleRate * d), c.sampleRate), x = b.getChannelData(0); for(let i = 0; i < x.length; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / x.length, 3);
    const s = c.createBufferSource(), fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = freq; s.buffer = b; s.connect(fl); fl.connect(g); g.gain.setValueAtTime(peak, t); s.start(t); };
  if(kind === 'click') tone('sine', 1500, 0, .05, .02);
  else if(kind === 'ok') tone('sine', 880, 1318.5, .5, .06);
  else if(kind === 'query') { const o = c.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(330, t); o.frequency.linearRampToValueAtTime(262, t + .2); o.connect(g); env(.05, .3); o.start(t); o.stop(t + .32); }
  else if(kind === 'flap'){ if(t - lastFlap < .045) return; lastFlap = t; noise(.018, 2600, .045); }
  else if(kind === 'whoosh') noise(.45, 900, .03);
} catch(e){} }

/* ---------- split-flap: each letter flips through others before it settles ---------- */
const FLAP = {}, FL_CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const flapHtml = (text, key, d) => `<span class="flw" data-flap="${key}" data-to="${text}" data-d="${d || 0}">${[...text].map(c => `<span class="fl ${c === ' ' ? 'sp' : ''}">${c === ' ' ? '&nbsp;' : c}</span>`).join('')}</span>`;
const flapOr = (text, key, d) => lab('flap') ? flapHtml(text, key, d) : text;
let FLAP_ON = false;
function flapRun(){ if(FLAP_ON) return; FLAP_ON = true;
  const tick = () => { const now = performance.now(); let live = 0, flips = 0;
    Object.keys(FLAP).forEach(k => { const f = FLAP[k], els = document.querySelectorAll(`[data-flap="${k}"]`); let busy = now < f.t0;
      els.forEach(el => { const to = el.dataset.to; [...el.children].forEach((ch, i) => { const c = to[i] || ' ', at = f.t0 + 140 + i * 55;
        if(c === ' ') return; if(now < f.t0){ ch.classList.remove('f'); ch.textContent = ' '; busy = true; }
        else if(now < at){ busy = true; flips++; ch.classList.add('f'); ch.textContent = FL_CH[(Math.floor(now / 70) + i * 7) % FL_CH.length]; }
        else if(ch.textContent !== c){ ch.classList.remove('f'); ch.textContent = c; } }); });
      if(busy && (els.length || now - f.t0 < 4000)) live++; else delete FLAP[k]; });
    if(flips) snd('flap'); if(live) requestAnimationFrame(tick); else FLAP_ON = false; };
  requestAnimationFrame(tick); }

/* ---------- the reel before the week flies ---------- */
function showReel(then){ const M = model(), sp = document.getElementById('reel'), fl = M.flights.slice().sort((a, b) => a.dep - b.dep), now = performance.now();
  sp.innerHTML = `<div class="rcard"><div class="rh">${flapHtml('WEEK ' + DATA.today.week + ' DEPARTURES', 'reel-h', 0)}</div><p class="rsub">${fl.length} flights a day · ${M.pax} passengers booked today · ${num(M.fuelL)} L of fuel a day</p>
    <table>${fl.map((f, i) => `<tr><td>${flapHtml(hm(f.dep), 'reel-t' + i, 600 + i * 170)}</td><td>${flapHtml(callsign(f.ai, f.fi), 'reel-c' + i, 640 + i * 170)}</td><td>${flapHtml(R(f.rid).city.toUpperCase().padEnd(9), 'reel-d' + i, 680 + i * 170)}</td><td>${flapHtml('BOARDING', 'reel-s' + i, 760 + i * 170)}</td></tr>`).join('')}</table>
    <div class="rgo">DOORS CLOSING · PRESS TO SKIP</div></div>`;
  sp.hidden = false; sp.classList.remove('out'); sp.querySelectorAll('[data-flap]').forEach(e => { FLAP[e.dataset.flap] = { t0:now + (+e.dataset.d || 0) }; }); flapRun();
  let done = false; const end = () => { if(done) return; done = true; sp.classList.add('out'); setTimeout(() => { sp.hidden = true; sp.innerHTML = ''; }, 450); then(); };
  sp.onclick = end; setTimeout(end, 1500 + fl.length * 170 + 1300); }

/* ---------- counting up (the match report) ---------- */
const COUNT = {};
function countRun(){ const now = performance.now(); let live = false;
  Object.keys(COUNT).forEach(k => { const c = COUNT[k], p = Math.max(0, Math.min(1, (now - c.t0) / c.ms)), e = 1 - Math.pow(1 - p, 3);
    document.querySelectorAll(`[data-count="${k}"]`).forEach(el => { el.textContent = c.fmt(c.from + (c.to - c.from) * e); });
    if(p < 1) live = true; else delete COUNT[k]; });
  if(live) requestAnimationFrame(countRun); }

/* ---------- hover cards, and previews before you choose ---------- */
function hcShowAt(anchor, html){ const hc = document.getElementById('hc'); hc.innerHTML = html; hc.classList.add('on'); const r = anchor.getBoundingClientRect(), w = hc.offsetWidth, h = hc.offsetHeight;
  let x = r.right + 12, y = r.top - 4; if(x + w > innerWidth - 8) x = r.left - w - 12; if(x < 8){ x = Math.min(innerWidth - w - 8, Math.max(8, r.left)); y = r.bottom + 10; }
  if(y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8); hc.style.left = x + 'px'; hc.style.top = y + 'px'; }
function hcHide(){ const hc = document.getElementById('hc'); if(hc) hc.classList.remove('on'); }
function routeCard(id){ const r = R(id), M = model(), x = M.routes.find(z => z.id === id), mx = Math.max(...r.months), c = r.rival, cut = DATA.scenario.rivalCut && c.cut, ar = arrow(r.trend);
  return `<h5><span class="flag" style="background:linear-gradient(90deg,${r.flag[0]} 33%,${r.flag[1]} 33% 66%,${r.flag[2]} 66%)"></span>${r.city} <span class="sf" style="font-weight:400">${r.code} · ${num(r.km)} km</span></h5>
    <div class="hr">${r.open === false ? '<span>Status</span><b>Not flown yet</b>' : `<span>Seats filled</span><b>${x.seats ? Math.round(100 * x.pax / x.seats) + '%' : 'no flights'}</b><span>Your fare</span><b>£${fareOf(id)}</b>`}<span>Rival</span><b>${c.name} £${cut ? c.cut : c.fare}</b><span>Trend</span><b class="${ar[1] === 'up' ? 'up' : ar[1] === 'dn' ? 'dn' : ''}">${ar[0]} ${ar[2]}</b></div>
    <div class="spk" title="Each month's demand">${r.months.map((v, k) => `<i class="${k === 8 ? 'cur' : v === mx ? 'pk' : ''}" style="height:${Math.round(100 * v / mx)}%"></i>`).join('')}</div><p class="why">${r.why}</p>`; }
function previewFare(chip, on){ const sum = document.querySelector('[data-v="s-profit"]'); document.querySelectorAll('.ghost').forEach(g => g.remove()); hcHide(); if(!on) return;
  const [rid, fv] = chip.dataset.setfare.split('|'); if(+fv === S.fares[rid]) return;
  const base = model(), keep = S.fares[rid]; S.fares[rid] = +fv; const M = model(); S.fares[rid] = keep; const dv = M.profit - base.profit, x = M.routes.find(z => z.id === rid), up = dv >= 0;
  if(sum) sum.insertAdjacentHTML('afterend', `<span class="ghost ${up ? 'up' : 'dn'}">at £${fv}: ${money(M.profit)} ${up ? '▲' : '▼'} ${money(Math.abs(dv))}</span>`);
  hcShowAt(chip, `<h5>${R(rid).city} at £${fv}?</h5><div class="hr"><span>People who want to fly</span><b>${x.D}</b><span>Seats filled</span><b>${x.seats ? Math.round(100 * x.pax / x.seats) : 0}%</b><span>Ticket money a day</span><b>${money(x.tk)}</b><span>Profit a day</span><b class="${up ? 'up' : 'dn'}">${money(M.profit)} (${up ? '▲' : '▼'} ${money(Math.abs(dv))})</b></div>`); }
function previewFuel(k){ const o = document.querySelector('.tank .order'), tot = document.querySelector('[data-v="f-cost"]'); if(!o) return; const T = DATA.tank, sel = k === null ? +o.dataset.sel : k, pc = v => Math.max(0, Math.min(100, 100 * v / T.capacity)), lvl = pc(T.inTank);
  o.style.height = Math.min(pc(sel * T.block), 100 - lvl).toFixed(1) + '%'; o.style.opacity = k === null ? '' : '.95';
  const per = Math.round(T.block * fuelToday() * 100) / 100; if(tot) tot.textContent = money(sel * per, 2); }

/* ---------- dragging a flight along its lane ---------- */
function dragFlight(el, ev){ if(ev.button !== 0) return; const [ai, fi] = el.dataset.blk.split('|').map(Number), a = S.fleet[ai], f = a.flights[fi], len = tripMin(a.type, f[0]), track = el.parentElement, span = (DATA.dayEnd - DATA.dayStart) * 60, pxm = track.clientWidth / span, x0 = ev.clientX, d0 = f[1], base = model();
  const X = m => 100 * (m - DATA.dayStart * 60) / span, tip = document.getElementById('dragtip'), prof = document.querySelector('[data-v="s-profit"]'); let dep = d0, moved = false, ok = true, hit = null;
  const posTip = e => { tip.style.left = Math.min(innerWidth - 310, e.clientX + 16) + 'px'; tip.style.top = Math.max(8, e.clientY - 78) + 'px'; };
  const move = e => { const dx = e.clientX - x0; if(!moved && Math.abs(dx) < 5) return; if(!moved){ moved = true; el.classList.add('dragging'); hcHide(); }
    let d = d0 + Math.round(dx / pxm / 20) * 20; d = Math.max(DATA.dayStart * 60, Math.min(DATA.dayEnd * 60 - len, d)); posTip(e); if(d === dep && tip.classList.contains('on')) return; dep = d;
    hit = a.flights.find((g, k) => k !== fi && !(d + len <= g[1] || d >= g[1] + tripMin(a.type, g[0]))); ok = !hit;
    el.style.left = X(d) + '%'; el.classList.toggle('bad', !ok); f[1] = d; const M = model(), mf = M.flights.find(z => z.ai === ai && z.fi === fi); f[1] = d0; const dv = M.profit - base.profit;
    el.innerHTML = blkInner(ai, fi, f[0], d, len, mf.pax, mf.seats);
    tip.innerHTML = ok ? `<b>${hm(d)}–${hm(d + len)}</b> · ${R(f[0]).city} · ${mf.pax}/${mf.seats} seats<br>Profit a day <b>${money(M.profit)}</b> <span class="${dv > 0 ? 'up' : dv < 0 ? 'dn' : ''}">${dv ? (dv > 0 ? '▲ ' : '▼ ') + money(Math.abs(dv)) : 'no change'}</span>` : `<span class="wa">⚠ It would overlap the ${hm(hit[1])} flight to ${R(hit[0]).city}</span>`;
    tip.classList.add('on'); if(prof && ok){ prof.textContent = money(M.profit); prof.classList.toggle('good', M.profit >= 0); prof.classList.toggle('bad', M.profit < 0); } };
  const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); tip.classList.remove('on');
    if(!moved) return; S._noClick = true; setTimeout(() => { S._noClick = false; }, 0); el.classList.remove('dragging');
    PREV['blk-' + f.id] = [el.style.left, el.style.width]; S.sel = [ai, fi];
    if(ok && dep !== d0){ f[1] = dep; S.note = null; toast(`<b>${callsign(ai, fi)}</b> now leaves at ${hm(dep)}`, 'info', 'clock'); snd('click'); }
    else if(!ok){ S.note = `It would overlap the ${hm(hit[1])} flight to ${R(hit[0]).city}.`; fx('blk-' + f.id, 'deny', 650); snd('query'); }
    render(); };
  el.setPointerCapture(ev.pointerId); el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); }

/* ---------- the spotlight: the first visit to a page shows the one thing to do ---------- */
const TIPS = { home:['.todo', 'Your week, step by step. The gold ring is where you are: press Open to go there.'],
  ft:['td.ask', 'Work out this flight time in your book: distance ÷ speed. Then type the answer in hours.'],
  plan:[() => lab('drag') ? '.lane .track' : '.rt', () => lab('drag') ? 'Drag a flight along its lane to change its time. The profit at the bottom changes as you drag.' : 'Press a fare to see how many people want to fly at each price.'],
  sums:['.card.focus', 'Work it out in your book, then type the answer here. It goes into the operating model at the top.'],
  fuel:['.blocks', 'Pick an amount of fuel. The dashed block shows it in the tank before you buy.'],
  'wall:intel':['.ribbon', 'What is happening this week. Press one to light up its panel and its city.'] };
function maybeSpot(){ if(!lab('spot')) return; const key = S.wall ? 'wall:' + S.wmode : S.view, t = TIPS[key]; if(!t || LAB.coached.includes(key) || !document.getElementById('spot').hidden) return;
  const el = document.querySelector(typeof t[0] === 'function' ? t[0]() : t[0]); if(!el) return; LAB.coached.push(key); labSave(); el.scrollIntoView({ block:'center' }); showSpot(el, typeof t[1] === 'function' ? t[1]() : t[1]); }
function showSpot(el, txt){ const sp = document.getElementById('spot'), r = el.getBoundingClientRect(), pad = 8, hole = sp.querySelector('.hole'), card = sp.querySelector('.scard');
  Object.assign(hole.style, { left:(r.left - pad) + 'px', top:(r.top - pad) + 'px', width:(r.width + 2 * pad) + 'px', height:Math.min(r.height + 2 * pad, innerHeight - r.top) + 'px' });
  card.querySelector('p').textContent = txt; sp.hidden = false; const ch = card.offsetHeight, below = r.bottom + pad + 14;
  card.style.left = Math.max(12, Math.min(innerWidth - 342, r.left)) + 'px'; card.style.top = (below + ch < innerHeight - 8 ? below : Math.max(12, r.top - pad - 14 - ch)) + 'px'; card.querySelector('button').focus({ preventScroll:true }); }
function hideSpot(){ const sp = document.getElementById('spot'); if(sp) sp.hidden = true; }

/* ---------- the lab panel ---------- */
function labPanel(){ const p = document.getElementById('labp');
  p.innerHTML = `<button class="lx" data-lab="close" title="Close (L)">✕</button><h3>${IC('lab')} Style lab</h3><p class="lsub">Try looks and instruments, then keep what works. Remembered on this computer. L opens and closes this.</p>
  <h4>Look</h4><div class="looks">${LOOKS.map(([id, t, d, sw]) => `<button class="${LAB.look === id ? 'on' : ''}" data-look="${id}"><span class="sw">${sw.map(c => `<i style="background:${c}"></i>`).join('')}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div>
  <h4>Mix in from Glass Cockpit <span style="letter-spacing:0;text-transform:none;font-weight:400">· hold C to compare</span></h4>${MIX.map(([k, t, d]) => `<div class="tg ${LAB.mix[k] ? 'on' : ''}" data-mix="${k}" role="switch" aria-checked="${!!LAB.mix[k]}" tabindex="0"><b>${t}</b><span class="sl"></span><small>${d}</small></div>`).join('')}
  <h4>Typeface</h4><div class="fonts">${FONTS.map(([id, t, fam]) => `<button class="${LAB.font === id ? 'on' : ''}" data-font="${id}"><b style='font-family:${fam}'>£19,052</b><small>${t}</small></button>`).join('')}</div>
  ${LAB_ITEMS.map(([g, items]) => `<h4>${g}</h4>${items.map(([k, t, d]) => `<div class="tg ${lab(k) ? 'on' : ''}" data-tog="${k}" role="switch" aria-checked="${lab(k)}" tabindex="0"><b>${t}</b><span class="sl"></span><small>${d}</small></div>`).join('')}`).join('')}
  <div class="lfoot"><button data-lab="all">All on</button><button data-lab="none">All off</button><button data-lab="tips">Show the tips again</button><button data-lab="reset">Reset</button></div>`; }
function toggleLab(open){ const p = document.getElementById('labp'); p.hidden = open === undefined ? !p.hidden : !open; if(!p.hidden) labPanel(); }
function labChange(b){ if(b.dataset.mix) LAB.mix[b.dataset.mix] = !LAB.mix[b.dataset.mix]; else if(b.dataset.look) LAB.look = b.dataset.look; else if(b.dataset.font) LAB.font = b.dataset.font; else if(b.dataset.tog){ const k = b.dataset.tog; LAB.on[k] = !lab(k); if(k === 'sound' && lab(k)) setTimeout(() => snd('ok'), 30); }
  else { const a = b.dataset.lab; if(a === 'close'){ toggleLab(false); return; } if(a === 'all' || a === 'none') Object.keys(LAB.on).forEach(k => { LAB.on[k] = a === 'all' && k !== 'sound'; }); if(a === 'tips') LAB.coached = []; if(a === 'reset') labDefaults(); }
  labSave(); labApply(); labPanel(); render(); if(b.dataset.lab === 'tips') setTimeout(maybeSpot, 50); }
function labInit(){
  document.body.insertAdjacentHTML('beforeend', `<button id="labBtn" title="Style lab (L)">${IC('lab')}<span>Style lab</span></button><div id="labp" hidden></div><div id="toasts"></div><div id="hc"></div><div id="dragtip"></div>
    <div id="spot" hidden><div class="hole"></div><div class="scard"><small>NEW HERE</small><p></p><button class="btn pri">Got it</button></div></div><div id="reel" hidden></div>`);
  labApply();
  document.getElementById('labBtn').addEventListener('click', () => toggleLab());
  document.getElementById('labp').addEventListener('click', e => { const b = e.target.closest('[data-look],[data-font],[data-tog],[data-lab],[data-mix]'); if(b) labChange(b); });
  document.getElementById('labp').addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && (e.target.dataset.tog || e.target.dataset.mix)){ e.preventDefault(); labChange(e.target); } });
  // hold C: the look without the cockpit ingredients, to compare
  document.addEventListener('keydown', e => { if((e.key === 'c' || e.key === 'C') && !e.repeat && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) labApply(true); });
  document.addEventListener('keyup', e => { if(e.key === 'c' || e.key === 'C') labApply(); });
  document.getElementById('spot').addEventListener('click', hideSpot);
  let HC_EL = null, HC_T = 0;   // hover cards: one listener for the whole page
  document.addEventListener('mouseover', e => { const t = lab('hover') && e.target.closest ? e.target.closest('[data-hc]') : null; if(t === HC_EL) return; HC_EL = t; clearTimeout(HC_T); if(!t){ if(!e.target.closest || !e.target.closest('[data-setfare]')) hcHide(); return; }
    HC_T = setTimeout(() => { if(HC_EL === t && t.isConnected && !document.querySelector('.blk.dragging')){ const [kind, id] = t.dataset.hc.split(':'); if(kind === 'route') hcShowAt(t, routeCard(id)); } }, 280); });
  document.addEventListener('click', e => { if(e.target.closest && e.target.closest('button,.chip,select,[data-city],[data-sid]')) snd('click'); }, true);
}
labInit();
render();
</script>
