<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airline UI Sandbox — Pazzaz Pass</title>
<!--
  AIRLINE UI SANDBOX (16 Oct 2026). A small, stand-alone copy of the game's key screens for trying out the interface.
  Week 5 of chapter 1 (Monday 30 September 2030). Sample data, not the game's: change anything in DATA below.
  Screens: Home · Operating Plan · Flight times · Sums · Fuel · Fleet · Last week, and the second screen (the Operations
  Wall the class sees): the gold button or the W key. Also Route intelligence and Seasonality & events pages. Everything is in this one file; it works offline.
  STYLE LAB: the button at the bottom left (or L) switches between four looks (Night Ops, Airport Signage, Glass Cockpit,
  Day Ops), three typefaces (Inter and Barlow are built in) and eighteen instruments and effects, each on or off.
-->
<style>
:root{
  --bg:#050d1d; --panel:#0b1a33; --panel2:#0e2142; --line:#1c3f73; --line2:#2b5c9e;
  --ink:#eaf2ff; --soft:#9fbde3; --mute:#6f86a8; --cyan:#36c6ff; --blue:#1f6fff; --gold:#F2C14E;
  --good:#3ce394; --mid:#ffb547; --bad:#ff5f5f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
.mono{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:78px 1fr 64px;height:100vh;min-width:1100px}
/* header */
.hd{grid-column:1/3;display:flex;align-items:stretch;background:linear-gradient(90deg,#071630,#0b2147);border-bottom:1px solid var(--line)}
.logo{width:220px;display:flex;align-items:center;gap:12px;padding:0 18px;border-right:1px solid var(--line)}
.logo .badge{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a4f8a,#0b1a33);display:grid;place-items:center;color:var(--gold);font-size:22px}
.logo b{display:block;letter-spacing:.12em;font-size:16px}.logo small{display:block;color:var(--soft);font-size:9.5px;letter-spacing:.25em}
.hd-sp{flex:1}
.hd-tools{display:flex;align-items:center;gap:8px;padding:0 16px}
.ic{width:38px;height:38px;border:1px solid var(--line2);border-radius:6px;background:#0d2550;display:grid;place-items:center;font-size:17px}
.ic.on{background:var(--blue);border-color:var(--cyan)}
.hd-cell{display:flex;flex-direction:column;justify-content:center;padding:0 22px;border-left:1px solid var(--line);min-width:150px}
.hd-cell small{color:var(--soft);font-size:13px}.hd-cell b{font-size:21px}
.hd-cell .gold{color:var(--gold);font-size:26px}
.stars{color:var(--gold);font-size:19px;letter-spacing:2px}.stars i{font-style:normal;color:#4b6487}
/* nav */
.nav{background:#071328;border-right:1px solid var(--line);display:flex;flex-direction:column}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 18px;border:0;border-bottom:1px solid #12284d;background:none}
.nav button .ni{width:24px;text-align:center;font-size:18px;opacity:.85}
.nav button b{display:block;font-weight:600}.nav button small{display:block;color:var(--soft);font-size:12px}
.nav button.on{background:linear-gradient(90deg,#1f6fff,#1a4f9e);box-shadow:inset 4px 0 0 var(--cyan)}
.nav button .tick{margin-left:auto;color:var(--good);font-size:14px}
.nav .art{margin-top:auto;height:150px;background:linear-gradient(180deg,#0b1a33,#3a2a55 60%,#c77b3b);position:relative;overflow:hidden}
.nav .art::after{content:"✈";position:absolute;left:18px;bottom:22px;font-size:46px;color:#fff;opacity:.85;transform:rotate(-8deg)}
/* main */
.main{overflow:auto;padding:18px 22px}
.ttl{display:flex;align-items:baseline;gap:14px;margin:0 0 12px}.ttl h1{margin:0;font-size:30px}.ttl p{margin:0;color:var(--soft)}
.tag{font-size:11px;letter-spacing:.12em;padding:2px 8px;border:1px solid var(--cyan);border-radius:3px;color:var(--cyan)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.pnl h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:10px}.pnl h2 .sub{margin-left:auto;font-weight:400;font-size:13px;color:var(--soft)}
.kl{display:block;color:var(--soft);font-size:12.5px}
.big{font-size:26px;font-weight:700}
.good{color:var(--good)}.bad{color:var(--bad)}.goldt{color:var(--gold)}.soft{color:var(--soft)}
table.t{width:100%;border-collapse:collapse}table.t th,table.t td{padding:7px 8px;border-bottom:1px solid #15305a;text-align:left}
table.t th{color:var(--soft);font-weight:500;font-size:13px}table.t td.n,table.t th.n{text-align:right}
.btn{border:1px solid var(--line2);background:#0d2550;border-radius:5px;padding:7px 14px}
.btn.pri{background:var(--blue);border-color:var(--cyan);font-weight:600}
.btn.go{background:#15a05a;border-color:#3ce394;font-weight:700}
.link{border:0;background:none;color:var(--cyan);padding:0;font-weight:600}
/* action bar */
.bar{grid-column:2/3;display:flex;align-items:center;gap:12px;padding:0 18px;background:#071630;border-top:1px solid var(--line)}
.bar .i{width:26px;height:26px;border:1px solid var(--soft);border-radius:50%;display:grid;place-items:center;font-style:italic;color:var(--soft)}
.bar p{flex:1;margin:0;color:var(--ink)}
.bar .btn{padding:10px 22px;font-size:16px}
/* home */
.todo li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #15305a;list-style:none}
.todo{margin:0;padding:0}.todo .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:12px}
.todo .st.done{background:var(--good);border-color:var(--good);color:#04121f}.todo .st.now{border-color:var(--gold)}
.news p{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line2)}.news p b{color:var(--gold)}
.spark{display:flex;align-items:flex-end;gap:10px;height:110px;padding-top:8px}
.spark div{flex:1;background:#2b6fd6;border-radius:3px 3px 0 0;position:relative}.spark div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px}
.spark div em{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--soft);font-style:normal}
/* plan */
.rt td{vertical-align:middle}.flag{display:inline-block;width:22px;height:15px;border-radius:2px;margin-right:6px;vertical-align:-2px}
.fare{border:1px solid var(--line2);background:#0d2550;border-radius:4px;padding:3px 12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{border:1px solid var(--line2);background:#0d2550;border-radius:4px;padding:3px 9px;text-align:center;min-width:58px}
.chip b{display:block}.chip small{color:var(--soft);font-size:11px}.chip.on{background:var(--blue);border-color:var(--cyan)}
.fillbar{display:inline-block;width:120px;height:7px;background:#1b3560;border-radius:4px;vertical-align:middle;overflow:hidden}.fillbar i{display:block;height:100%;background:var(--good)}
.tt{position:relative}
.axis{display:grid;grid-template-columns:200px 1fr;margin:4px 0}.axis .ticks{position:relative;height:18px}.axis .ticks span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--soft)}
.lane{display:grid;grid-template-columns:200px 1fr;gap:0;margin-bottom:8px}
.lane .who{padding:6px 10px;border:1px solid var(--line);border-right:0;background:#0a1830;border-radius:5px 0 0 5px}
.lane .who b{display:block}.lane .who small{color:var(--soft)}
.lane select{margin-top:4px;width:100%;background:#0d2550;color:var(--ink);border:1px dashed var(--line2);border-radius:4px;padding:3px}
.track{position:relative;height:62px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,#0a1830 0,#0a1830 calc(12.5% - 1px),#13284a calc(12.5% - 1px),#13284a 12.5%);border-radius:0 5px 5px 0}
.blk{position:absolute;top:6px;bottom:6px;border-radius:4px;background:#123a74;border:1px solid #2b5c9e;border-left:4px solid var(--fc);padding:3px 7px;font-size:12.5px;overflow:hidden;white-space:nowrap;text-align:left}
.blk b{display:block}.blk.on{background:#1a4f9e;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(54,198,255,.45)}
.blk.f-good{--fc:var(--good)}.blk.f-mid{--fc:var(--mid)}.blk.f-low{--fc:var(--bad)}
.none{position:absolute;left:12px;top:20px;color:var(--soft)}
.selbox{display:flex;gap:8px;align-items:center;margin:4px 0 8px 200px;padding:8px 12px;border:1px solid var(--cyan);border-radius:5px;background:#0b2147}
.strip{display:grid;grid-template-columns:200px 1fr;margin-bottom:6px}
.strip .lbl{padding-right:10px;font-size:12.5px;color:var(--soft)}.strip .lbl b{display:block;color:#fff;font-size:14px}.strip .lbl .busy{color:var(--gold);font-weight:700}
.bands{position:relative;height:84px;border:1px solid var(--line);background:#071630}
.band{position:absolute;top:0;bottom:0;border-right:1px solid var(--line)}
.band .bar2{position:absolute;left:12%;right:12%;bottom:18px;background:rgba(90,162,255,.32);border-radius:3px 3px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.band .bar2 i{display:block;background:#5aa2ff}
.band.top .bar2{background:rgba(242,193,78,.35);box-shadow:0 0 0 1px var(--gold)}.band.top .bar2 i{background:var(--gold)}
.band .n{position:absolute;right:6px;top:3px;font-weight:700;font-size:13px}.band.top .n{color:var(--gold)}
.band .l{position:absolute;left:6px;bottom:2px;font-size:11.5px;color:var(--soft)}
.sum{display:flex;gap:26px;align-items:center;padding:10px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin-top:10px}
.sum .k{font-size:12.5px;color:var(--soft)}.sum b{font-size:20px}
/* sums */
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.card .hd2{display:flex;gap:10px;align-items:center}.card .num{width:28px;height:28px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:700}
.card h3{margin:0;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.sumno{display:inline-block;background:var(--blue);padding:1px 7px;border-radius:3px;font-size:12px;font-weight:700;margin:6px 6px 0 0}
.q{background:#fff;color:#000;border-radius:4px;padding:14px;text-align:center;margin:10px 0}.q .big2{font-size:28px;font-weight:800}
.ans{display:flex;gap:10px;align-items:center}.ans .in{display:flex;align-items:center;background:#fff;color:#000;border-radius:4px;padding:0 10px;height:46px;width:220px;font-size:20px}
.ans input{border:0;outline:0;font:inherit;width:100%;text-align:right}
.msg{min-height:20px;margin-top:6px;font-size:14px;color:var(--mid)}
.stamp{display:inline-block;border:2px solid var(--good);color:var(--good);border-radius:4px;padding:1px 8px;font-weight:800;font-size:11.5px;letter-spacing:.1em;transform:rotate(-4deg)}
.stamp.fin{border-color:var(--gold);color:var(--gold)}
/* fuel */
.fchart{width:100%;height:230px}
.tank{width:90px;height:150px;border:2px solid var(--line2);border-radius:12px 12px 6px 6px;position:relative;overflow:hidden;background:#071630}
.tank i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#36c6ff,#1f6fff)}
.blocks{display:flex;gap:6px;flex-wrap:wrap}.blocks button{min-width:84px}.blocks .on{background:var(--blue);border-color:var(--cyan)}
/* fleet */
.ac{display:flex;gap:14px;align-items:center}.ac .pic{width:120px;height:70px;border-radius:5px;background:linear-gradient(180deg,#2a5fa8,#0b1a33);display:grid;place-items:center;font-size:38px}
/* ---------- the second screen: the Operations Wall. Desk = act, wall = observe ----------
   One light source, top left. Three levels: 1 background (deep, muted), 2 opportunity (a little brighter, a gold mark),
   3 significant change (amber, or red for disruption; "New intelligence"; a single 350 ms glow). Square panels; type no heavier than 600. */
:root{
  --wall-bg-0:#020812; --wall-bg-1:#041426; --wall-bg-2:#071d36;
  --wall-bg:radial-gradient(circle at 35% -10%,rgba(39,142,240,.16),transparent 42%),linear-gradient(135deg,#020812 0%,#05162a 52%,#020b18 100%);
  --wall-panel:linear-gradient(155deg,#0d3159 0%,#081f3d 48%,#05152b 100%);
  --wall-panel-deep:linear-gradient(160deg,#092643 0%,#051629 100%);
  --wall-panel-active:linear-gradient(155deg,#123e64 0%,#092743 58%,#06192d 100%);
  --wline:rgba(65,122,171,.48); --wline2:rgba(53,96,135,.38);
  --c-cyan:#36C6FF; --c-blue:#278EF0; --c-green:#3CE394; --c-gold:#F2C14E; --c-amber:#FFB547; --c-red:#FF5F5F; --c-soft:#9FBDE3; --c-mute:#6F86A8;
  --wshadow:0 12px 32px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.025);
  --wshadow-up:0 18px 48px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.04);
}
.wallbtn{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--gold);border-radius:3px;background:rgba(242,193,78,.1);color:var(--gold);font-weight:600}
.wall{position:fixed;inset:0;background:var(--wall-bg);background-color:var(--wall-bg-0);z-index:20;display:flex;flex-direction:column;color:#eef5ff;font-weight:400}
.wall::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 112%,rgba(31,111,255,.14),transparent 55%),linear-gradient(rgba(120,175,235,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(120,175,235,.028) 1px,transparent 1px);background-size:100% 100%,56px 56px,56px 56px}
.wall>*{position:relative;z-index:1}
.wall b,.wall strong{font-weight:600}
.wall .mono,.wall .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wall .wh{flex:0 0 58px;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid rgba(54,198,255,.28);box-shadow:0 1px 0 rgba(54,198,255,.06),0 8px 30px rgba(0,0,0,.25);background:linear-gradient(180deg,rgba(13,49,89,.45),rgba(2,8,18,.4))}
.wall .wh h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.24em;white-space:nowrap;display:flex;align-items:center}
.wall .wh h1::before{content:"";width:9px;height:9px;margin-right:14px;background:var(--c-cyan);box-shadow:0 0 10px var(--c-cyan),0 0 2px #fff inset}.wall.lv .wh h1::before{background:var(--c-gold);box-shadow:0 0 10px var(--c-gold),0 0 2px #fff inset}
.wall .wh .sp{flex:1}
.seg{display:flex;border:1px solid var(--wline)}.seg button{border:0;background:transparent;padding:8px 16px;font-size:12px;font-weight:500;letter-spacing:.16em;color:var(--c-soft)}.seg button.on{background:rgba(31,111,255,.28);color:#fff;box-shadow:inset 0 -2px 0 var(--c-cyan),0 0 22px rgba(54,198,255,.22)}
.stamp2{font-size:11px;letter-spacing:.12em;color:var(--c-mute);white-space:nowrap}.stamp2 b{color:#d6e8ff;font-weight:500}
.wicon{width:32px;height:32px;border:1px solid transparent;border-radius:2px;background:transparent;color:var(--c-mute);font-size:18px;line-height:1}.wicon:hover,.wicon.on{color:var(--c-soft);border-color:var(--wline)}
.back{padding:9px 18px;border:1px solid var(--c-cyan);border-radius:2px;background:rgba(54,198,255,.1);font-weight:600;font-size:15px;white-space:nowrap}
.ribbon{flex:0 0 36px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--wline2);background:rgba(2,8,18,.45);font-size:14px;white-space:nowrap;overflow:hidden}
.ribbon .lbl{color:var(--c-gold);letter-spacing:.2em;font-size:11px;font-weight:600;margin-right:8px}
.ribbon button{border:1px solid rgba(65,122,171,.28);border-radius:2px;background:rgba(7,29,54,.5);padding:3px 11px 3px 9px;margin-right:8px;color:#d3e4f8;font-weight:400;display:inline-flex;align-items:center;gap:8px}
.ribbon button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c-cyan);box-shadow:0 0 6px rgba(54,198,255,.8)}.ribbon button.warn::before{background:var(--c-amber);box-shadow:0 0 6px var(--c-amber)}.ribbon button.bad::before{background:var(--c-red);box-shadow:0 0 7px var(--c-red)}.ribbon .dot{display:none}
.ribbon button.bad{color:#ffaaa3}.ribbon button.warn{color:#ffd28a}.ribbon button:hover{color:#fff;background:rgba(54,198,255,.08)}
.wbody{flex:1;min-height:0;padding:12px 18px 14px;display:grid;grid-template-rows:1fr 252px;gap:10px;overflow:hidden}.wbody.lv{grid-template-rows:1fr auto}
.wtop{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;min-height:0}
.wright{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}.wright.hero{grid-template-rows:1.3fr 1fr}
.wbot{display:grid;grid-template-columns:1.25fr 1fr .7fr;gap:10px;min-height:0}
/* panels: level 1 by default */
.wd{background:var(--wall-panel);border:1px solid var(--wline);border-radius:0;padding:12px 16px;overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:0;box-shadow:var(--wshadow)}
.wbot .wd{background:var(--wall-panel-deep);box-shadow:inset 0 1px rgba(255,255,255,.02)}
.wd::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,rgba(150,205,255,.45),rgba(150,205,255,.08) 55%,transparent);pointer-events:none}
.wd::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 0 0,rgba(54,198,255,.09),transparent 48%)}
.wd.l2::after{background:radial-gradient(circle at 0 0,rgba(242,193,78,.10),transparent 48%)}.wd.l3::after{background:radial-gradient(circle at 100% 0,rgba(255,181,71,.16),transparent 50%)}.wd.l3.red::after{background:radial-gradient(circle at 100% 0,rgba(255,95,95,.18),transparent 50%)}
.wd.hero::after{background:radial-gradient(circle at 100% 0,rgba(255,181,71,.22),transparent 55%),radial-gradient(circle at 0 100%,rgba(255,181,71,.06),transparent 40%)}.wd.hero.red::after{background:radial-gradient(circle at 100% 0,rgba(255,95,95,.24),transparent 55%),radial-gradient(circle at 0 100%,rgba(255,95,95,.06),transparent 40%)}
.wd>*{position:relative;z-index:1}
.wd h3{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.16em;color:#bcd4f2;display:flex;align-items:center;gap:8px;text-transform:uppercase;white-space:nowrap}
.wd h3::before{content:"";width:3px;height:12px;background:var(--c-cyan);opacity:.75;box-shadow:0 0 8px rgba(54,198,255,.6)}.wd.l2 h3::before{background:var(--c-gold);box-shadow:0 0 8px rgba(242,193,78,.6)}.wd.l3 h3::before{background:var(--c-amber);box-shadow:0 0 8px rgba(255,181,71,.7)}.wd.l3.red h3::before{background:var(--c-red);box-shadow:0 0 8px rgba(255,95,95,.7)}
.wd h3 .meta{margin-left:auto;font-weight:400;letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--c-mute)}
.wd h3 .lv{font-size:10px;letter-spacing:0}
/* level 2: an opportunity worth a look */
.wd.l2,.wbot .wd.l2{background:var(--wall-panel);border-color:rgba(242,193,78,.42)}.wd.l2 h3 .lv{color:var(--c-gold)}
/* level 3: a significant change */
.wd.l3{border-color:var(--c-amber);box-shadow:inset 3px 0 0 var(--c-amber),var(--wshadow)}.wd.l3.red{border-color:var(--c-red);box-shadow:inset 3px 0 0 var(--c-red),var(--wshadow)}
.wd.hero{background:var(--wall-panel-active);box-shadow:inset 0 2px 0 var(--c-amber),var(--wshadow-up)}.wd.hero.red{box-shadow:inset 0 2px 0 var(--c-red),var(--wshadow-up)}
.wd .kick{margin:-2px 0 10px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--c-amber);text-transform:uppercase}.wd.red .kick{color:#ff8a82}
.wd .kick span{letter-spacing:.01em;text-transform:none;font-weight:500;color:#ffe2b5;font-size:13.5px}.wd.red .kick span{color:#ffd0cc}
.wd.wake{animation:intelligenceWake 350ms ease-out 1}
@keyframes intelligenceWake{0%{box-shadow:0 0 0 rgba(242,193,78,0)}45%{box-shadow:0 0 26px rgba(242,193,78,.22)}100%{box-shadow:0 0 0 rgba(242,193,78,0)}}
.wd.hl{animation:hl 1.8s ease-out 1}
@keyframes hl{0%,35%{outline:2px solid var(--c-cyan);outline-offset:-2px}100%{outline:2px solid transparent;outline-offset:-2px}}
.wd .x{position:absolute;right:10px;top:7px;z-index:3;border:0;background:none;color:var(--c-soft);font-size:16px}
.wd select.arr{margin-left:auto;background:#061a32;color:#eef5ff;border:1px solid var(--wline);border-radius:2px;font-size:12px;letter-spacing:0;text-transform:none}
.wc{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.lnk{border:0;background:none;color:var(--c-cyan);padding:0;font-size:13.5px;font-weight:500;white-space:nowrap}.lnk:hover{text-decoration:underline}
.wfoot{margin-top:auto;padding-top:8px;display:flex;gap:18px;align-items:center}
.up{color:var(--c-green)}.dn{color:var(--c-red)}.wa{color:var(--c-amber)}.gd{color:var(--c-gold)}.sf{color:var(--c-soft)}
/* map: the hero */
.wd.mapp{padding:0;background:var(--wall-bg-0)}.wd.mapp::after{display:none}.wd.mapp h3::before{display:none}.wd.mapp h3{position:absolute;left:16px;right:16px;top:12px;z-index:1;margin:0}
.wmap{flex:1;min-height:0}.wmap svg{width:100%;height:100%;display:block}.wmap .city{cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--c-mute);margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:400}.legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:6px}
/* news: editorial; category, headline, consequence */
.nws{display:grid;flex:1;min-height:0;border-top:1px solid var(--wline2)}
.nws article{padding:10px 14px 4px;border-left:1px solid var(--wline2);display:flex;flex-direction:column;gap:6px;min-width:0}.nws article:first-child{border-left:0;padding-left:0}
.nws .k{font-size:10.5px;letter-spacing:.14em;font-weight:500;color:var(--c-soft);border-left:2px solid currentColor;padding-left:8px;display:flex;align-items:center}.nws .k.weather{color:#ff8a82}.nws .k.rival{color:var(--c-amber)}.nws .k.fuel{color:#c7a6ff}.nws .k.event{color:var(--c-gold)}.nws .k.market{color:var(--c-cyan)}.nws .k i{font-style:normal;font-size:15px;margin-right:6px;letter-spacing:0}
.nws b{font-size:16px;line-height:1.25;font-weight:550}
.nws .c{font-size:13px;font-weight:500}
.feed{position:absolute;top:104px;right:18px;bottom:18px;width:540px;z-index:4;background:var(--wall-panel-active);border:1px solid var(--c-cyan);padding:14px 18px;box-shadow:var(--wshadow-up);overflow:auto}
.feed article{padding:10px 0;border-bottom:1px solid var(--wline2)}.feed b{display:block;font-size:16px;font-weight:550}.feed small{color:var(--c-soft)}
.feed table{width:100%;border-collapse:collapse}.feed td,.feed th{padding:8px 6px;border-bottom:1px solid var(--wline2);text-align:left}.feed th{color:var(--c-soft);font-weight:500;font-size:12px}
/* fuel: does fuel need my attention? */
.fm{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.fm .pr{font-size:38px;font-weight:300;line-height:1}.fm .pr small{font-size:17px;color:var(--c-soft)}.fm .ch{margin-top:6px;font-size:15px;font-weight:500}
.fm svg{width:100%;height:62px}
.fl2{margin-top:auto;padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}.nextwk{padding:8px 12px;border-left:2px solid var(--c-cyan);background:rgba(54,198,255,.06)}.nextwk span{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--c-soft)}.nextwk b{font-size:18px;font-weight:500}.nextwk small{display:block;color:var(--c-soft);font-size:13px;margin-top:2px}
/* market outlook: signal tiles */
.sig{display:grid;grid-template-columns:repeat(3,1fr);flex:1;border-top:1px solid var(--wline2)}
.sig button{text-align:left;border:0;border-left:1px solid var(--wline2);border-bottom:1px solid var(--wline2);background:none;padding:7px 12px;display:grid;grid-template-columns:1fr auto;column-gap:8px;align-content:center;font-weight:400}
.sig button:nth-child(3n+1){border-left:0;padding-left:0}.sig button:hover{background:rgba(54,198,255,.06)}.sig button.on{background:rgba(54,198,255,.1);box-shadow:inset 0 -2px 0 var(--c-cyan)}
.sig button.u2{box-shadow:inset 3px 0 0 var(--c-green)}.sig button.u1{box-shadow:inset 3px 0 0 rgba(60,227,148,.5)}.sig button.d1{box-shadow:inset 3px 0 0 #ff8a7a}.sig button.on{box-shadow:inset 3px 0 0 var(--c-cyan),inset 0 -2px 0 var(--c-cyan)}.sig button{padding-left:10px!important}
.sig b{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.sig .s{font-size:11px;font-weight:600;letter-spacing:.08em;white-space:nowrap}.sig .t{grid-column:1/-1;font-size:12.5px;color:var(--c-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig .spk{grid-row:1/3;grid-column:2;display:flex;gap:2px;align-items:flex-end;height:22px;margin-left:2px}.sig .spk i{width:5px;background:currentColor;opacity:.8}
.u2{color:var(--c-green)}.u1{color:#86e3b3}.f0{color:var(--c-soft)}.d1{color:#ff8a7a}
/* events to watch */
.watch{display:flex;flex-direction:column;border-top:1px solid var(--wline2)}
.watch button{display:grid;grid-template-columns:128px 28px 1fr;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--wline2);background:none;padding:9px 0;font-weight:400}.watch button:hover{background:rgba(54,198,255,.06)}
.watch .w{font-size:10.5px;letter-spacing:.16em;font-weight:500;color:var(--c-mute)}.watch .w.now{color:var(--c-gold)}
.watch b{font-weight:500}.watch small{display:block;color:var(--c-soft);font-size:12px}
/* weather: a status strip */
.wxl{display:flex;flex-direction:column;border-top:1px solid var(--wline2)}.wxl div{display:grid;grid-template-columns:48px 30px 1fr;align-items:center;padding:0;border-bottom:1px solid var(--wline2);font-size:13.5px}
.wxl b{font-weight:500;letter-spacing:.1em;color:var(--c-soft)}.wxl span{font-size:17px;line-height:26px}.wxl em{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.14em;justify-self:start;padding:1px 8px;border:1px solid currentColor;border-radius:2px;opacity:.9}
.wxa{margin-top:8px;padding:5px 12px;border-left:3px solid var(--c-red);background:rgba(255,95,95,.08);font-size:14px;line-height:1.35}.wxa span{display:block;font-size:10.5px;letter-spacing:.16em;color:#ff9a92;font-weight:600}
/* your airline */
.ya{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}.ya svg{width:74px;height:74px;display:block}.ya b{display:block;font-size:30px;font-weight:300;line-height:1.1}.ya span{font-size:12px;color:var(--c-soft)}
/* the city briefing */
.mix{display:flex;flex-direction:column;gap:7px;margin:2px 0 12px}.mix div{display:grid;grid-template-columns:86px 1fr 40px;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.12em;color:var(--c-soft)}.mix i{display:block;height:8px;background:rgba(110,170,235,.12)}.mix u{display:block;height:100%}.mix b{text-align:right;font-size:14px;letter-spacing:0;color:#fff}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.facts span{color:var(--c-soft)}
.todbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;height:88px}.todbar div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.todbar i{display:block;width:70%;background:linear-gradient(180deg,#36C6FF,#1f6fff)}.todbar small{font-size:11px;color:var(--c-soft);white-space:nowrap;margin-top:4px}
/* shared with the desk's Route Intelligence page */
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini span{display:block;color:var(--soft);font-size:12px}.mini b{font-size:22px}
.prof{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:6px 0;background:var(--wline2)}.prof div{background:#071a33;padding:8px;text-align:center}.prof b{display:block;font-size:22px;font-weight:400}.prof i{display:block;height:4px;margin-top:6px;background:#1b3560;overflow:hidden}.prof i u{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl td,.tbl th{padding:5px 6px;border-bottom:1px solid var(--wline2);text-align:left}.tbl th{color:var(--soft);font-weight:500;font-size:12px}
/* settings: developer controls, kept small */
.sbx{position:absolute;right:22px;top:62px;z-index:5;width:320px;background:var(--wall-panel-active);border:1px solid var(--wline);padding:14px 16px;box-shadow:var(--wshadow-up)}.sbx label{display:flex;gap:8px;align-items:center;margin:6px 0}
.sbx h4{margin:12px 0 4px;font-size:10.5px;letter-spacing:.18em;font-weight:500;color:var(--c-mute)}.sbx h4:first-child{margin-top:0}
/* live operations */
.live{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;min-height:0}
.nextdep{margin:12px 0 0;padding:10px 14px;border:1px solid var(--wline2);border-left:3px solid var(--c-gold);background:rgba(2,8,18,.35)}.nextdep span{display:block;color:var(--c-soft);font-size:10.5px;letter-spacing:.16em}.nextdep b{display:block;font-size:20px;font-weight:500;margin:2px 0}.nextdep small{color:var(--c-soft)}
.opsfeed{margin-top:12px;flex:1;min-height:0;overflow:hidden;border-top:1px solid var(--wline2)}.opsfeed h4{margin:8px 0 4px;font-size:10.5px;letter-spacing:.16em;font-weight:500;color:var(--c-soft)}
.opsfeed div{display:grid;grid-template-columns:52px 1fr;padding:4px 0;font-size:13.5px;border-bottom:1px solid rgba(53,96,135,.2)}.opsfeed div:first-of-type{color:#fff}.opsfeed div:not(:first-of-type){color:var(--c-soft)}.opsfeed .t{font-variant-numeric:tabular-nums;color:var(--c-mute)}
.today{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:10px;background:var(--wline2)}.today div{background:#061a32;padding:8px 10px}.today span{display:block;color:var(--c-soft);font-size:11.5px}.today b{font-size:20px;font-weight:400}
.clock{font:300 42px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--c-gold);text-shadow:0 0 18px rgba(242,193,78,.45)}
.wall .btn{border-radius:3px}.wall .btn.pri{font-weight:500}
.board{width:100%;border-collapse:collapse;font:400 15.5px/1.2 ui-monospace,Menlo,Consolas,monospace}
.board th{color:var(--c-soft);text-align:left;padding:7px 8px;border-bottom:1px solid var(--wline);font:500 10.5px system-ui;letter-spacing:.16em;text-transform:uppercase}.board td{padding:8px;border-bottom:1px solid var(--wline2)}
.board .stt{color:var(--c-soft)}.board .stt.bo{color:var(--c-gold)}.board .stt.de{color:var(--c-green)}.board .stt.la{color:#7fb6ff}
/* desk: Outside your airline on Home, and the Seasonality & events page */
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #15305a;background:none;padding:8px 0;font-weight:400}.wrow span{flex:1}.wrow em{font-style:normal;color:var(--cyan);font-size:13px;white-space:nowrap}.wrow.bad span{color:#ffaaa3}.wrow.warn span{color:#ffd28a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{border:1px solid var(--line2);background:#0b1a33;padding:6px 12px;border-radius:2px}.chip.on{background:var(--blue);border-color:var(--cyan)}.chip small{color:var(--soft)}
.heat{width:100%;border-collapse:collapse;font-size:13px}.heat th{color:var(--soft);font-weight:500;padding:4px;text-align:center}.heat th:first-child{text-align:left}.heat td{padding:0;border:1px solid #071328;text-align:center;height:30px}.heat td:first-child{text-align:left;padding:0 8px;border:0;white-space:nowrap}.heat tr{cursor:pointer}.heat tr.on td:first-child{color:var(--cyan);font-weight:600}.heat td.cur{outline:2px solid #fff;outline-offset:-2px}
/* the Route Intelligence page */
.crumb{color:var(--soft);font-size:14px;margin-bottom:4px}.crumb b{color:var(--cyan)}
.rhead{display:flex;align-items:center;gap:14px;margin-bottom:12px}.rhead .bigflag{width:64px;height:44px;border-radius:3px}.rhead h1{margin:0;font-size:34px}.rhead h1 small{font-size:22px;color:var(--soft);font-weight:500}
.ri{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px}.ri .pnl{min-height:0}.ri svg{width:100%;max-height:190px;display:block}.ri .lg{font-size:12.5px;color:var(--soft);margin:-4px 0 6px}
.notice{border:1px solid var(--gold);background:rgba(242,193,78,.06)}.notice li{margin:4px 0}

/* =====================================================================
   PAZZAZ PASS — 16 Oct 2026
   The desk now shares the Wall's depth language. Motion is purposeful:
   focus, state change and cause/effect only. No dotted/slashed-zero mono.
   ===================================================================== */
:root{
  --desk-bg-0:#020812;
  --desk-bg-1:#05162a;
  --desk-bg-2:#082542;
  --desk-panel:linear-gradient(155deg,#0d3159 0%,#081f3d 48%,#05152b 100%);
  --desk-panel-deep:linear-gradient(160deg,#092643 0%,#051629 100%);
  --desk-panel-active:linear-gradient(155deg,#123e64 0%,#092743 58%,#06192d 100%);
  --desk-line:rgba(65,122,171,.46);
  --desk-line-soft:rgba(53,96,135,.34);
  --glow-cyan:0 0 20px rgba(54,198,255,.18);
  --glow-gold:0 0 22px rgba(242,193,78,.18);
  --glow-green:0 0 20px rgba(60,227,148,.18);
  --glow-red:0 0 22px rgba(255,95,95,.18);
}

html,body{
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
  background:
    radial-gradient(circle at 58% -14%,rgba(39,142,240,.15),transparent 38%),
    radial-gradient(circle at 102% 88%,rgba(31,111,255,.08),transparent 42%),
    linear-gradient(135deg,var(--desk-bg-0),var(--desk-bg-1) 55%,#020b18);
}
/* Numeric alignment without changing to a technical face. */
.mono,.num,.clock,.board,.board td{
  font-family:inherit!important;
  font-variant-numeric:tabular-nums lining-nums!important;
  font-feature-settings:"tnum" 1,"lnum" 1!important;
  font-variant-ligatures:none;
}

/* Ambient background light: almost imperceptible, slow enough not to distract. */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 28% 18%,rgba(54,198,255,.055),transparent 34%),
    radial-gradient(ellipse at 84% 68%,rgba(31,111,255,.035),transparent 38%);
  animation:ambientDrift 18s ease-in-out infinite alternate;
}
@keyframes ambientDrift{
  from{transform:translate3d(-1.2%,0,0) scale(1);opacity:.78}
  to{transform:translate3d(1.2%,1%,0) scale(1.025);opacity:1}
}

.app{position:relative;z-index:1;background:transparent}

/* ---------- header: active system, not a static bar ---------- */
.hd{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 36% -65%,rgba(79,176,255,.22),transparent 52%),
    linear-gradient(100deg,#06142d 0%,#0b2a50 48%,#071832 100%);
  border-bottom:1px solid rgba(54,198,255,.28);
  box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 -1px rgba(255,255,255,.025);
}
.hd::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(110deg,transparent 0 42%,rgba(95,190,255,.055) 48%,transparent 54%),
    linear-gradient(rgba(120,175,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,175,235,.025) 1px,transparent 1px);
  background-size:100% 100%,42px 42px,42px 42px;
}
.hd::after{
  content:"";position:absolute;left:220px;right:0;bottom:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(54,198,255,.14) 18%,rgba(54,198,255,.75) 50%,rgba(54,198,255,.12) 82%,transparent 100%);
  background-size:240px 1px;
  animation:headerScan 9s linear infinite;
}
@keyframes headerScan{from{background-position:-240px 0}to{background-position:calc(100vw + 240px) 0}}
.logo{position:relative;background:linear-gradient(150deg,rgba(9,37,72,.88),rgba(4,18,39,.94));border-right-color:rgba(54,198,255,.18)}
.logo .badge{
  position:relative;border-radius:2px;
  background:radial-gradient(circle at 35% 28%,#315b98 0%,#122d55 52%,#07172f 100%);
  border:1px solid rgba(76,153,216,.42);
  box-shadow:0 8px 18px rgba(0,0,0,.26),inset 0 1px rgba(255,255,255,.08),0 0 20px rgba(242,193,78,.13);   /* lit, not flashing */
  text-shadow:0 0 10px rgba(242,193,78,.45);
}
.hd-sp{position:relative;overflow:hidden;min-width:180px}
/* the aircraft and its line: see .sky in Pazzaz pass 2 */
.hd-cell{border-left-color:rgba(65,122,171,.38);background:linear-gradient(180deg,rgba(12,43,79,.16),rgba(1,8,18,.05))}
.hd-cell b{font-weight:580;letter-spacing:-.01em}.hd-cell .gold{font-weight:600;text-shadow:0 0 16px rgba(242,193,78,.18)}
.ic{border-radius:2px;background:linear-gradient(155deg,#10355f,#081d3a);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease,background .18s ease}
.ic:hover{border-color:rgba(54,198,255,.68);box-shadow:var(--glow-cyan);transform:translateY(-1px)}
.ic.on{box-shadow:inset 0 -2px var(--cyan),var(--glow-cyan)}
.wallbtn{transition:background .18s ease,box-shadow .18s ease,transform .18s ease}.wallbtn:hover{transform:translateY(-1px);background:rgba(242,193,78,.15);box-shadow:var(--glow-gold)}

/* ---------- navigation ---------- */
.nav{background:linear-gradient(180deg,#06142a 0%,#07172e 60%,#08162a 100%);border-right-color:rgba(65,122,171,.36);box-shadow:12px 0 28px rgba(0,0,0,.12)}
.nav button{position:relative;transition:background .2s ease,color .2s ease,box-shadow .2s ease;padding-top:14px;padding-bottom:14px}
.nav button:hover:not(.on){background:linear-gradient(90deg,rgba(31,111,255,.07),rgba(31,111,255,0));color:#fff}
.nav button.on{
  background:linear-gradient(100deg,#1677e7 0%,#195eb9 72%,#124582 100%);
  box-shadow:inset 4px 0 0 var(--cyan),inset 0 1px rgba(255,255,255,.08),0 0 24px rgba(31,111,255,.10);
}
.nav button.on::after{content:"";position:absolute;right:0;top:16%;bottom:16%;width:1px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);opacity:.65}
.nav button b{font-weight:560}.nav .art{filter:saturate(.9) brightness(.9)}

/* ---------- stage ---------- */
.main{
  position:relative;
  background:
    radial-gradient(circle at 12% 0%,rgba(54,198,255,.055),transparent 28%),
    radial-gradient(circle at 88% 70%,rgba(31,111,255,.035),transparent 38%);
}
.app::after{content:"";position:fixed;left:220px;right:0;top:78px;height:1px;pointer-events:none;background:linear-gradient(90deg,rgba(54,198,255,.16),transparent 52%)}
.main.screen-in{animation:screenIn .24s cubic-bezier(.2,.75,.25,1) both}
@keyframes screenIn{from{opacity:.78;transform:translateY(4px)}to{opacity:1;transform:none}}
.ttl{margin-bottom:14px;align-items:flex-end}.ttl h1{font-size:31px;font-weight:590;letter-spacing:-.025em;line-height:1.05;text-shadow:0 2px 16px rgba(0,0,0,.24)}.ttl p{font-size:14px;padding-bottom:2px}
.tag{border-radius:2px;background:rgba(54,198,255,.055);box-shadow:inset 0 0 14px rgba(54,198,255,.025);font-weight:520}

/* ---------- panel depth + focus lighting ---------- */
.pnl,.card,.sum{
  position:relative;
  background:var(--desk-panel);
  border:1px solid var(--desk-line);
  border-radius:2px;
  box-shadow:0 10px 28px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.028);
}
.pnl::before,.card::before,.sum::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,rgba(151,207,255,.40),rgba(151,207,255,.08) 58%,transparent);
}
.pnl{transition:border-color .22s ease,box-shadow .22s ease,filter .22s ease,background .22s ease}
.pnl:focus-within,.card:focus-within{
  border-color:rgba(54,198,255,.68);
  box-shadow:inset 3px 0 0 var(--cyan),0 0 24px rgba(54,198,255,.09),0 14px 30px rgba(0,0,0,.18);
}
.pnl h2{font-weight:565;letter-spacing:-.008em}.pnl h2::before{content:"";width:3px;height:13px;background:rgba(54,198,255,.76);box-shadow:0 0 9px rgba(54,198,255,.34);flex:none}.pnl h2 .sub{font-weight:400}
.big{font-weight:590;letter-spacing:-.025em}.kl{letter-spacing:.015em}

/* Data tables should feel like live instruments, not printed grids. */
table.t th,table.t td{border-bottom-color:rgba(53,96,135,.34);transition:background .18s ease,color .18s ease}
table.t tbody tr:hover td{background:rgba(54,198,255,.035)}
table.t th{font-weight:470;letter-spacing:.015em}

/* ---------- buttons: tiny mechanical response ---------- */
.btn,.fare,.chip{
  border-radius:2px;
  background:linear-gradient(155deg,#10355f,#081d3a);
  border-color:rgba(65,122,171,.58);
  transition:transform .14s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease,filter .18s ease;
}
.btn:hover,.fare:hover,.chip:hover{transform:translateY(-1px);border-color:rgba(54,198,255,.78);box-shadow:0 5px 16px rgba(0,0,0,.18),0 0 14px rgba(54,198,255,.08)}
.btn:active,.fare:active,.chip:active{transform:translateY(0);filter:brightness(.92)}
.btn.pri{background:linear-gradient(155deg,#278ef0,#175fbe 62%,#104b96);border-color:#52c6ff;font-weight:560;box-shadow:0 0 18px rgba(31,111,255,.11),inset 0 1px rgba(255,255,255,.08)}
.btn.pri:hover{box-shadow:0 7px 20px rgba(0,0,0,.22),0 0 22px rgba(54,198,255,.18)}
.btn.go{background:linear-gradient(155deg,#22ba73,#128653 64%,#0b6941);font-weight:600;border-color:#4ce79d;box-shadow:0 0 20px rgba(60,227,148,.12)}
.btn.go:hover{box-shadow:0 7px 20px rgba(0,0,0,.22),0 0 24px rgba(60,227,148,.22)}
.link{font-weight:520;text-underline-offset:3px}.link:hover{text-decoration:underline;text-decoration-thickness:1px}

/* ---------- footer/action rail ---------- */
.bar{
  background:linear-gradient(180deg,#08203d,#06172f);
  border-top-color:rgba(54,198,255,.28);
  box-shadow:0 -8px 24px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.02);
}
.bar .i{border-color:rgba(159,189,227,.55);box-shadow:0 0 12px rgba(54,198,255,.06)}
.bar p{font-size:14px;color:#dcecff}

/* ---------- Home: current item and data arriving ---------- */
.todo li{position:relative;border-bottom-color:rgba(53,96,135,.32);transition:background .18s ease}.todo li:hover{background:rgba(54,198,255,.025)}
.todo .st{border-radius:50%;transition:box-shadow .2s ease,border-color .2s ease,background .2s ease}
.todo .st.now{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,193,78,.055),0 0 14px rgba(242,193,78,.16);animation:taskBeacon 4s ease-in-out infinite}
@keyframes taskBeacon{0%,74%,100%{box-shadow:0 0 0 4px rgba(242,193,78,.04),0 0 10px rgba(242,193,78,.10)}82%{box-shadow:0 0 0 7px rgba(242,193,78,.02),0 0 20px rgba(242,193,78,.20)}}
.spark div{border-radius:1px 1px 0 0;background:linear-gradient(180deg,#3c8aee,#1d5fbd 72%,#16498f);transform-origin:bottom;animation:barRise .58s cubic-bezier(.2,.75,.25,1) both;box-shadow:inset 0 1px rgba(255,255,255,.08),0 0 10px rgba(31,111,255,.05)}
.spark div:nth-child(2){animation-delay:.06s}.spark div:nth-child(3){animation-delay:.12s}.spark div:nth-child(4){animation-delay:.18s}
@keyframes barRise{from{transform:scaleY(.08);opacity:.4}to{transform:scaleY(1);opacity:1}}
.wrow{transition:background .18s ease,padding-left .18s ease}.wrow:hover{background:rgba(54,198,255,.035);padding-left:5px}

/* ---------- plan / timetable ---------- */
.flag{border-radius:1px}.fare{font-weight:600}.chip{font-weight:500}.chip.on{background:linear-gradient(155deg,#278ef0,#175fbe);box-shadow:inset 0 -2px 0 var(--cyan),0 0 14px rgba(54,198,255,.12)}
.fillbar{border-radius:1px;background:#102d51;box-shadow:inset 0 1px 4px rgba(0,0,0,.35)}.fillbar i{background:linear-gradient(90deg,#1eaf72,#4ce6a0);transition:width .38s cubic-bezier(.2,.75,.25,1);box-shadow:2px 0 8px rgba(60,227,148,.22)}
.lane .who{border-radius:2px 0 0 2px;background:linear-gradient(155deg,#0b294c,#071b35)}
.lane select{border-radius:2px;background:#092544;transition:border-color .18s ease,box-shadow .18s ease}.lane select:focus{outline:none;border-style:solid;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(54,198,255,.10)}
.track{border-radius:0 2px 2px 0;background:repeating-linear-gradient(90deg,#071c34 0,#071c34 calc(12.5% - 1px),#123052 calc(12.5% - 1px),#123052 12.5%);box-shadow:inset 0 0 18px rgba(0,0,0,.22)}
.blk{border-radius:2px;background:linear-gradient(155deg,#164987,#103764);transition:left .34s cubic-bezier(.2,.75,.25,1),width .34s ease,background .18s ease,box-shadow .18s ease,border-color .18s ease}
.blk.on{background:linear-gradient(155deg,#1d66b4,#174983);box-shadow:inset 0 1px rgba(255,255,255,.06),0 0 0 1px rgba(54,198,255,.5),0 0 22px rgba(54,198,255,.13);animation:selectedBreath 3.8s ease-in-out infinite}
@keyframes selectedBreath{0%,100%{box-shadow:inset 0 1px rgba(255,255,255,.06),0 0 0 1px rgba(54,198,255,.48),0 0 15px rgba(54,198,255,.08)}50%{box-shadow:inset 0 1px rgba(255,255,255,.07),0 0 0 1px rgba(54,198,255,.7),0 0 24px rgba(54,198,255,.16)}}
.selbox{border-radius:2px;background:var(--desk-panel-active);box-shadow:inset 3px 0 0 var(--cyan),0 0 20px rgba(54,198,255,.08)}
.bands{background:linear-gradient(180deg,#071a31,#061527);box-shadow:inset 0 0 20px rgba(0,0,0,.18)}
.band .bar2{border-radius:1px 1px 0 0}.band.top .bar2{box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(242,193,78,.10)}
.sum{border-radius:2px;background:linear-gradient(155deg,#10345d,#09223f 58%,#06172e)}

/* ---------- calculations: one coherent cockpit instrument ---------- */
.card{
  border-radius:2px;padding:16px 18px;
  background:
    radial-gradient(circle at 8% 0%,rgba(54,198,255,.075),transparent 34%),
    linear-gradient(155deg,#0d3159,#081f3d 50%,#05152b);
  border-left:3px solid rgba(65,122,171,.46);
}
.card .hd2{min-height:32px}.card .num{border-radius:2px;background:linear-gradient(155deg,#278ef0,#1459ad);font-weight:600;box-shadow:0 0 14px rgba(31,111,255,.12)}
.card h3{font-size:15px;font-weight:560;letter-spacing:.10em}
.sumno{background:rgba(31,111,255,.18);color:#88ccff;border:1px solid rgba(54,198,255,.42);border-radius:2px;font-weight:560;letter-spacing:.06em}
.q{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 120%,rgba(31,111,255,.12),transparent 44%),
    linear-gradient(155deg,#091c35,#061426 68%,#04101f)!important;
  color:var(--ink)!important;
  border:1px solid rgba(65,122,171,.60);
  border-radius:2px;
  padding:18px 18px 20px;
  box-shadow:inset 0 1px rgba(255,255,255,.025),0 9px 22px rgba(0,0,0,.14);
}
.q .soft{color:#9fbde3!important;font-size:13px;letter-spacing:.01em}.q .big2{font-size:29px;font-weight:560;letter-spacing:-.025em;margin-top:8px;color:#f3f8ff}
.unknown{display:inline-block;color:var(--gold);font-weight:650;text-shadow:0 0 16px rgba(242,193,78,.38);animation:unknownBreathe 2.8s ease-in-out infinite}
@keyframes unknownBreathe{0%,100%{text-shadow:0 0 10px rgba(242,193,78,.24)}50%{text-shadow:0 0 22px rgba(242,193,78,.50)}}
.calc-result{display:inline-block;color:var(--good);font-weight:650;text-shadow:0 0 18px rgba(60,227,148,.28);animation:resultPop .55s cubic-bezier(.18,.85,.26,1.2) both}
@keyframes resultPop{0%{transform:scale(.86);opacity:.2;text-shadow:0 0 0 rgba(60,227,148,0)}52%{transform:scale(1.06);opacity:1;text-shadow:0 0 24px rgba(60,227,148,.55)}100%{transform:scale(1);text-shadow:0 0 14px rgba(60,227,148,.24)}}
.ans{gap:9px}.ans .in{
  background:linear-gradient(180deg,#08192f,#061325)!important;color:#f2f7ff!important;border:1px solid rgba(65,122,171,.68);border-radius:2px;height:46px;
  box-shadow:inset 0 4px 12px rgba(0,0,0,.22);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.ans .in:focus-within{border-color:var(--cyan);background:#081d38!important;box-shadow:inset 0 4px 12px rgba(0,0,0,.18),0 0 0 2px rgba(54,198,255,.08),0 0 18px rgba(54,198,255,.10)}
.ans input{color:#fff;background:transparent!important;caret-color:var(--cyan)}
.msg{font-size:13.5px}.stamp{border-radius:2px;font-weight:650;transform:rotate(-2deg);animation:stampIn .34s cubic-bezier(.2,.9,.25,1.2) both;box-shadow:0 0 12px rgba(60,227,148,.10)}
@keyframes stampIn{from{transform:rotate(-6deg) scale(.76);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}

/* ---------- fuel: make the instrument feel physically alive ---------- */
.tank{border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#071d34,#04111f);box-shadow:inset 0 0 20px rgba(0,0,0,.28),0 8px 20px rgba(0,0,0,.18);overflow:hidden}
.tank i{transition:height .7s cubic-bezier(.2,.75,.25,1);box-shadow:inset 0 6px 12px rgba(255,255,255,.06),0 -2px 12px rgba(54,198,255,.35)}
.tank i::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,rgba(190,239,255,.15),rgba(190,239,255,.75),rgba(190,239,255,.15));opacity:.5;pointer-events:none}
.blocks button{transition:transform .15s ease,box-shadow .18s ease}.blocks .on{box-shadow:0 0 16px rgba(54,198,255,.14)}
.fchart path,.fchart polyline{filter:drop-shadow(0 0 4px rgba(54,198,255,.12))}

/* ---------- fleet / references ---------- */
.ac .pic{border-radius:2px;background:radial-gradient(circle at 30% 10%,rgba(97,181,255,.24),transparent 42%),linear-gradient(155deg,#164c82,#0b2748 62%,#06182e);box-shadow:inset 0 1px rgba(255,255,255,.05),0 9px 24px rgba(0,0,0,.18)}
.notice{background:linear-gradient(155deg,rgba(242,193,78,.075),rgba(242,193,78,.025));box-shadow:inset 3px 0 0 var(--gold),0 10px 26px rgba(0,0,0,.12)}

/* Cause/effect: freshly completed results briefly illuminate when they appear. */
.good,.goldt,.bad{transition:color .2s ease,text-shadow .2s ease}
.card .good,.sum .good{ text-shadow:0 0 12px rgba(60,227,148,.16)}
.card .goldt,.sum .goldt{ text-shadow:0 0 12px rgba(242,193,78,.16)}

/* Keep motion optional and respectful. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}

/* =====================================================================
   PAZZAZ PASS 2 (16 Oct 2026): motion that survives a redraw, so it can carry meaning.
   Every click redraws the screen. Left alone, a bar cannot grow (it is a new bar) and every loop starts again.
   So (see "MOTION THAT SURVIVES A REDRAW" in the script):
   · slow loops carry the page's age (--loop), so the header aircraft and the breathing lights never restart;
   · moving things (data-k) start where they were and travel to where they are now;
   · a changed figure (data-v) lights once: green better, red worse, cyan just changed;
   · one-off effects (data-fx: a pop, a stamp, a shimmer) keep their place in time if the screen redraws mid-way.
   ===================================================================== */
#app{--loop:0s}
select{font:inherit}

/* the header's aircraft flies along its line, about once every 27 seconds */
.sky{position:absolute;left:5%;right:4%;top:50%;height:0;transform:rotate(-6deg);pointer-events:none}
.sky::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(90,175,240,.42) 18%,rgba(90,175,240,.16) 72%,transparent)}
.sky i{position:absolute;top:-8px;left:-4%;width:22px;height:16px;opacity:0;animation:headerPlane 27s linear infinite}
.sky i svg{display:block;width:22px;height:16px;overflow:visible;filter:drop-shadow(0 0 5px rgba(109,201,255,.85))}
.sky i::before{content:"";position:absolute;right:19px;top:7.5px;width:84px;height:1px;background:linear-gradient(90deg,transparent,rgba(200,235,255,.45))}
@keyframes headerPlane{0%,4%{left:-4%;opacity:0}9%{opacity:.85}40%{opacity:.85}46%,100%{left:102%;opacity:0}}

/* focus lighting, from the state of the page rather than the browser's focus (a redraw loses that) */
.pnl.focus,.card.focus{border-color:rgba(54,198,255,.68);box-shadow:inset 3px 0 0 var(--cyan),0 0 24px rgba(54,198,255,.09),0 14px 30px rgba(0,0,0,.18);background:radial-gradient(circle at 0 0,rgba(54,198,255,.075),transparent 42%),var(--desk-panel-active)}
.card.focus{border-left-color:var(--cyan);box-shadow:0 0 24px rgba(54,198,255,.09),0 14px 30px rgba(0,0,0,.18)}

/* a figure that changed lights once */
.chg{--chg:rgba(54,198,255,.75);animation:chg 1.1s ease-out both}
.chg.up{--chg:rgba(60,227,148,.8)}.chg.dn{--chg:rgba(255,95,95,.75)}.chg.au{--chg:rgba(242,193,78,.75)}
@keyframes chg{0%{text-shadow:0 0 0 transparent}18%{color:#fff;text-shadow:0 0 16px var(--chg),0 0 2px var(--chg)}100%{text-shadow:0 0 0 transparent}}
.delta{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:2px;font-size:12.5px;font-weight:600;vertical-align:2px;animation:deltaIn 2.6s ease-out both}
.delta.up{color:var(--good);background:rgba(60,227,148,.12)}.delta.dn{color:var(--bad);background:rgba(255,95,95,.12)}
@keyframes deltaIn{0%{opacity:0;transform:translateY(4px)}10%,78%{opacity:1;transform:none}100%{opacity:0}}

/* the plan: moving and growing things */
.band .bar2,.band .bar2 i{transition:height .38s cubic-bezier(.2,.75,.25,1)}
.blk.deny{animation:deny .65s ease-out both}
@keyframes deny{0%,100%{border-color:#2b5c9e}25%{border-color:var(--mid);box-shadow:0 0 0 2px rgba(255,181,71,.65),0 0 18px rgba(255,181,71,.3)}}
.note{margin:6px 0 0 200px;color:var(--mid);font-size:13.5px}
.selbox .soft{margin-right:auto}

/* charts rise when a screen is first shown (and the seasonality chart when the route changes) */
.spark div{animation:none}
.main.screen-in .spark div{animation:barRise .58s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0) * 60ms)}
svg .col{transform-box:fill-box;transform-origin:50% 100%}
.main.screen-in svg .col,svg.rise .col{animation:barRise .58s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0) * 35ms)}
.main.screen-in .fchart .price{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .1s cubic-bezier(.3,.6,.3,1) forwards}
.main.screen-in .fchart .fc{animation:fadeIn .5s .85s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wall.screen-in{animation:screenIn .24s cubic-bezier(.2,.75,.25,1) both}

/* calculations, the calmest screen: the focus rail, the unknown's glow, the result. Nothing else moves */
.card .tag{transition:color .2s ease,border-color .2s ease}
.card:not(.focus):not(.done) .tag{color:var(--soft);border-color:var(--desk-line);background:none}
.card.done{border-left-color:rgba(60,227,148,.55)}.card.done.fin{border-left-color:rgba(242,193,78,.6)}
.card .tag.ok{color:var(--good);border-color:rgba(60,227,148,.6);background:rgba(60,227,148,.06)}.card .tag.fin{color:var(--gold);border-color:rgba(242,193,78,.6);background:rgba(242,193,78,.06)}
.card.focus .q{border-color:rgba(54,198,255,.55);box-shadow:inset 0 1px rgba(255,255,255,.03),0 9px 22px rgba(0,0,0,.14),0 0 22px rgba(54,198,255,.07)}
.unknown{animation:none;text-shadow:0 0 10px rgba(242,193,78,.22);opacity:.8}
.card.focus .unknown{opacity:1;animation:unknownBreathe 4s ease-in-out infinite}
.calc-result{animation:none}.calc-result.fin{color:var(--gold);text-shadow:0 0 12px rgba(242,193,78,.2)}
.calc-result.pop,.ftv.pop{animation:resultPop .55s cubic-bezier(.18,.85,.26,1.2) both}
.stamp{animation:none}.stamp.pop{animation:stampIn .34s cubic-bezier(.2,.9,.25,1.2) both}
.card .hd2 h3{font-size:13.5px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.card .hd2 .tag{font-size:10.5px;letter-spacing:.1em;white-space:nowrap}
.ans .in{flex:1;min-width:0;width:auto;max-width:240px}.ans button{white-space:nowrap}
.ans .in .u{color:var(--soft);flex:none}
.ans .in.query{border-color:var(--mid);box-shadow:inset 0 4px 12px rgba(0,0,0,.22),0 0 14px rgba(255,181,71,.12)}
.sent{margin:10px 0 0;font-size:13.5px;color:var(--soft)}.sent b{color:#dcecff;font-weight:560}
/* the operating model: where the answers go. A gap waits for its sum; the answer arrives and lights */
.model{margin-bottom:14px;padding-bottom:12px}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:10px}
.mc{position:relative;padding:9px 12px 8px;border:1px solid var(--desk-line-soft);background:rgba(2,10,24,.35);border-radius:2px;min-width:0}
.mc .k{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.mc b{display:inline-block;font-size:24px;font-weight:580;line-height:1.25;letter-spacing:-.015em}
.mc small{display:block;font-size:12.5px;color:var(--mute)}
.mc.wait{border:1px dashed rgba(242,193,78,.5);background:rgba(242,193,78,.035)}.mc.wait b{color:var(--gold)}.mc.wait small{color:#d9b866}
.mc.you small{color:var(--good)}.mc.you.fin small{color:var(--gold)}
.mc.model-f b{font-size:15px;font-weight:500;line-height:1.5;color:#cfe1f7}.mc.model-f b span{color:var(--soft);font-weight:400}
.mc.arrive{animation:arrive 1.3s ease-out both}.mc.arrive b{animation:resultPop .55s cubic-bezier(.18,.85,.26,1.2) both}
@keyframes arrive{0%{border-color:var(--good);background-color:rgba(60,227,148,.16);box-shadow:0 0 0 rgba(60,227,148,0)}30%{border-color:var(--good);box-shadow:0 0 26px rgba(60,227,148,.28)}100%{box-shadow:0 0 0 rgba(60,227,148,0)}}
.fly{position:fixed;z-index:60;pointer-events:none;padding:1px 10px;border:1px solid var(--good);border-radius:2px;background:rgba(5,30,28,.92);color:var(--good);font-size:20px;font-weight:650;white-space:nowrap;box-shadow:0 0 22px rgba(60,227,148,.35);transition:transform .7s cubic-bezier(.45,.05,.25,1)}
.fly.fin{border-color:var(--gold);color:var(--gold);background:rgba(30,24,5,.92);box-shadow:0 0 22px rgba(242,193,78,.3)}
.trail{position:fixed;z-index:59;height:1px;transform-origin:0 50%;pointer-events:none;background:linear-gradient(90deg,rgba(60,227,148,0),rgba(60,227,148,.75));animation:trail 1s ease-out both}
.trail.fin{background:linear-gradient(90deg,rgba(242,193,78,0),rgba(242,193,78,.75))}
@keyframes trail{0%{transform:var(--r) scaleX(0);opacity:1}65%{transform:var(--r) scaleX(1);opacity:1}100%{transform:var(--r) scaleX(1);opacity:0}}
/* flight times: the table is where the answer lives */
td.ask{background:linear-gradient(155deg,#0f3863,#0a2647);box-shadow:inset 3px 0 0 var(--cyan)}
td.arrive{animation:tdArrive 1.3s ease-out both}
@keyframes tdArrive{0%{background-color:rgba(60,227,148,.18)}30%{background-color:rgba(60,227,148,.14);box-shadow:inset 3px 0 0 var(--good)}100%{background-color:transparent;box-shadow:inset 3px 0 0 transparent}}
.ftv{display:inline-block}
td.ask .unknown{opacity:1;animation:unknownBreathe 4s ease-in-out infinite}

/* fuel: a resource moving into a tank. Gold line = this week's flying; the dashed block = the order before you confirm it */
.posn{display:flex;gap:18px;align-items:flex-start}
.tankw{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.tank{width:88px;height:168px}
.posn .t td{padding:6px 6px}.posn .t td:first-child{white-space:nowrap}
.tank .order{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(54,198,255,.20) 0 6px,rgba(54,198,255,.08) 6px 12px);border-top:1px dashed var(--cyan);transition:bottom .7s cubic-bezier(.2,.75,.25,1),height .35s ease}
.tank .need{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);opacity:.85}
.tank.shimmer i::after{animation:shimmer 1.3s ease-out both}
@keyframes shimmer{0%{opacity:.5;background:linear-gradient(90deg,rgba(190,239,255,0) 0%,rgba(190,239,255,0) 100%)}30%{opacity:1;height:3px;background:linear-gradient(90deg,rgba(190,239,255,.1),#fff 50%,rgba(190,239,255,.1))}100%{opacity:.5}}
.tlegend{font-size:11.5px;color:var(--soft);line-height:1.5;text-align:left;white-space:nowrap}.tlegend i{display:inline-block;width:16px;vertical-align:middle;margin-right:5px}
.ordtotal{margin:12px 0 6px;font-size:15px}.ordtotal b{font-size:19px}

/* live operations, the busiest screen: boarding breathes, departures and the feed light as they happen */
.stt.bo::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--c-gold);vertical-align:1px;animation:board 1.8s ease-in-out infinite}
@keyframes board{0%,100%{opacity:.35;box-shadow:0 0 0 rgba(242,193,78,0)}50%{opacity:1;box-shadow:0 0 8px rgba(242,193,78,.8)}}

/* the sandbox's reduce-motion switch (M) */
.ic{color:var(--soft);font-size:15px}
html.rm .sky i,html.rm .trail,html.rm .fly{display:none}
@media (prefers-reduced-motion:reduce){.sky i,.trail,.fly{display:none}}
/* last, so no animation shorthand above can reset it: the slow loops continue across redraws */
.hd::after,.sky i,.todo .st.now,.card.focus .unknown,td.ask .unknown,.blk.on,.stt.bo::before{animation-delay:var(--loop)}
/* =====================================================================
   STYLE LAB (16 Oct 2026). Looks, a typeface and instruments to try, each switchable from the lab (L).

html[data-font="inter"] body,html[data-font="inter"] .board th{font-family:LabInter,"Segoe UI",system-ui,sans-serif}
html[data-font="barlow"] body,html[data-font="barlow"] .board th{font-family:LabBarlow,"Segoe UI",system-ui,sans-serif}

/* ---------- the lab panel ---------- */
#labBtn{position:fixed;left:14px;bottom:14px;z-index:70;display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid rgba(54,198,255,.55);border-radius:2px;background:rgba(6,22,42,.88);color:#dff3ff;font-weight:600;font-size:13px;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#labBtn:hover{border-color:#36c6ff;box-shadow:0 0 18px rgba(54,198,255,.25)}
#labp{position:fixed;left:14px;bottom:60px;z-index:75;width:400px;max-height:calc(100vh - 80px);overflow:auto;padding:16px 18px 14px;border:1px solid rgba(54,198,255,.45);border-radius:2px;background:#071a31;color:#e6f1ff;box-shadow:0 24px 60px rgba(0,0,0,.55);font-size:13.5px;font-family:"Segoe UI",system-ui,sans-serif;letter-spacing:0}
#labp[hidden]{display:none}
#labp h3{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}#labp .lsub{margin:2px 0 10px;color:#9fbde3;font-size:12.5px}
#labp h4{margin:14px 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.18em;color:#7f9cc2;text-transform:uppercase}
#labp .lx{position:absolute;right:10px;top:8px;border:0;background:none;color:#9fbde3;font-size:18px}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.looks button{display:block;text-align:left;padding:8px 9px;border:1px solid rgba(65,122,171,.45);border-radius:2px;background:rgba(2,10,22,.5);color:#e6f1ff}
.looks button.on{border-color:#36c6ff;box-shadow:inset 0 0 0 1px #36c6ff}
.looks b{display:block;font-size:13px;font-weight:600}.looks small{display:block;color:#9fbde3;font-size:11.5px;line-height:1.3;margin-top:2px}
.sw{display:flex;height:9px;margin-bottom:6px}.sw i{flex:1}
.fonts{display:flex;gap:6px}.fonts button{flex:1;padding:6px 4px;border:1px solid rgba(65,122,171,.45);border-radius:2px;background:rgba(2,10,22,.5);color:#e6f1ff;text-align:center}
.fonts button.on{border-color:#36c6ff;box-shadow:inset 0 0 0 1px #36c6ff}.fonts b{display:block;font-size:17px;font-weight:600}.fonts small{color:#9fbde3;font-size:11px}
.tg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(53,96,135,.3);cursor:pointer}
.tg b{font-weight:600;font-size:13px}.tg small{grid-column:1;color:#8fa9cc;font-size:11.5px;line-height:1.3}
.tg .sl{grid-row:1/3;grid-column:2;width:34px;height:18px;border-radius:9px;background:#1b3354;position:relative;transition:background .18s}
.tg .sl::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#9fbde3;transition:transform .18s,background .18s}
.tg.on .sl{background:#1e78d8}.tg.on .sl::after{transform:translateX(16px);background:#fff}
.lfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.lfoot button{padding:5px 10px;border:1px solid rgba(65,122,171,.5);border-radius:2px;background:rgba(2,10,22,.5);color:#cfe3fb;font-size:12.5px}

/* ---------- line icons ---------- */
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.nav button .ni .ico{width:21px;height:21px;vertical-align:middle}
.lab-icons .nav button .ni{opacity:.9}.lab-icons .nav button.on .ni{opacity:1}
.wallbtn .ico{width:17px;height:17px}.ic .ico{width:18px;height:18px}
.wxl span .ico{width:19px;height:19px;vertical-align:middle}.wxl span .ico.sun{color:#F2C14E}.wxl span .ico.rain,.wxl span .ico.wind{color:#9fd4ff}.wxl span .ico.storm{color:#FF8A82}.wxl span .ico.cloud,.wxl span .ico.partly{color:#cfe1f5}
.nws .k .ico{margin-right:6px}

/* ---------- aircraft drawings ---------- */
svg.art{display:block;width:100%;height:auto}.art .p-body{fill:var(--body,#F4F6F8)}.art .p-belly{fill:var(--belly,#1B2A4A)}.art .p-engine{fill:var(--engine,#1B2A4A)}.art .p-second{fill:var(--second,#D7263D)}
.art .p-line{fill:none;stroke:rgba(8,20,34,.55);stroke-width:1.6}.art .p-glass{fill:#13283D}.art .st,.art .tl{display:none}.art .st.on,.art .tl.on{display:inline}
.art .glint{display:none}
.ac .pic.drawn{width:190px;height:80px;display:flex;align-items:center;justify-content:center;padding:4px 6px}
.lane .who .mini{display:block;width:92px;margin:-4px 0 0 -4px}
.nav div.art.scene{background:radial-gradient(ellipse at 50% 115%,rgba(242,193,78,.16),transparent 55%),linear-gradient(180deg,rgba(7,19,40,0),rgba(13,49,89,.6));filter:none;display:flex;align-items:flex-end;justify-content:center;padding:0 10px 26px}
.nav div.art.scene::after{content:none}.nav div.art.scene svg.art{width:190px;height:auto;margin:0;background:none;overflow:visible;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.nav .art.scene::before{content:"";position:absolute;left:0;right:0;bottom:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(151,207,255,.35),transparent)}

/* ---------- flight-progress bar (the week as a flight) ---------- */
.phase{position:absolute;inset:0 2% 0 3%}
.phase svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.phase .pp{fill:none;stroke:rgba(120,175,235,.28);stroke-width:1.5;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.phase .pd{fill:none;stroke:var(--cyan);stroke-width:2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px rgba(54,198,255,.6))}
.phase .wp{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(159,189,227,.6);background:#061a32;padding:0}
.phase .wp.done{background:var(--cyan);border-color:var(--cyan)}.phase .wp.now{border-color:var(--gold);background:var(--gold);box-shadow:0 0 10px rgba(242,193,78,.7)}
.phase .wl{position:absolute;top:58px;transform:translateX(-50%);border:0;background:none;padding:0;color:#8fb0d6;font-size:11px;letter-spacing:.06em;white-space:nowrap}
.phase .wl.now{color:#fff;font-weight:600}.phase .wl.done{color:#cfe6ff}.phase .wl:hover{color:#fff}
.phase .pl{position:absolute;width:22px;height:16px;margin:-8px 0 0 -11px;transition:left .7s cubic-bezier(.3,.6,.3,1),top .7s cubic-bezier(.3,.6,.3,1),transform .7s;filter:drop-shadow(0 0 6px rgba(109,201,255,.9))}
.phase .pl svg{width:22px;height:16px;position:static;overflow:visible}
.lab-phase .sky{display:none}

/* ---------- rolling figures ---------- */
.odo,.odo-c{display:inline-block;height:1.2em;line-height:1.2em;overflow:hidden;vertical-align:-.22em}
.odo-s{display:block;transition:transform .75s cubic-bezier(.2,.75,.25,1)}

/* ---------- boarding-pass result ---------- */
.bpass{display:flex;margin-top:4px;border-radius:3px;background:linear-gradient(155deg,#e9f1fb,#d6e3f2);color:#10233c;box-shadow:0 8px 20px rgba(0,0,0,.28);overflow:hidden;position:relative}
.bpass.pop{animation:printIn .55s cubic-bezier(.2,.8,.25,1) both}
@keyframes printIn{from{clip-path:inset(0 0 100% 0);transform:translateY(-6px)}to{clip-path:inset(0 0 0 0);transform:none}}
.bp-main{flex:1;padding:8px 12px 9px;min-width:0}
.bp-air{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.16em;color:#2b5c9e}
.bp-row{display:flex;gap:14px;margin:4px 0 3px}.bp-row span{min-width:0}.bp-row small{display:block;font-size:9.5px;letter-spacing:.14em;color:#5a7290}.bp-row b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-row .res b{font-size:19px;color:#0b7a46}.bpass.fin .bp-row .res b{color:#9a6a00}
.bp-to{display:block;font-size:11.5px;color:#3d5878;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-stub{flex:none;width:78px;padding:8px 10px;border-left:2px dashed rgba(16,35,60,.3);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.bp-stub::before,.bp-stub::after{content:"";position:absolute;left:-8px;width:14px;height:14px;border-radius:50%;background:#071c37}.bp-stub::before{top:-7px}.bp-stub::after{bottom:-7px}
.bp-stub small{font-size:9.5px;letter-spacing:.14em;color:#5a7290}.bp-stub b{font-size:13px}.bp-stub{padding-bottom:30px}
.bp-bar{width:58px;height:20px;background:repeating-linear-gradient(90deg,#10233c 0 2px,transparent 2px 3px,#10233c 3px 4px,transparent 4px 6px,#10233c 6px 9px,transparent 9px 10px)}
.bpass .stamp{position:absolute;right:6px;bottom:7px;margin:0;background:rgba(233,241,251,.9);border-color:#0b7a46;color:#0b7a46;font-size:9.5px;padding:1px 5px;transform:rotate(-8deg)}
.bpass.fin .stamp{border-color:#9a6a00;color:#9a6a00}

/* ---------- flight strips ---------- */
.lab-strips .blk{display:flex;align-items:stretch;padding:0;background:linear-gradient(180deg,#e8e2cf,#d9d2bb);border:1px solid #9c9478;border-left:6px solid var(--fc);color:#1b2430;container-type:inline-size;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.lab-strips .blk>span{display:flex;flex-direction:column;justify-content:center;padding:0 7px;border-right:1px solid rgba(27,36,48,.25);font-size:12px;line-height:1.25;min-width:0;white-space:nowrap}
.lab-strips .blk .fs-cs{font-weight:600;font-size:13px;background:rgba(255,255,255,.45)}
.lab-strips .blk .fs-t b{font-weight:600}.lab-strips .blk .fs-t i{font-style:normal;color:#56606c}
.lab-strips .blk .fs-r{letter-spacing:.06em}.lab-strips .blk .fs-p{border-right:0;font-weight:600}
@container (max-width:150px){.lab-strips .blk .fs-p{display:none}}
@container (max-width:110px){.lab-strips .blk .fs-r{display:none}}
.lab-strips .blk.on{background:linear-gradient(180deg,#f6f1e1,#e7e0c9);border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan),0 0 22px rgba(54,198,255,.25)}
.lab-strips .blk.on{animation:none}
.lab-strips .track{background:repeating-linear-gradient(90deg,#0a1626 0,#0a1626 calc(12.5% - 1px),#1a2a40 calc(12.5% - 1px),#1a2a40 12.5%)}

/* ---------- cockpit gauges ---------- */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 6px}
.gauge{text-align:center}.gauge svg{width:100%;max-width:130px;height:auto;display:block;margin:0 auto}
.gauge .arc{fill:none;stroke:rgba(110,170,235,.16);stroke-width:7}.gauge .zone{fill:none;stroke-width:7}
.gauge .tick{stroke:rgba(200,225,255,.55);stroke-width:1.2}.gauge .tgt{stroke:var(--gold);stroke-width:2.5}
.gauge .needle{transform-origin:60px 60px;transform:rotate(var(--a));transition:transform .8s cubic-bezier(.3,.6,.3,1)}
.main.screen-in .gauge .needle{animation:needleIn 1.1s cubic-bezier(.3,.6,.3,1) both;animation-delay:calc(var(--i,0) * 120ms)}
@keyframes needleIn{from{transform:rotate(-90deg)}}
.gauge .needle path{fill:#fff;filter:drop-shadow(0 0 3px rgba(54,198,255,.8))}.gauge .hub{fill:#0d2547;stroke:#fff;stroke-width:1.5}
.gauge b{display:block;font-size:17px;font-weight:600;margin-top:-6px}.gauge small{display:block;font-size:11.5px;color:var(--soft);line-height:1.3}

/* ---------- drag, preview, hover cards ---------- */
.lab-drag .blk{cursor:grab;touch-action:none}.blk.dragging{cursor:grabbing;z-index:5;transition:none!important;box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 0 2px var(--cyan)!important}
.blk.dragging.bad{box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 0 2px var(--mid)!important;opacity:.85}
.lab-drag .main .sum,.lab-preview .main .sum{position:sticky;bottom:0;z-index:4}   /* the profit stays in view while you change the plan */
.ghost{display:inline-block;margin-left:8px;padding:1px 7px;border:1px dashed currentColor;border-radius:2px;font-size:13px;font-weight:600;opacity:.9}
.ghost.up{color:var(--good)}.ghost.dn{color:var(--bad)}
#hc,#dragtip{position:fixed;z-index:65;pointer-events:none;max-width:300px;padding:10px 12px;border:1px solid rgba(54,198,255,.5);border-radius:2px;background:#071c37;color:#e8f2ff;font-size:13px;line-height:1.4;box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .15s ease,transform .15s ease}
#hc.on,#dragtip.on{opacity:1;transform:none}
#hc h5{margin:0 0 6px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}#hc h5 .flag{margin:0}
#hc .hr{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}#hc .hr span{color:#9fbde3}
#hc .spk{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}#hc .spk i{flex:1;background:#2b6fd6}#hc .spk i.cur{background:#36c6ff}#hc .spk i.pk{background:#F2C14E}
#hc .why{margin:6px 0 0;color:#cfe1f7}
#dragtip b{font-size:14px}#dragtip .up{color:var(--good)}#dragtip .dn{color:var(--bad)}#dragtip .wa{color:var(--mid)}

/* ---------- spotlight ---------- */
#spot{position:fixed;inset:0;z-index:72}#spot[hidden]{display:none}
#spot .hole{position:fixed;border-radius:3px;box-shadow:0 0 0 200vmax rgba(1,6,14,.74),0 0 0 2px var(--cyan),0 0 26px rgba(54,198,255,.45);transition:all .3s ease}
#spot .scard{position:fixed;width:330px;padding:14px 16px;border:1px solid var(--cyan);border-radius:2px;background:#08203d;color:#eaf4ff;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:spotIn .3s ease-out both}
#spot .scard small{display:block;font-size:10.5px;letter-spacing:.18em;color:var(--cyan);font-weight:600;margin-bottom:4px}
#spot .scard p{margin:0 0 10px;font-size:14.5px;line-height:1.45}
@keyframes spotIn{from{opacity:0;transform:translateY(6px)}}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:78px;right:18px;z-index:66;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;min-width:260px;max-width:380px;padding:10px 14px;border:1px solid rgba(65,122,171,.55);border-left:3px solid var(--good);border-radius:2px;background:#08203d;color:#eaf4ff;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:toastIn .28s cubic-bezier(.2,.8,.25,1) both}
.toast.au{border-left-color:var(--gold)}.toast.info{border-left-color:var(--cyan)}.toast.warn{border-left-color:var(--mid)}
.toast .ico{width:18px;height:18px;color:var(--good)}.toast.au .ico{color:var(--gold)}.toast.info .ico{color:var(--cyan)}.toast.warn .ico{color:var(--mid)}
.toast b{font-weight:600}.toast.out{animation:toastOut .4s ease-in both}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}}@keyframes toastOut{to{opacity:0;transform:translateX(16px)}}

/* ---------- frosted glass ---------- */
.lab-glass #labp,.lab-glass #hc,.lab-glass #dragtip,.lab-glass .toast,.lab-glass #spot .scard,.lab-glass .feed,.lab-glass .sbx,.lab-glass .selbox,.lab-glass #reel .rcard{background:rgba(10,32,60,.52);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.lab-glass .main .sum{background:rgba(10,32,60,.6);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}

/* ---------- calm layout ---------- */
.lab-calm body{font-size:16px}.lab-calm .main{padding:22px 28px}.lab-calm .grid{gap:18px}
.lab-calm .rt td:last-child{color:transparent}.lab-calm .rt td:last-child>*{opacity:0;transition:opacity .15s}.lab-calm .rt tr:hover td:last-child>*{opacity:1}
.lab-calm .pnl h2 .sub{opacity:0;transition:opacity .2s}.lab-calm .pnl:hover h2 .sub,.lab-calm .pnl.focus h2 .sub{opacity:1}
.lab-calm .card .ans~.msg:empty,.lab-calm .card>p.soft{display:none}
.lab-calm .fuelnote,.lab-calm .homenote{display:none}
.lab-calm .ttl p{opacity:.7}

/* ---------- split-flap ---------- */
.fl{display:inline-block;width:.74em;height:1.3em;line-height:1.3em;margin-right:1px;text-align:center;background:linear-gradient(180deg,#22262c 0,#1a1d22 49%,#0f1114 51%,#16191d 100%);color:#f4efe0;border-radius:2px;position:relative;font-weight:600;font-size:13px;box-shadow:inset 0 1px rgba(255,255,255,.06),0 1px 1px rgba(0,0,0,.6);text-transform:uppercase;vertical-align:middle}
.fl::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.75)}
.fl.sp{background:none;box-shadow:none}.fl.sp::after{display:none}
.fl.f{animation:flip .09s linear infinite;color:#cfc8b4}
@keyframes flip{0%{transform:scaleY(1)}50%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.lab-flap .board td{padding:6px 6px}.lab-flap .board .stt.bo .fl,.lab-flap .board .stt.de .fl,.lab-flap .board .stt.la .fl{color:inherit}
.lab-flap .board .stt.bo{color:#ffd76a}.lab-flap .board .stt.de{color:#7dffb8}.lab-flap .board .stt.la{color:#9fd0ff}
.lab-flap .board .stt.bo::before{display:none}
.lab-flap .board .acft{display:none}

/* ---------- flying the week: the reel ---------- */
#reel{position:fixed;inset:0;z-index:68;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(18,62,100,.55),rgba(1,6,14,.92));animation:fadeIn .3s ease both;cursor:pointer}
#reel[hidden]{display:none}#reel.out{animation:fadeOut .45s ease both}
@keyframes fadeOut{to{opacity:0}}
#reel .rcard{padding:28px 34px;border:1px solid rgba(54,198,255,.35);border-radius:2px;background:#061527;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
#reel .rh .fl{font-size:30px;width:.78em}#reel .rsub{margin:14px 0 18px;color:#9fbde3;font-size:15px}
#reel table{margin:0 auto;border-collapse:collapse}#reel td{padding:4px 8px;text-align:left}#reel td .fl{font-size:16px}
#reel .rgo{margin-top:16px;font-size:12px;letter-spacing:.2em;color:#ffd76a}

/* ---------- match report ---------- */
.mrep{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:0;align-items:stretch;margin-bottom:14px;padding:0;overflow:hidden}
.mrep>div{padding:14px 18px;border-right:1px solid var(--desk-line-soft)}
.mrep span{display:block;font-size:11px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase}
.mrep b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.mrep .verdict{display:flex;align-items:center;justify-content:center;border-right:0;min-width:200px}
.verdict .vst{display:inline-block;padding:6px 14px;border:3px solid var(--good);color:var(--good);font-weight:600;font-size:18px;letter-spacing:.12em;transform:rotate(-6deg);opacity:0}
.verdict .vst.dn{border-color:var(--mid);color:var(--mid)}
.verdict .vst.go{animation:stampDown .45s cubic-bezier(.2,.9,.25,1.3) both}.verdict .vst.shown{opacity:1}
@keyframes stampDown{from{opacity:0;transform:rotate(-12deg) scale(1.8)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
.spark div.best{box-shadow:0 0 18px rgba(242,193,78,.45)}

/* ===================== THE LOOKS ===================== */
/* ----- Airport Signage: charcoal, signage yellow, flat panels, bold and clear ----- */
html[data-look="signage"]{--cyan:#FFD200;--blue:#FFD200;--gold:#FFD200;--good:#39D98A;--mid:#FF9F1C;--bad:#FF5A4F;--ink:#ffffff;--soft:#b9bec6;--mute:#8a9099;--line:#2c3138;--line2:#3a4049;
  --desk-panel:linear-gradient(180deg,#1d2025,#191c20);--desk-panel-deep:#16181c;--desk-panel-active:linear-gradient(180deg,#24272d,#1d2025);--desk-line:#30353d;--desk-line-soft:#2a2e35;
  --c-cyan:#FFD200;--c-blue:#FFD200;--c-gold:#FFD200;--c-green:#39D98A;--c-amber:#FF9F1C;--c-soft:#b9bec6;--c-mute:#8a9099;--wline:#30353d;--wline2:#272a30;
  --wall-bg:linear-gradient(180deg,#121417,#0d0f11);--wall-panel:linear-gradient(180deg,#1d2025,#191c20);--wall-panel-deep:#16181c;--wall-panel-active:linear-gradient(180deg,#24272d,#1d2025)}
