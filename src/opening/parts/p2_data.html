     sentence: the sum in words shown above the number pad. {row} = a number from the table (highlighted cyan), {?row} = the answer box.
     op/from: how the row is worked out (used for highlighting and "Choose the sum"). labelN = label when the plan has n trips. explain = "What's in this?" link.

<!-- WORLD SCRIPT: "Clear Skies". Fixed and deterministic.
     TIME: every plane's day starts at firstDeparture. A trip = out + turnaround away + back; between trips there is a turnaround at home.
     turnaroundMin is the default (minutes); a route (away airport), a home airport or a plane can carry its own turnaroundMin.
     The airport is open dayStart–dayEnd; trips that run past dayEnd show a red overflow.
     tankBase = fuel storage with no planes (each plane's tankAdd is added). suppliers = the fuel forecast table's columns.
     icons = demand picture scale: one icon per person, or one per bigPerIcon people once demand passes bigAt.
     ROUTES: unlockPhase = the phase a route opens (Phase 1: Dublin and Paris only). setupPrices = the three prices offered in setup.
     SUPPLIERS: fromPhase = when the supplier appears (one supplier in Phases 1–2).
     CHOICES (CR4 s7): a round's "choice" = the morning news and what he can do about it. "Carry on as usual" is always offered.
       do: carryOn | fare (fares: current/down/up/rival) | trips | fuel (litres) | cabin | effect (effects + why).
       Rounds without a written choice get one from their calc. demandMod {"focus":n} changes demand on his main route.
     A route's demand is per day and is shared across that day's trips to it.
     competitor {"focus":0.85} = the rival undercuts whichever route the pupil's featured plane flies first (85% of its base price, rounded to £5).
     In event text {city} {price} {rival} are filled in; setPrice {"focus":"match"} sets that route's fare to the rival's.
     homes: the home-airport choice in setup (fee = landing fee per flight, demandPct = passenger bonus/penalty).
     Hidden lesson: fuel climbs steadily (with one spike), so buying fuel early and in bulk wins.

o","text":"D61: at each weekly and chapter review the pupil does not add the figures up. He shows what to add (selects the right figures and the operation, e.g. the seven daily profits joined with +), shows the order of a difference (actual − projected), and for a mean shows the divisor (total ÷ 7 for a day, ÷ number of weeks for a week). The game then calculates. This is the Build stage applied to totals and averages.","trigger":"every chapter review","examples":"chapter 1 review Dec 2030; year accounts Aug 2031, 2032, 2033, 2034; five-year review 2035","status":"live"},{"rule":4,"name":"Multiplication and division are protected","text":"Every new route brings one × (passengers × the new fare) and one ÷ (distance ÷ speed); every new plane brings one × (seats × fare) and one ÷ (price ÷ rent, or price − cash ÷ profit a week).","trigger":"route opens; plane acquired","examples":"34 × £95; 70 × £170; 1,350 ÷ 450; 9,000 ÷ 400; 6,000,000 ÷ 6,000","status":"live"},{"rule":5,"name":"Snacks once, then model","text":"Snack revenue and profit by hand on day 2 only; a modelling choice from then on.","trigger":"day 2","examples":"10 × £3; £30 − £10","status":"live"},{"rule":6,"name":"Timetable modelling is free","text":"Moving services around the day, changing fares or services in the Test plan never costs a hand sum; the model updates.","trigger":"always","examples":"—","status":"live"},{"rule":7,"name":"One Captain's challenge a term","text":"From chapter 2, one optional bare × or ÷ with a story and a reward each term (Challenges sheet).","trigger":"captainsChallengeCadence","examples":"24 × 36 barrels; 648 ÷ 6 sandwiches","status":"live"},{"rule":8,"name":"One hunt per review, some in the run","text":"From chapter 2, every review carries one spot-the-mistake hunt; occasional hunts appear during the run (Hunts sheet).","trigger":"huntPerReview; Hunts sheet dates","examples":"a statement with one wrong total; an invoice with a wrong multiplication; a departure board with a wrong time","status":"live"},{"rule":9,"name":"A cap of three a week from week 2","text":"At most signOffCapPerWeek Calculate sign-offs in a week; the most instructive first; the rest Build or Model; overflow carried to the next relevant week. Launch Day and review Build steps are outside the cap.","trigger":"weekly, from day 8","examples":"week 3: 34 × £95, 675 ÷ 450 and the Saab's Amsterdam fuel; Frankfurt, Geneva and Barcelona tickets as Build","status":"live"},{"rule":10,"name":"Sums get lighter with repetition","text":"Calculate the first two times a relationship appears; Build for a new instance from the third time; Model when nothing is new.","trigger":"relationship.count","examples":"tickets on a new route in week 4 is a Build (pick passengers, ×, fare), not a long multiplication","status":"live"},{"rule":11,"name":"The floor: a monthly audit, and the board when nothing has changed","text":"The world's penalties run all the time (missed profit, neglect, day costs, fuel, news). At each month end Finance sends one audit on the pupil's weakest line. If the plan has not changed all month, the audit becomes a board review: three sign-offs and a required change of plan before the next month runs.","trigger":"month end; plan unchanged for 4 weeks","examples":"end of October: 'Finance: check the Geneva line before the accounts close'; a coasting pupil in November: 'The board wants to see a plan that tests a different fare or route'","status":"live"}],"catering":[{"id":"none","name":"No snacks","sellingPrice":0,"takeUp":0,"unitStockCost":0,"freeCostPerPassenger":0,"reputationEffect":0,"notes":"Nothing sold, nothing spent.","status":"live"},{"id":"low","name":"Snacks at £3","sellingPrice":3,"takeUp":0.5,"unitStockCost":1,"freeCostPerPassenger":0,"reputationEffect":0,"notes":"Half of passengers buy. Day 2's hand sum: 10 × £3 = £30; £30 − £10 stock = £20.","status":"live"},{"id":"high","name":"Snacks at £5","sellingPrice":5,"takeUp":0.3,"unitStockCost":1,"freeCostPerPassen
