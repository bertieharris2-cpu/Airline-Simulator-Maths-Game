<!-- WORLD SCRIPT: "Clear Skies". Fixed and deterministic.
     TIME: every plane's day starts at firstDeparture. A trip = out + turnaround away + back; between trips there is a turnaround at home.
     turnaroundMin is the default (minutes); a route (away airport), a home airport or a plane can carry its own turnaroundMin.
     The airport is open dayStart–dayEnd; trips that run past dayEnd show a red overflow.
     tankBase = fuel storage with no planes (each plane's tankAdd is added). suppliers = the fuel forecast table's columns.
     icons = demand picture scale: one icon per person, or one per bigPerIcon people once demand passes bigAt.
     ROUTES: unlockPhase = the phase a route opens (Phase 1: Dublin and Paris only). setupPrices = the three prices offered in setup.
     SUPPLIERS: fromPhase = when the supplier appears (one supplier in Phases 1–2).
     CHOICES (CR4 s7): a round's "choice" = the morning news and what he can do about it. "Carry on as usual" is always offered.
       do: carryOn | fare (fares: current/down/up/rival) | trips | fuel (litres) | cabin | effect (effects + why).
       Rounds without a written choice get one from their calc. demandMod {"focus":n} changes demand on his main route.
     A route's demand is per day and is shared across that day's trips to it.
     competitor {"focus":0.85} = the rival undercuts whichever route the pupil's featured plane flies first (85% of its base price, rounded to £5).
     In event text {city} {price} {rival} are filled in; setPrice {"focus":"match"} sets that route's fare to the rival's.
     homes: the home-airport choice in setup (fee = landing fee per flight, demandPct = passenger bonus/penalty).
     Hidden lesson: fuel climbs steadily (with one spike), so buying fuel early and in bulk wins.
     rounds[n] drives round n (rounds[0] is the setup flight).
       fuel: £ per litre this round.  jobs: scripted jobs.  calc: which job's calculation is gated this round.
       focus: route that gets the pricing decision (otherwise the engine rotates through owned routes).
       demandMod: extra demand per route.  competitor: rival's fare per route (if lower than yours, you lose 20% of passengers).
       event: a problem with 2-3 responses. effects: cash, rep, status (board status for this round's flights),
              setPrice {route:price}, groundNext (featured plane misses next round), fuelDiscount.
       news: lines for the ticker. challenge: true = Captain's challenge this round (every 2 rounds).
