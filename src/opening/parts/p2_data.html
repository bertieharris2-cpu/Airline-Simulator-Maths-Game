     sentence: the sum in words shown above the number pad. {row} = a number from the table (highlighted cyan), {?row} = the answer box.
     op/from: how the row is worked out (used for highlighting and "Choose the sum"). labelN = label when the plan has n trips. explain = "What's in this?" link.

<!-- WORLD SCRIPT: "Clear Skies". Fixed and deterministic.
     TIME: every plane's day starts at firstDeparture. A trip = out + turnaround away + back; between trips there is a turnaround at home.
     turnaroundMin is the default (minutes); a route (away airport), a home airport or a plane can carry its own turnaroundMin.
     The airport is open dayStart–dayEnd; trips that run past dayEnd show a red overflow.
     tankBase = fuel storage with no planes (each plane's tankAdd is added). suppliers = the fuel forecast table's columns.
     icons = demand picture scale: one icon per person, or one per bigPerIcon people once demand passes bigAt.
     ROUTES: unlockPhase = the phase a route opens (Phase 1: Dublin and Paris only). setupPrices = the three prices offered in setup.
     SUPPLIERS: fromPhase = when the supplier appears (one supplier in Phases 1–2).
     CHOICES (CR4 s7): a round's "choice" = the morning news and what he can do about it. "Carry on as usual" is always offered.
       do: carryOn | fare (fares: current/down/up/rival) | trips | fuel (litres) | cabin | effect (effects + why).
       Rounds without a written choice get one from their calc. demandMod {"focus":n} changes demand on his main route.
     A route's demand is per day and is shared across that day's trips to it.
     competitor {"focus":0.85} = the rival undercuts whichever route the pupil's featured plane flies first (85% of its base price, rounded to £5).
     In event text {city} {price} {rival} are filled in; setPrice {"focus":"match"} sets that route's fare to the rival's.
     homes: the home-airport choice in setup (fee = landing fee per flight, demandPct = passenger bonus/penalty).
     Hidden lesson: fuel climbs steadily (with one spike), so buying fuel early and in bulk wins.

ek; the overdraft safety net; Tokyo and Cape Town; the A340, 777 and A350 in the shop; Challenge 3. Then months. 'Known for' tags begin (D90).","notes":null,"status":"live"},{"fromDay":"2032-08-31","mechanic":"Chapter 3 review: year-2 accounts, hunt h3, next investment (the A380 offer opens chapter 4)","notes":null,"status":"live"},{"fromDay":"2032-09-06","mechanic":"CHAPTER 4 set-up (days 736–740, one at a time): the A380 offer on finance (monthly), the 747 as the alternative, Hong Kong and Los Angeles, does-it-fill (demand ÷ seats), Challenge 5; the launch campaign project in October; then months.","notes":null,"status":"live"},{"fromDay":"2033-08-31","mechanic":"Chapter 4 review: year-3 accounts, hunt h5 (the finance line), the A380's fill month by month, next: the rival","notes":null,"status":"live"},{"fromDay":"rule","mechanic":"No crew mechanic before 2031-01-06; no second hub, sell-back, fleet renewal, investor; Heathrow only; cash reserve block before Sep 2031; HandSumRules govern hand sums","notes":"D51 D31 D25 D46 D44 D32 D26 D34","status":"live"}],"chapters":[{"chapter":1,"name":"Starting out","start":"2030-09-02","end":"2030-12-28","setUpDays":1,"runCadence":"week (plan → run → review) to day 28; week-skips from day 29; months from 2030-12-02","reviewDate":"2030-12-28","newIdea":"Running an airline a week at a time: the standing plan on one page (timetable with demand curve, fare, snacks, fuel), the week on the operations board, the weekly review","mechanicsArriving":"Launch Day: timetable, fare, snacks, fuel, both routes, modelling tool, workings page; week 2: second plane bought outright or wait for a bigger one; time-to-afford sum; week 3: four routes, £5 fares, seasons, use-it-or-lose-it; week 4: medium haul, range, E175/E190, load factor %; from week 5: weekly skips, Marrakech, the autumn pairs, scaled event costs","handSumsPlanned":25,"mathsFront":"column + and −; short ×; long × (fuel, £5 fares, jet fares); ÷ (flight time, rent-or-buy); time","status":"live"},{"chapter":2,"name":"Going long","start":"2031-01-06","end":"2031-08-31","setUpDays":5,"runCadence":"week → month","reviewDate":"2031-08-31","newIdea":"Long haul: overnight rotations, time zones; the 787 by lease; reputation revealed; airline type chosen","mechanicsArriving":"leasing (standing); reputation as demand multiplier; airline type; extras (Value only); Captain's challenge one a term; hunts","handSumsPlanned":8,"mathsFront":"big numbers (£k, £m) and estimating; revenue ÷ 2 for overnight rotations; time across zones; rent against earnings","status":"live"},{"chapter":3,"name":"Owning","start":"2031-09-01","end":"2032-08-31","setUpDays":5,"runCadence":"month","reviewDate":"2032-08-31","newIdea":"Owning: buying big planes outright (price − cash, ÷ profit a week); the overdraft safety net; Tokyo and Cape Town from the start, Singapore in October, Sydney via Singapore in March; the A340, 777 and A350 in the shop","mechanicsArriving":"buy outright; overdraft (no charge)","handSumsPlanned":6,"mathsFront":"subtraction and division with millions (time to afford, weekly); percentage change on the monthly report; rent-or-buy at jet prices; the two-leg rotation; negative cash; year-2 totals and the mean at the review","status":"live"},{"chapter":4,"name":"The ultimate plane","start":"2032-09-06","end":"2033-08-31","setUpDays":5,"runCadence":"month","reviewDate":"2033-08-31","newIdea":"The ultimate plane: the A380 on finance (£20m down, £1m a month for 40 months) or the 747 as the real alternative; Hong Kong and Los Angeles, the two routes big enough for it; does a 500-seat plane fill? (demand ÷ seats); reputation that decides it; the A380 launch campaign as the one marketing project","mechanicsArriving":"finance; reputation that matters","handSumsPlanned":6,"mathsFront":"deposit and monthly payments with millions (60 − 20 = 40; ÷ 40); does it fill? demand ÷ seats as a percentage; the campaign's funnel fractions and return on spending; year-3 totals and the mean","status":"live"}],"handSumRules":[{"rule":1,"name":"First time, always by hand","text":"The first time a relationship appears it is calculated by hand (Calculate), whatever the chapter.","trigger":"relationship.firstSeen","examples":"ticket revenue (day 1); fuel (day 3); rent-or-buy (week 2); overnight rotation (Jan 2031); time to afford (Sep 2031); finance (Apr 2033)","status":"live"},{"rule":2,"name":"Again when it has changed enough","text":"Fuel is one sum a week: the order on the fuel desk (blocks × price per 1,000 L). By hand only when the price has moved 50p or more since the last time; the game breaks the bill down by route and plane for the pupil to read.","trigger":"fuel: price moved ≥ fuelHandSumPriceStep OR litres changed ≥ fuelHandSumLitresShare · revenue: new route or new plane · others: never","examples":"week 2: the first order 6 × £1,470 (with Show me how for the class's method); week 7: 6 × £2,940; week 14: 5 × £1,120","status":"live"},{"rule":3,"name":"Totals and means at every review: show what to do","text":"D61: at each weekly and chapter review the pupil does not add the figures up. He shows what to add (selects the right figures and the operation, e.g. the seven daily profits joined with +), shows the order of a difference (actual − projected), and for a mean shows the divisor (total ÷ 7 for a day, ÷ number of weeks for a week). The game then calculates. This is the Build stage applied to totals and averages.","trigger":"every chapter review","examples":"chapter 1 review Dec 2030; year accounts Aug 2031, 2032, 2033, 2034; five-year review 2035","status":"live"},{"rule":4,"name":"Multiplication and division are protected","text":"One × and one ÷ for every new route or plane, on tickets or flight time — never on fuel (fuel is the weekly order, rule 2).","trigger":"route opens; plane acquired","examples":"34 × £95; 70 × £170; 1,350 ÷ 450; (22,000 − 13,000) ÷ 1,700 (week 2); 6,000,000 ÷ 6,000 (January)","status":"live"},{"rule":5,"name":"Snacks once, then model","text":"Snack revenue and profit by hand on day 2 only; a modelling choice from then on.","trigger":"day 2","examples":"10 × £3; £30 − £10","status":"live"},{"rule":6,"name":"Timetable modelling is free","text":"Moving services around the day, changing fares or services in the Test plan never costs a hand sum; the model updates.","trigger":"always","examples":"—","status":"live"},{"rule":7,"name":"One Captain's challenge a term","text":"From chapter 2, one optional bare × or ÷ with a story and a reward each term (Challenges sheet).","trigger":"captainsChallengeCadence","examples":"24 × 36 barrels; 648 ÷ 6 sandwiches","status":"live"},{"rule":8,"name":"One hunt per review, some in the run","text":"From chapter 2, every review carries one spot-the-mistake hunt; occasional hunts appear during the run (Hunts sheet).","trigger":"huntPerReview; Hunts sheet dates","examples":"a statement with one wrong total; an invoice with a wrong multiplication; a departure board with a wrong time","status":"live"},{"rule":9,"name":"A cap of three a week from week 2","text":"At most signOffCapPerWeek Calculate sign-offs in a week; the most instructive first; the rest Build or Model; overflow carried to the next relevant week. Launch Day and review Build steps are outside the cap.","trigger":"weekly, from day 8","examples":"week 2: time to afford, the Twin Otter's revenue, two planes' day; week 3: 34 × £95, 675 ÷ 450 and the Saab's Amsterdam fuel","status":"live"},{"rule":10,"name":"Sums get lighter with repetition","text":"Calculate the first two times a relationship appears; Build for a new instance from the third time; Model when nothing is new.","trigger":"relationship.count","examples":"tickets on a new route in week 4 is a Build (pick passengers, ×, fare), not a long multiplication","status":"live"},{"rule":11,"name":"The floor: a monthly audit, and the board when nothing has changed","text":"The world's penalties run all the time (missed profit, neglect, day costs, fuel, news). At each month end Finance sends one audit on the pupil's weakest line. If the plan has not changed all month, the audit becomes a board review: three sign-offs and a required change of plan before the next month runs.","trigger":"month end; plan unchanged for 4 weeks","examples":"end of October: 'Finance: check the Geneva line before the accounts close'; a coasting pupil in November: 'The board wants to see a plan that tests a different fare or route'","status":"live"},{"rule":12,"name":"On paper, two tries","text":"All working is done on paper; the game takes the answer. A wrong answer gets a note and one more try; a second wrong answer shows the figure and moves on.","trigger":"always","examples":null,"status":"live"}],"catering":[{"id":"none","name":"No snacks","sellingPrice":0,"takeUp":0,"unitStockCost":0,"freeCostPerPassenger":0,"reputationEffect":0,"notes":"Nothing sold, nothing spent.","status":"live"},{"id":"low","name":"Snacks at £3","sellingPrice":3,"takeUp":0.5,"unitStockCost":1,"freeCostPerPassenger":0,"reputationEffect":0,"notes":"Half of passengers buy. Day 2's hand sum: 10 × £3 = £30; £30 − £10 stock = £20.","status":"live"},{"id":"high","name":"Snacks at £5","sellingPrice":5,"takeUp":0.3,"unitStockCost":1,"freeCostPerPassenger":0,"reputationEffect":0,"notes":"Three in ten buy.","status":"live"},{"id":"free","name":"Free snacks","sellingPrice":0,"takeUp":1,"unitStockCost":0,"freeCostPerPassenger":2,"reputationEffect":"later: +reputation","notes":"Costs £2 a passenger; reputation effect once reputation is live (Jan 2031).","status":"live"}],"hunts":[{"id":"h1","date":"2031-08-31","chapter":2,"host":"Year-1 accounts","whatIsWrong":"Year-1 accounts, August 2031: the New York line shows 200 passengers × £510 = £104,000 (should be £102,000: a × with a slipped digit). The pupil re-multiplies and finds £2,000 too much.","pupilChecks":"Re-multiply the route's passengers × fare and compare","consequenceIfMissed":"The cash forecast for chapter 3 starts £2,000 out","status":"live"},{"id":"h2","date":"2031-04-21","chapter":2,"host":"Fuel invoice","whatIsWrong":"Fuel invoice, April 2031: 14,000 L at £2.04 shown as £29,560; litres × price is £28,560. The pupil re-multiplies and finds £1,000 too much.","pupilChecks":"Multiply litres by price","consequenceIfMissed":"Overpaid; corrected next month if found later","status":"live"},{"id":"h3","date":"2032-08-31","chapter":3,"host":"Year-2 accounts","whatIsWrong":"Year-2 accounts, 31 Aug 2032. If the 787 was rented in June 2032: its June rent (30 × £6,000 = £180,000) is missing from the costs. If the pupil owns his big planes: the purchase of the dearest one is written with a missing zero (£1,200,000 for a £12,000,000 787), so the year looks £10,800,000 better than it was. The game picks whichever applies.","pupilChecks":"Rent: add the twelve monthly lines and compare. Purchase: check the price against the Fleet desk.","consequenceIfMissed":"Profit looks £180,000 too good","status":"live"},{"id":"h4","date":"2032-02-10","chapter":3,"host":"Departure board","whatIsWrong":"Departure board, 10 Feb 2032: the Tokyo arrival is shown nine hours too late — the time difference was added twice. The game builds the figures from its own departure time and flight time (e.g. 06:30 + 10 h 40 = 17:10 London = 02:10 Tokyo; shown as 11:10).","pupilChecks":"Add the flight time and the zone once","consequenceIfMissed":"Passengers miss connections: −½ star","status":"live"},{"id":"h5","date":"2033-08-31","chapter":4,"host":"Finance statement","whatIsWrong":"Year-3 accounts, 31 Aug 2033: the A380's finance line shows 11 payments of £1,000,000 as £12,000,000. October to August is eleven payments: £11,000,000.","pupilChecks":"Count the months from the first payment (1 October) to August, then × £1,000,000","consequenceIfMissed":"Repayments run a month longer","status":"live"}],"livery":{"colours":[{"id":"white","name":"White","hex":"#F4F6F8"},{"id":"navy","name":"Navy","hex":"#1B2A4A at changed? (tap the gauge)","reveal":"A Twin Otter departs for Paris: 120 L drains, £176 flows into today's costs. Buying fuel and using fuel are different events.","use":"The Fuel desk with the order instrument","leadsInto":"Fuel order sum","seconds":50,"html":"briefing-fuel.html"},{"id":"aircraft_efficiency","trigger":"Week-2 shop, first comparison","title":"Two planes, one route","show":"A Twin Otter and a Saab fly Dublin side by side; both gauges drain; a seat-row per plane.","predict":"Which burned more per seat? Tap it.","reveal":"Litres per seat: the Saab 6.6, the Twin Otter 9.5 — bigger can be cheaper a seat, if it fills.","use":"The comparison with the litres-per-seat widget","leadsInto":"Second-plane decision","seconds":35,"html":"briefing-efficiency.html"},{"id":"event_weekend","trigger":"Announced event (day 22: the All Blacks)","title":"One big Saturday","show":"A normal Saturday: 62 Dublin dots. An event card slides onto the date; dots stream in to 124. Your two flights stay where they are.","predict":"What changed? Tap the day.","reveal":"Events change a market for a day; a weekend plan changes every Saturday.","use":"Can the planner respond to one date? → Upgrades question","leadsInto":"day_override upgrade","seconds":40,"html":"briefing-event.html"},{"id":"seasons","trigger":"Chapter-1 review","title":"A year of demand","show":"Twelve months; Geneva's bar grows in winter, Barcelona's in summer; Christmas and half-term markers.","predict":"Drag a plane icon to the month you'd fly Geneva.","reveal":"Markets change through the year for different reasons; a weekly plan does not.","use":"The Upgrades question (seasonal plans)","leadsInto":"seasonal_plans upgrade","seconds":45,"html":"briefing-seasons.html"},{"id":"lease_money","trigger":"6 Jan 2031, the 787 to lease","title":"Renting a plane","show":"A 787; the price £12m against cash £1.5m; a rent meter ticks £6,000 a day.","predict":"Slide the days: when does rent pass the price?","reveal":"Rent-or-bu
