table.fx thead th b,.ft-h b{color:#fff;text-shadow:none}
table.fx td.c.done,.c.done{color:#fff;text-shadow:0 0 12px rgba(var(--sel-rgb),.35)}
.c.enter.on{border-color:var(--open);color:var(--open);box-shadow:0 0 14px rgba(var(--sel-rgb),.4)}
table.fx td.enter.on button{color:var(--open)}
.say-it .s-ans,.big-sum .s-ans{color:var(--open);border-color:var(--open)}
.say-it .s-done{color:#bfeeff}
.answer input,.answer .unit,.calc .question b,.w-pins span{color:#fff;text-shadow:none}
.task.main{border-left-color:var(--sel);background:rgba(41,140,230,.08)}
.sl-bar i.got{background:linear-gradient(90deg,#1f95dc,#5fd3ff);box-shadow:0 0 14px rgba(41,185,239,.45)}
.sl-callout{border-left-color:var(--sel);background:rgba(41,140,230,.10)}
/* fuel is a quantity, not money: cyan-blue */
.tank-bar i.keep{background:rgba(41,150,230,.38)}
.tank-bar i.use{background:linear-gradient(90deg,#1f95dc,#5fd3ff);box-shadow:0 0 10px rgba(41,185,239,.5);background-image:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(7,18,31,.22) 5px 8px), linear-gradient(90deg,#1f95dc,#5fd3ff)}
.tank-bar i.ghost{background:repeating-linear-gradient(-45deg,rgba(95,211,255,.55) 0 6px,rgba(95,211,255,.18) 6px 12px);border:2px dashed #7fe0ff}
.key-use{background:linear-gradient(90deg,#1f95dc,#5fd3ff)}
.toast{background:linear-gradient(160deg, var(--act-a), var(--act-b));color:#fff;border:1px solid rgba(120,215,255,.7);box-shadow:0 0 24px rgba(41,185,239,.4)}
/* identity and status */
.biglogo .a{color:#fff;text-shadow:0 0 28px rgba(41,185,239,.45)}
.biglogo .b{color:var(--sel);text-shadow:0 0 28px rgba(var(--sel-rgb),.45)}
.boot{display:none}
.name-input{color:#fff}.name-input:focus{border-color:var(--sel)}
.cops.hold,.cops.idle,.w-live.hold,.w-live.idle{color:#a8e6ff;border-color:rgba(var(--sel-rgb),.5);background:rgba(41,140,230,.14)}
.ptab sup{background:var(--orange);color:#1b0d00}
.ii.warn{border-left-color:var(--orange)}.ii.warn .tag{color:var(--orange)}
.p-today{border-color:rgba(var(--sel-rgb),.5);box-shadow:0 0 22px rgba(var(--sel-rgb),.12), var(--lift)}
.k-cash .spark polyline{stroke:var(--amber)}.k-fuel{--x:0}
/* surfaces lit from the top left */
.card,.tf,.hp,.overlay .box{background:var(--surface);border:1px solid rgba(127,200,255,.32);box-shadow:var(--lift)}
.hp .phead,.tf-bar,.screen-title{background:linear-gradient(180deg, rgba(127,200,255,.11), rgba(0,0,0,.12));box-shadow:inset 0 1px 0 rgba(170,225,255,.16)}
.cbar{background:linear-gradient(180deg,#143e72 0%,#0d2c56 55%,#0a2142 100%);border-bottom:1px solid rgba(127,200,255,.3);box-shadow:inset 0 1px 0 rgba(170,225,255,.18), 0 2px 0 rgba(0,6,20,.45), 0 8px 24px rgba(2,10,28,.35);position:relative;z-index:2}
.bname{display:flex;flex-direction:column;min-width:0;line-height:1.1}
#cStrat{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9fe3ff;white-space:nowrap}
#cStrat.sb-premium{color:var(--amber)}
#cStrat:empty{display:none}
.sbadge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(var(--sel-rgb),.6);color:#a8e6ff;background:rgba(41,140,230,.14);border-radius:var(--rb);vertical-align:middle}
.sbadge.premium{border-color:rgba(255,200,61,.65);color:var(--amber);background:rgba(255,200,61,.08)}
/* the Operations Wall */
.w-head,.w-status{background:linear-gradient(180deg,#123a6c,#0b2448);box-shadow:inset 0 1px 0 rgba(170,225,255,.16)}
.w-map{box-shadow:var(--lift)}
.w-clock b{color:#fff;text-shadow:0 0 16px rgba(41,185,239,.4)}
.w-ticker{background:linear-gradient(180deg,#0f3264,#081d3d);color:#eaf6ff;border:1px solid rgba(127,200,255,.32)}
.w-ticker > b{background:linear-gradient(160deg, var(--act-a), var(--act-b));color:#fff;border:0}
.wt b{color:#fff}.wt.money b{color:var(--amber)}.wt.good b{color:var(--green)}.wt.bad b{color:var(--red)}
.w-over{background:linear-gradient(160deg,#103463,#081d3f 60%)}
.tapfs{color:#fff}
/* ---------- the strategy screen ---------- */
.strats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;height:100%;min-height:0}
.strat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:22px 24px 20px;color:var(--white);min-height:0;cursor:pointer;
  background:var(--surface);border:1px solid rgba(127,200,255,.3);border-top:3px solid rgba(127,200,255,.45);box-shadow:var(--lift);border-radius:var(--r);transition:border-color .15s, box-shadow .2s, transform .2s}
.strat:hover{border-color:rgba(var(--sel-rgb),.75);transform:translateY(-2px)}
.strat.on{border-color:var(--sel);border-top-color:#7fe0ff;background:radial-gradient(120% 70% at 0% 0%, rgba(96,190,255,.28), transparent 60%), linear-gradient(160deg,#1a4c8c,#10305f 55%,#0b2448);
  box-shadow:inset 0 0 0 1px rgba(var(--sel-rgb),.5), 0 0 30px rgba(var(--sel-rgb),.3), var(--lift)}
.st-name{font-size:calc(15px * var(--tz));font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#9fe3ff}
.strat.on .st-name{color:#dff6ff}
.strat{position:relative}
.st-on{position:absolute;top:14px;right:16px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#04223f;background:linear-gradient(160deg,#9fe9ff,#46c8ff);padding:4px 10px;border-radius:var(--rb);box-shadow:0 0 14px rgba(70,200,255,.45)}
.strats.has-pick .strat:not(.on){filter:saturate(.7) brightness(.86)}
.strats.has-pick .strat:not(.on):hover{filter:none}
.strat.on{border-top-width:4px;transform:translateY(-3px)}
.st-slogan{font-size:calc(30px * var(--tz));line-height:1.12;color:#fff}
.st-tags{font-size:calc(17px * var(--tz));color:var(--muted)}
.cabin{display:block;width:100%;flex:1 1 0;min-height:56px;max-height:190px;margin:4px 0;filter:drop-shadow(0 6px 14px rgba(2,10,28,.45))}
.cab-body{fill:rgba(220,236,255,.07);stroke:rgba(150,210,255,.45);stroke-width:1.5}
.cab-seat{fill:var(--c2);opacity:.85}.cab-back{fill:#fff;opacity:.35}
.strat.on .cab-seat{opacity:1}
.st-meters{display:grid;grid-template-columns:repeat(3,auto);gap:6px 22px;width:100%;padding:10px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.st-meters > span{display:flex;flex-direction:column;gap:2px}
.st-meters small{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700}
.st-meters b{font-size:calc(22px * var(--tz));letter-spacing:2px;white-space:nowrap}
.st-meters i{font-style:normal;color:#2c4a72}
.m-fare i.on{color:var(--amber)}.m-star i.on{color:var(--amber);text-shadow:0 0 10px rgba(255,200,61,.3)}.m-vol i.on{color:#7fe0ff}
.st-text{font-size:calc(19px * var(--tz));line-height:1.35;color:var(--white)}
.livery{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
.livery-preview{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;background:rgba(4,18,43,.35);border:1px solid var(--hair);border-radius:var(--r)}
.livery .swatches{display:grid;grid-template-columns:repeat(6,52px);gap:10px}
.lp-art{display:flex;align-items:center;gap:18px}
.lp-name{font-family:var(--sans);font-size:28px;font-weight:800;letter-spacing:.14em;color:var(--c1)}
@media (max-height:820px){ .st-slogan{font-size:calc(24px * var(--tz))} .strat{padding:16px 18px;gap:6px} .st-text{font-size:calc(17px * var(--tz))} .st-tags{font-size:15px} }
@media (prefers-reduced-motion: reduce){ .strat{transition:none} .strat:hover{transform:none} }

/* ============================================================
   OPENING PROTOTYPE: passenger groups, one service to scale, timetable, fare ladder, fuel, forecast, results
   ============================================================ */
.proto-tag{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#9fe3ff}
/* passengers in aircraft-sized groups */
.pgroups{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.pg{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid rgba(127,200,255,.35);background:rgba(4,18,43,.35);border-radius:var(--rb)}
.pg-dots{display:grid;grid-template-columns:repeat(10,14px);gap:5px}
.pg-dots i{width:14px;height:14px;border-radius:50%;display:block}
.pg-dots i.p{background:#dff3ff;box-shadow:0 0 6px rgba(150,220,255,.35)}
.pg-dots i.e{border:1.5px solid rgba(150,210,255,.4)}
.pg-foot{display:flex;align-items:baseline;gap:8px}
.pg-foot b{font-size:24px;color:#fff}.pg-foot span{font-size:15px;color:var(--muted)}
.pg.flown{border-color:var(--sel);background:linear-gradient(160deg, rgba(41,140,230,.24), rgba(8,29,61,.4));box-shadow:inset 3px 0 0 #7fe0ff}
.pg.flown .pg-dots i.p{background:#7fe0ff}
.pg.nos{border:1.5px dashed rgba(255,154,60,.7);background:rgba(255,154,60,.06)}
.pg.nos .pg-dots i.p{background:var(--orange);box-shadow:none}
.pg.nos .pg-foot span{color:var(--orange)}
.pgroups.big .pg{padding:16px 18px}.pgroups.big .pg-dots{grid-template-columns:repeat(10,22px);gap:8px}.pgroups.big .pg-dots i{width:22px;height:22px}.pgroups.big .pg-foot b{font-size:34px}
.pgroups.small{gap:8px}.pgroups.small .pg{padding:6px 8px}.pgroups.small .pg-dots{grid-template-columns:repeat(10,9px);gap:3px}.pgroups.small .pg-dots i{width:9px;height:9px}.pgroups.small .pg-foot b{font-size:17px}.pgroups.small .pg-foot span{font-size:13px}
.cap-line{font-size:calc(20px * var(--tz));margin:4px 0 8px}
.orange{color:var(--orange)}
/* the market */
.dm{display:flex;flex-direction:column;gap:22px}
.dm-top{display:flex;flex-wrap:wrap;gap:22px;align-items:stretch}
.dm-big{display:flex;flex-direction:column;gap:2px;padding:14px 22px;background:var(--surface);border:1px solid rgba(127,200,255,.3);box-shadow:var(--lift);border-radius:var(--r);min-width:200px}
.dm-big b{font-size:64px;line-height:1;color:#fff}.dm-big span:last-child{font-size:18px;color:var(--muted)}
.dm-big.ac b{color:#7fe0ff}
.dm-eq{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px}
.dm-eq b{font-size:44px;color:#fff;letter-spacing:.04em}.dm-eq i{font-style:normal;color:#5d87b6;padding:0 .2em}
/* start-up aircraft */
.starter{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:28px;align-items:center;height:100%}
.st-plane{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.st-plane .preview-plane{width:100%;max-width:360px}
.st-plane > b{font-size:26px}
.specs4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.spec{padding:14px 18px;background:var(--surface);border:1px solid rgba(127,200,255,.3);box-shadow:var(--lift);border-radius:var(--r)}
.spec > b{display:block;font-size:38px;color:#fff;margin:2px 0 4px}.spec p b{color:#fff}.spec p{margin:0;font-size:calc(17px * var(--tz));color:var(--muted);line-height:1.35}
/* markets */
.mkts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.mkt{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;padding:22px 26px;color:var(--white);cursor:pointer;background:var(--surface);border:1px solid rgba(127,200,255,.3);border-top:3px solid rgba(127,200,255,.45);box-shadow:var(--lift);border-radius:var(--r)}
.mkt:hover{border-color:rgba(var(--sel-rgb),.75)}
.mkt.on{border-color:var(--sel);border-top-color:#7fe0ff;box-shadow:inset 0 0 0 1px rgba(var(--sel-rgb),.5), 0 0 30px rgba(var(--sel-rgb),.3), var(--lift)}
.mk-city{font-size:34px}.mk-fig{font-size:22px}.mk-fig b{font-size:46px;color:#fff;margin-right:6px}
.mk-row{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:18px;color:var(--muted)}.mk-row b{color:#fff}
/* one service, to scale */
.rot{position:relative;padding:4px 0 6px}
.rot-axis{position:relative;height:20px;font-family:var(--mono);font-size:13px;color:var(--faint)}
.rot-axis span{position:absolute;transform:translateX(-50%)}
.rot-bar{position:relative;height:96px;background:rgba(127,200,255,.06);border:1px solid var(--hair)}
.rb{position:absolute;top:6px;bottom:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rb.new{animation:rbIn .45s ease-out;transform-origin:left center}
.rb span{display:flex;flex-direction:column;align-items:center;font-size:18px;font-weight:700;line-height:1.15;text-align:center;padding:0 4px}
.rb small{font-weight:400;font-size:13px;opacity:.85}
.rb.out,.rb.back{background:linear-gradient(180deg,#2a8fe0,#1560b8);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.rb.turn,.rb.home{background:repeating-linear-gradient(135deg,rgba(255,200,61,.22) 0 8px,rgba(255,200,61,.1) 8px 16px);border:1px solid rgba(255,200,61,.55);color:#ffe9a8}
@keyframes rbIn{from{opacity:.3;transform:scaleX(.2)}to{opacity:1;transform:none}}
.rot-marks{position:relative;height:66px;margin-top:4px}
.rm{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:14px;color:var(--muted);white-space:nowrap;border-left:0}
.rm::before{content:'';position:absolute;top:-8px;left:50%;width:2px;height:8px;background:#9fe3ff}
.rm b{font-size:18px;color:#fff}
.rm.low{top:30px}
.rm.ready b{color:#7fe0ff}.rm.ready{color:#9fe3ff;font-weight:700}
.rot-note{margin-top:14px;padding:16px 22px;background:var(--surface);border:1px solid rgba(127,200,255,.3);border-left:3px solid var(--sel);box-shadow:var(--lift)}
.rot-note h3{margin:0 0 8px;font-size:calc(26px * var(--tz));text-transform:none;letter-spacing:0;color:#fff;font-family:var(--sans)}
.rot-note p{margin:4px 0;font-size:calc(20px * var(--tz))}
.rot-note.turn{border-left-color:var(--amber)}
.rot-q{display:flex;gap:14px;margin-top:12px}.rot-q .btn{font-family:var(--mono);font-size:26px;min-width:130px}
@media (prefers-reduced-motion: reduce){ .rb{animation:none} }
/* timetable and services */
.tt{display:flex;flex-direction:column;gap:16px}
.tt .tl-bar,.planner .tl-bar{height:40px}
.planner .tl.compact .tl-axis{display:block}.planner .tl.compact .tl-bar{height:30px}
.svcs{display:flex;flex-wrap:wrap;gap:12px}
.svc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 16px;min-width:150px;cursor:pointer;color:var(--white);background:linear-gradient(160deg, rgba(30,82,152,.38), rgba(8,26,56,.6));border:1px solid rgba(127,200,255,.3);border-radius:var(--rb)}
.svc b{font-size:22px}.svc small{color:var(--muted);font-size:14px}
.svc:hover:not(:disabled){border-color:rgba(var(--sel-rgb),.7)}
.svc.on{border-color:var(--sel);background:linear-gradient(135deg, rgba(41,140,230,.32), rgba(8,29,61,.45));box-shadow:inset 3px 0 0 #7fe0ff, 0 0 18px rgba(var(--sel-rgb),.25)}
.svc:disabled{opacity:.45;cursor:not-allowed}
.svc.sm{min-width:0;padding:6px 14px;align-items:center}.svc.sm b{font-size:19px}
.tt-cap{display:flex;flex-direction:column;gap:4px}
/* fares and the capacity ladder */
.fares{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.fare{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 18px;cursor:pointer;color:var(--white);background:linear-gradient(160deg, rgba(30,82,152,.38), rgba(8,26,56,.6));border:1px solid rgba(127,200,255,.3);border-radius:var(--rb)}
.fare b{font-size:26px;color:var(--amber)}.fare span{font-size:15px;color:var(--muted)}
.fare.on{border-color:var(--sel);background:linear-gradient(135deg, rgba(41,140,230,.32), rgba(8,29,61,.45));box-shadow:inset 0 -3px 0 #7fe0ff, 0 0 18px rgba(var(--sel-rgb),.25)}
.fare.sm{padding:5px 10px}.fare.sm b{font-size:18px}.fare.sm span{font-size:12px}
.ladder{display:flex;flex-direction:column;gap:8px}
.ld-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:rgba(4,18,43,.4);border:1px solid var(--hair);margin-bottom:8px}
.ld-head b{font-size:40px;color:#fff}
.cap-row{display:grid;grid-template-columns:1.2fr .8fr 1fr;align-items:baseline;gap:8px;padding:10px 14px;text-align:left;cursor:pointer;color:var(--white);background:rgba(4,18,43,.35);border:1px solid rgba(127,200,255,.25);font-size:18px;border-radius:var(--rb)}
.cap-row b{font-size:26px;color:#fff}
.cap-row.on{border-color:var(--sel);background:rgba(41,140,230,.22);box-shadow:inset 3px 0 0 #7fe0ff}
/* fuel */
.fuel-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.fuel-facts > div{display:flex;flex-direction:column;gap:2px;padding:12px 16px;background:var(--surface);border:1px solid rgba(127,200,255,.3);box-shadow:var(--lift)}
.fuel-facts b{font-size:28px;color:#fff}.fuel-facts b.amber{color:var(--amber)}.fuel-facts b.orange{color:var(--orange)}.fuel-facts small{color:var(--muted);font-size:14px}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
/* forecast */
.fc-sum{display:flex;flex-direction:column;gap:10px;padding:16px 18px;font-size:calc(19px * var(--tz));background:rgba(4,18,43,.4);border:1px solid rgba(var(--sel-rgb),.5)}
.fc-sum span{display:flex;justify-content:space-between;gap:12px}.fc-sum b{font-size:22px;color:#fff}
.fc-sum .fc-total{border-top:1px solid var(--hair);padding-top:10px;font-weight:700}.fc-sum .fc-total b{font-size:30px}.fc-sum p{margin:0;font-size:16px}
.btn.huge{font-size:24px;padding:16px 34px;letter-spacing:.14em}
/* help */
.hchip{font:inherit;font-size:16px;font-weight:700;padding:8px 14px;color:#a8e6ff;background:rgba(41,140,230,.12);border:1px solid rgba(var(--sel-rgb),.45);border-radius:20px;cursor:pointer;margin-right:8px}
.hchip:hover{background:rgba(41,140,230,.25)}
.help-card{max-width:1100px;margin:0 auto}
.help-l{font-size:calc(21px * var(--tz));line-height:1.5;margin:6px 0}
.help-fares{display:flex;gap:28px;flex-wrap:wrap}.help-fares > div{display:flex;flex-direction:column;gap:4px;font-size:19px}
.rcp-def{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.rcp-def > div{display:flex;flex-direction:column;gap:6px;padding:14px 18px;background:var(--surface);border:1px solid var(--hair)}.rcp-def b{font-size:26px}.rcp-def span{font-size:19px}
/* the day planner */
.planner{display:flex;flex-direction:column;gap:12px;height:100%}
.plan-routes{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.plan-routes.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.plan-route{display:flex;flex-direction:column;gap:8px;padding:14px 18px;background:var(--surface);border:1px solid rgba(127,200,255,.3);box-shadow:var(--lift);border-radius:var(--r)}
.plan-route.flying{border-top:3px solid #7fe0ff}
.pr-head{display:flex;align-items:center;gap:12px;font-size:24px}.pr-head .muted{font-size:16px;margin-left:auto}
.pr-fares,.pr-svc{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.pr-fares .label,.pr-svc .label{min-width:5.5em}
.chip.new{color:var(--amber);border:1px solid rgba(255,200,61,.6);background:rgba(255,200,61,.08)}
.plan-sum{display:flex;flex-wrap:wrap;gap:6px 26px;padding:10px 16px;font-size:18px;background:rgba(4,18,43,.45);border:1px solid var(--hair)}.plan-sum b{color:#fff}
/* HQ evidence */
table.ev td.orange{color:var(--orange);font-weight:700}
/* results */
.rcp{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:18px;align-items:stretch;width:100%}
.rcp-b{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px 22px 26px;background:var(--surface);border:1px solid rgba(127,200,255,.3);box-shadow:var(--lift);overflow:hidden}
.rcp-b b{font-size:46px;color:#fff}.rcp-b small{color:var(--muted);font-size:15px}.rcp-b p{margin:4px 0 0;font-size:calc(20px * var(--tz))}
.rcp-b.rev b{color:var(--amber)}.rcp-b.prof b{color:var(--green)}.rcp-b.prof.neg b{color:var(--red)}
.rcp-bar{position:absolute;left:0;bottom:0;height:8px;width:var(--w);background:#3a95f0}.rcp-b.cost .rcp-bar{background:#d95926}
.rcp-op{align-self:center;font-size:48px;color:#9fe3ff;font-weight:300}
.rcp-help{margin-top:16px;text-align:center}
.capx{display:flex;flex-direction:column;gap:20px;width:100%}
.cx-figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cx-figs > div{display:flex;flex-direction:column;padding:12px 16px;background:var(--surface);border:1px solid var(--hair)}.cx-figs b{font-size:44px;color:#fff}.cx-figs b.green{color:var(--green)}.cx-figs b.orange{color:var(--orange)}
/* the end of the prototype */
.proto-end{align-items:center;text-align:center;padding:30px 40px;gap:14px}
.proto-end h1{font-size:44px;margin:6px 0 0}
.pe-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;width:100%;margin:10px 0}
.pe-grid > div{display:flex;flex-direction:column;gap:6px;align-items:center;padding:14px;background:var(--surface);border:1px solid rgba(127,200,255,.3);box-shadow:var(--lift)}
.pe-grid b{font-size:24px}.pe-grid small{color:var(--muted)}
#shopBtn{display:none}
@media (max-height:820px){
  .dm-big b{font-size:48px}.dm-eq b{font-size:34px}.pgroups.big .pg-dots{grid-template-columns:repeat(10,16px);gap:6px}.pgroups.big .pg-dots i{width:16px;height:16px}
  .spec > b{font-size:30px}.spec{padding:10px 14px}.rot-bar{height:70px}.rot-note{padding:10px 16px}.rot-note p{font-size:calc(18px * var(--tz))}
  .rcp-b b{font-size:36px}.cx-figs b{font-size:34px}.mkt{padding:16px 20px}.mk-fig b{font-size:38px}
  .plan-route{padding:10px 14px;gap:6px}.pr-head{font-size:20px}
}

/* ============================================================
   ALTAIR THEME (opening prototype): near-black navy, quiet title-case headings, sans figures,
   denser type, 8px corners. The HQ shell: left nav, KPI row, Overview, plan workspace.
   ============================================================ */
:root{
  --bg:#050d1c; --navy:#071226; --panel:#0b1830; --panel-solid:#0b1830; --tint:rgba(110,160,255,.02); --tint2:rgba(110,160,255,.04);
  --cy:#4cc9ff; --cyrgb:76,201,255; --line:rgba(110,160,255,.2); --hair:rgba(110,160,255,.12);
  --white:#e8f0fc; --muted:#93a7c6; --faint:#7d91b2; --grey:#8193ad;
  --amber:#f5c451; --amber2:#ffe39a; --green:#3ddc97; --ok:#3ddc97; --red:#ff5d6c; --orange:#ff9f43; --blue:#4ea8ff;
  --ocean:#040a16; --land:#14284a;
  --mono:var(--sans); --r:8px; --rb:6px;
  --surface:linear-gradient(180deg,#0d1c37 0%,#0a172e 100%);
  --lift:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.035);
  --act-a:#2196f3; --act-m:#1b84e0; --act-b:#1466c4; --sel:#39b9ff; --sel-rgb:57,185,255;
}
html,body{font-size:15px;font-variant-numeric:tabular-nums}
body{background:radial-gradient(1400px 700px at 70% -20%, rgba(40,110,220,.12), transparent 60%), #050d1c}
.mono,.num{font-family:var(--sans);font-variant-numeric:tabular-nums}
/* surfaces */
.card,.tf,.hp,.overlay .box,.strat,.mkt,.spec,.dm-big,.rot-note,.fuel-facts > div,.plan-route,.rcp-b,.pe-grid > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}
.hp .phead,.tf-bar,.screen-title{background:transparent;box-shadow:none}
.phead{text-transform:none;letter-spacing:.01em;font-size:15px;font-weight:650;color:#fff;padding:9px 14px;border-bottom:1px solid var(--hair)}
.hp .phead{font-size:15px;padding:9px 14px}
.phead::after{font-size:11px;letter-spacing:.08em;font-weight:700;text-shadow:none}
.tf-bar{margin:0 -24px;padding:9px 24px;font-size:14px;color:var(--muted)}
.screen-title h2{text-transform:none;letter-spacing:0}
.label{text-transform:none;letter-spacing:.02em;font-size:12.5px;font-weight:600;color:var(--muted)}
.hq-t th{text-transform:none;letter-spacing:.02em;font-size:12px;color:var(--muted);font-weight:600}
.hq-t td{font-size:14px;padding:6px 8px;border-bottom:1px solid var(--hair)}
.hq-t .num,.hq-t td .num{font-family:var(--sans);font-size:14px}
.ptab{text-transform:none;letter-spacing:.01em;font-size:13.5px}
.ii{font-size:14px;background:rgba(255,255,255,.02);border-radius:6px}
.ii .tag{font-family:var(--sans);font-size:11px;letter-spacing:.06em}
.chip{border-radius:20px}
/* buttons */
.btn{border-radius:var(--rb);text-transform:none;letter-spacing:.02em;font-weight:650;background:rgba(110,160,255,.06);border:1px solid var(--line);box-shadow:none}
.btn.big{font-size:17px;min-height:48px;padding:10px 22px}
.btn.primary,.btn.huge,.btn.act,.pad button.check,.side2 .pad button.check{background:linear-gradient(180deg,#2399f5 0%,#1569cf 100%);border:1px solid rgba(120,200,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 14px rgba(20,110,220,.35);text-shadow:none}
.btn.primary:hover:not(:disabled),.btn.act:hover:not(:disabled),.btn.huge:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 0 20px rgba(57,185,255,.45);filter:none}
.btn.primary:disabled{background:#122440;color:rgba(200,220,255,.45);border-color:var(--hair)}
.btn.huge{font-size:19px;padding:12px 26px;letter-spacing:.04em}
.choice,.opt,.plane-card,.card-n,.svc,.fare,.cap-row{border-radius:var(--rb);background:rgba(110,160,255,.05);border:1px solid var(--line)}
.choice{border-left:1px solid var(--line)}
.choice.on,.opt.on,.svc.on,.fare.on,.cap-row.on,.strat.on,.mkt.on{background:linear-gradient(180deg, rgba(57,185,255,.16), rgba(57,185,255,.06));border-color:var(--sel);box-shadow:0 0 0 1px rgba(57,185,255,.35), 0 0 18px rgba(57,185,255,.18)}
/* top bar */
.cbar{background:#071226;border-bottom:1px solid var(--hair);box-shadow:none;min-height:56px;padding:6px 14px}
.cbar .stat b,.stat b{font-family:var(--sans);color:#fff;text-shadow:none;font-size:18px}
.cbar .s-fleet,.cbar .s-fuel{display:none}
.cbar .btn.small{min-height:38px;padding:4px 12px;font-size:14px}
.cdate b{font-size:16px}
#cName{letter-spacing:.06em}
.cashbal{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;padding:4px 14px;margin-right:6px;border:1px solid rgba(245,196,81,.35);border-radius:var(--rb);background:rgba(245,196,81,.06)}
.cashbal b{font-size:22px;color:var(--amber);font-weight:750}
.cashbal span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.cops{border-radius:20px;font-size:12px}
/* the shell */
body.hqmode #screen{padding:10px 12px}
.shell{height:100%;min-height:0;display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px}
.lnav{display:flex;flex-direction:column;gap:4px;padding:6px 0;background:#071226;border:1px solid var(--hair);border-radius:var(--r)}
.nv{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;margin:0 6px;border:0;border-radius:var(--rb);background:transparent;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;cursor:pointer}
.nv svg{width:22px;height:22px;fill:currentColor}
.nv span{line-height:1.1;text-align:center}
.nv:hover:not(:disabled){color:#fff;background:rgba(110,160,255,.08)}
.nv.on{color:#fff;background:linear-gradient(180deg,#1d86e6,#1462bf);box-shadow:0 0 14px rgba(33,150,243,.35)}
.nv:disabled{opacity:.35;cursor:default}
@media (min-width:1600px){ .shell{grid-template-columns:170px minmax(0,1fr)} .nv{flex-direction:row;gap:12px;padding:11px 14px;font-size:14.5px} .nv span{text-align:left} }
.shell-main{min-width:0;min-height:0;height:100%}
/* KPI row */
.kpis{grid-area:k;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi2{flex-direction:row;align-items:center;gap:12px;padding:10px 14px}
.kpi2 .ki{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(57,185,255,.12)}
.kpi2 .ki svg{width:22px;height:22px;fill:var(--cy)}
.kpi2.k-cash .ki{background:rgba(245,196,81,.12)}.kpi2.k-cash .ki svg{fill:var(--amber)}
.kpi2.k-profit .ki svg{fill:var(--green)}.kpi2.k-profit .ki{background:rgba(61,220,151,.12)}
.kpi2.k-rep .ki svg{fill:var(--amber)}
.kt{display:flex;flex-direction:column;min-width:0}
.kl{font-size:12.5px;color:var(--muted);font-weight:600}
.kv2{font-size:24px;font-weight:750;color:#fff;line-height:1.15;white-space:nowrap}
.kv2 .stars{font-size:20px}
.ks2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi2 .spark{position:absolute;right:12px;top:10px;width:24%;height:26px}
/* Overview grid */
.ov{height:100%;min-height:0;display:grid;gap:10px;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto minmax(0,1.25fr) minmax(0,1fr);
  grid-template-areas:"k k k k k k k k k k k k" "mp mp mp mp mp mp mp td td td td td" "rp rp rp rp lo lo lo lo fb fb fb fb"}
.ov.wide{grid-template-rows:auto minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"k k k k k k k k k k k k" "mp mp mp mp mp mp mp mp td td td td" "rp rp rp fi fi fi lo lo lo fb fb fb"}
.ov .p-map{grid-area:mp}.ov .p-td{grid-area:td}.ov .p-rp{grid-area:rp}.ov .p-fi{grid-area:fi}.ov .p-lo{grid-area:lo}.ov .p-fb{grid-area:fb}
.ov .hp .pb{padding:8px 12px;overflow:hidden;flex:1;min-height:0}
.td2{display:flex;flex-direction:column;gap:8px}
.td-news2{margin:0;font-size:18px;color:#fff}
.td-brief{margin:0;font-size:14px;color:var(--muted);border-left:2px solid var(--sel);padding-left:10px}
.td-list{display:flex;flex-direction:column;gap:0;margin-top:2px}
.td-list > div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--hair);font-size:14px}
.td-list > div span{color:var(--muted)}.td-list > div b{color:#fff;font-weight:600;text-align:right}
.td-list > div.done span{color:var(--green)}.td-list > div.cur span{color:var(--sel)}
.td2 .td-act{margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.td2 .btn.act{min-height:46px;font-size:16px;padding:8px 18px}
.live-clock{display:flex;align-items:baseline;justify-content:space-between}.live-clock b{font-size:38px;font-weight:750;color:#fff}
.live-bar{height:8px;border-radius:4px;background:rgba(110,160,255,.12);overflow:hidden}.live-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2196f3,#5fd3ff)}
.dr-rcp{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center}
.dr-rcp > div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid var(--hair)}
.dr-rcp b{font-size:22px;font-weight:750}.dr-rcp .rev b{color:var(--amber)}.dr-rcp .cost b{color:#fff}.dr-rcp .prof b{color:var(--green)}.dr-rcp .prof.neg b{color:var(--red)}
.dr-rcp small{font-size:12px;color:var(--muted);line-height:1.25}
.dr-rcp > i{font-style:normal;font-size:22px;color:var(--muted)}
.dr-fc{margin:0;font-size:14px}
.dr-routes{display:flex;flex-direction:column;gap:3px;font-size:14px}
.lo .st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--grey);vertical-align:middle}
.lo .st-dot.ok,.lo .st-dot.go{background:var(--green)}.lo .st-dot.warn{background:var(--orange)}.lo .st-dot.bad{background:var(--red)}.lo .st-dot.run{background:var(--sel)}
.lo .lo-st.ok,.lo .lo-st.go{color:var(--green)}.lo .lo-st.warn{color:var(--orange)}.lo .lo-st.bad{color:var(--red)}.lo .lo-st.run{color:var(--sel)}
.fb{position:relative;display:flex;flex-direction:column;gap:8px}
.fb-card{display:none;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid var(--hair);animation:fbIn .4s ease-out}
.fb-card.on{display:flex}.fb-face{font-size:30px;line-height:1}.fb-card p{margin:4px 0 0;font-size:14.5px;line-height:1.35}
@keyframes fbIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fb-nav{display:flex;align-items:center;gap:10px;justify-content:flex-end;color:var(--muted);font-size:13px}.fb-nav .btn{min-height:30px;padding:0 10px}
@media (prefers-reduced-motion: reduce){ .fb-card{animation:none} }
/* workspace: plan rail · task · money */
.ws{height:100%;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr) 240px;gap:10px}
@media (min-width:1600px){ .ws{grid-template-columns:260px minmax(0,1fr) 280px} }
.ws-rail,.ws-money{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}
.ws-h{padding:9px 14px;font-size:15px;font-weight:650;color:#fff;border-bottom:1px solid var(--hair)}
.ws-h.sub{font-size:13.5px;color:var(--muted);border-top:1px solid var(--hair);margin-top:4px}
.rail{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.ri{display:flex;gap:10px;align-items:flex-start;width:100%;padding:6px 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;text-align:left;cursor:default}
.ri.done{cursor:pointer;color:#fff}.ri.done:hover{background:rgba(110,160,255,.07)}
.ri.on{background:linear-gradient(180deg, rgba(57,185,255,.16), rgba(57,185,255,.06));box-shadow:inset 3px 0 0 var(--sel);color:#fff}
.ri-k{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--line)}
.ri.done .ri-k{background:rgba(61,220,151,.15);border-color:rgba(61,220,151,.5);color:var(--green)}
.ri.on .ri-k{background:var(--sel);border-color:var(--sel);color:#04223f}
.ri-t{display:flex;flex-direction:column;min-width:0}.ri-t b{font-size:14px;font-weight:650}.ri-t small{font-size:12.5px;color:var(--muted);line-height:1.3}
.ri.done .ri-t small{color:#bcd0ee}
.ri.last{opacity:.6}
.mp-cash{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px}
.mp-cash span{font-size:13.5px;color:var(--muted)}.mp-cash b{font-size:24px;font-weight:750;color:var(--amber)}
.mp-cash.small{padding:6px 14px}.mp-cash.small b{font-size:17px;color:#fff}
.mp-lines{display:flex;flex-direction:column;padding:0 14px}
.mp-lines > div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.mp-lines span{color:var(--muted)}.mp-lines b{font-weight:650;color:#fff}
b.pos,.mp-cash b.pos{color:var(--green)}b.neg,.mp-cash b.neg{color:var(--red)}
.mp-note{padding:6px 14px;font-size:13px}
.ws-main{min-width:0;min-height:0;height:100%}
.ws-main > .tf{zoom:.8;height:100%}
@media (min-width:1600px) and (min-height:880px){ .ws-main > .tf{zoom:.88} }
.ws-main .tf-story{border-left:2px solid var(--sel);background:rgba(57,185,255,.05);border-radius:0 6px 6px 0;padding:8px 14px}
.ws-main .tf-story::before{content:'Briefing';display:block;width:100%;font-size:13px;font-weight:700;color:var(--sel);letter-spacing:.04em}
/* views */
.vw{height:100%;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vw.net{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.vw .hp .pb{padding:10px 14px;overflow:auto;flex:1;min-height:0}
.vw .fin-pb{overflow:hidden}
.fl-specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start}
.fl-specs > div{display:flex;flex-direction:column;padding:10px;border:1px solid var(--hair);border-radius:6px}.fl-specs b{font-size:20px}.fl-specs small{color:var(--muted)}
.proto-end{height:100%;align-items:center;text-align:center;gap:14px;padding-bottom:24px}
/* map: dark land, near-black sea, glowing routes */
.borders{stroke:#6f9ad8;stroke-opacity:.28}
.route{stroke:#5fd3ff;filter:drop-shadow(0 0 5px rgba(95,211,255,.8))}
.marker .dot{fill:#5fd3ff;stroke:#041022}
.marker.home .dot{fill:var(--amber)}
.zoomBtns .btn{width:36px;height:36px;font-size:18px;background:rgba(7,18,38,.9)}
/* the wall keeps its split-flap boards in a monospaced face */
.w-board,.w-board *{font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace}
.w-head,.w-status{background:#071226}
.w-ticker{background:#071226}

/* ALTAIR fixes: KPI cards sit in their own row; denser tables at laptop size */
.kpis > .hp{grid-area:auto}
.td-news2{text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:700}
.ri:disabled{opacity:1}.ri.on{color:#fff}.ri.on .ri-t small{color:#bcd0ee}
.ri:not(.on):not(.done) .ri-t b{color:var(--faint)}
.ov.compact{grid-template-rows:auto minmax(0,1.45fr) minmax(0,1fr)}
.ov table.ev th:nth-child(6),.ov table.ev td:nth-child(6),.ov table.ev th:nth-child(7),.ov table.ev td:nth-child(7),.ov table.ev th:nth-child(8),.ov table.ev td:nth-child(8){display:none}
.ov table.ev th,.ov table.ev td{padding-left:6px;padding-right:6px}
.ov.compact .td-list > div{padding:4px 0}
.ov.compact .td-brief{font-size:13px}
.ov.compact .dr-rcp b{font-size:19px}.ov.compact .dr-rcp > div{padding:6px 8px}
.ov.compact .td2{gap:6px}
.lo-st.s-scheduled{color:var(--muted)}.st-dot.s-scheduled{background:var(--grey)}
.lo-st.s-boarding{color:var(--sel)}.st-dot.s-boarding{background:var(--sel)}
.lo-st.s-departed,.lo-st.s-inflight{color:#7ab8ff}.st-dot.s-departed,.st-dot.s-inflight{background:#4ea8ff}

/* ============================================================
   DESIGN SYSTEM (HQ Desktop pass): one navy palette lit from the upper left, cyan panel titles,
   gold only for money and prestige, green for done, orange for "no seat", red for real problems.
   Words in the system sans; figures in the same sans with even-width digits; the calculation
   dock uses a modern monospace so its column sum lines up. Corners 0–2px.
   ============================================================ */
:root{
  --bg:#061426; --navy:#081E3D; --panel:#0B2448; --panel-solid:#0B2448; --top:#154477;
  --cy:#63D8FF; --cyrgb:99,216,255; --sel:#63D8FF; --sel-rgb:99,216,255; --act:#168BE8;
  --white:#F2F7FD; --muted:#A9C2DD; --faint:#86A2C4; --grey:#8AA3C2;
  --line:rgba(110,190,245,.20); --hair:rgba(110,190,245,.12); --edge:rgba(100,200,255,.28);
  --amber:#F3C754; --amber2:#FFE29A; --gold:#F3C754; --green:#56E6A6; --ok:#56E6A6; --orange:#F59A4A; --red:#F2636A; --blue:#4EA8FF;
  --land:#163A66; --ocean:#061426;
  --sans:"Segoe UI","Segoe UI Variable",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:var(--sans); --num:var(--sans);
  --fig:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,Menlo,"DejaVu Sans Mono",monospace;
  --r:2px; --rb:2px;
  --surface:linear-gradient(145deg,rgba(21,68,119,.45) 0%,rgba(11,36,72,.92) 42%,#0A2244 100%);
  --lift:0 6px 18px rgba(0,8,24,.32), inset 0 1px 0 rgba(170,220,255,.05);
}
html,body{font-family:var(--sans);font-variant-numeric:tabular-nums}
body{background:radial-gradient(1300px 620px at 12% -12%, rgba(38,120,220,.17), transparent 62%), #061426}
.mono,.num,.c,.stat b,.answer input,.answer .unit{font-family:var(--sans);font-variant-numeric:tabular-nums}
.gold{color:var(--gold)}.cy{color:var(--cy)}
/* surfaces: page → shell → panels → the active workspace → the dock */
.card,.tf,.hp,.overlay .box{background:var(--surface);border:1px solid var(--line);border-radius:2px;box-shadow:var(--lift)}
.strat,.mkt,.spec,.dm-big,.rot-note,.plan-route,.rcp-b,.pe-grid > div,.ff-box,.cmp,.apt,.term{background:linear-gradient(145deg,rgba(21,68,119,.35),rgba(9,30,61,.55) 55%);border:1px solid var(--line);border-radius:2px;box-shadow:none}
/* headings: mixed case, cyan panel titles */
.phead,.hp .phead{text-transform:none;letter-spacing:.005em;font-size:16.5px;font-weight:600;color:var(--cy);background:transparent;border-bottom:1px solid var(--hair);padding:10px 14px}
.phead::after{font-size:11.5px;letter-spacing:.1em;font-weight:700;text-shadow:none;text-transform:uppercase;color:var(--green)}
h1.tq,.screen-title h2,.td-news2,.proto-end h1{text-transform:none;letter-spacing:0}
.label,.kl{color:var(--muted)}
/* buttons */
.btn{border-radius:2px;background:rgba(20,62,112,.45);border:1px solid var(--line);color:#E9F2FC;box-shadow:none;text-shadow:none;font-weight:600;letter-spacing:.01em;text-transform:none}
.btn:hover:not(:disabled){border-color:rgba(99,216,255,.6);background:rgba(28,80,140,.55)}
.btn.primary,.btn.huge,.btn.act{background:linear-gradient(180deg,#239FF1,#1473CB);border:1px solid rgba(130,215,255,.6);color:#fff;box-shadow:0 4px 12px rgba(0,100,220,.22), inset 0 1px 0 rgba(255,255,255,.2)}
.btn.primary:hover:not(:disabled),.btn.huge:hover:not(:disabled),.btn.act:hover:not(:disabled){background:linear-gradient(180deg,#43B2F7,#1E83DA);box-shadow:0 5px 16px rgba(0,110,230,.32), inset 0 1px 0 rgba(255,255,255,.26);filter:none}
.btn.primary:active:not(:disabled),.btn.huge:active:not(:disabled){background:linear-gradient(180deg,#1680D0,#105FAE);transform:translateY(1px);box-shadow:0 2px 6px rgba(0,80,180,.25)}
.btn.primary:disabled,.btn.huge:disabled{background:#11294A;color:rgba(200,222,245,.45);border-color:var(--hair);box-shadow:none}
/* selectable items: cyan edge, a blue wash from the upper left, a faint inner light; never gold */
.choice,.opt,.svc,.fare,.cap-row,.opt-chip,.mkt,.strat,.apt,.term{border-radius:2px}
.choice.on,.opt.on,.svc.on,.fare.on,.cap-row.on,.strat.on,.mkt.on,.apt.on,.term.on,.opt-chip.on{border:1px solid var(--cy);background:linear-gradient(145deg,rgba(35,159,241,.30),rgba(13,47,92,.55) 60%);box-shadow:0 0 0 1px rgba(99,216,255,.35), inset 0 1px 0 rgba(255,255,255,.08), 0 0 16px rgba(99,216,255,.14)}
/* ---------- the top bar, in zones ---------- */
.cbar{min-height:64px;padding:0 10px;gap:0;background:linear-gradient(180deg,#0B2449,#081C3A);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(0,6,20,.4)}
.cbar > *{padding:0 14px}
.cbar > .btn{padding:0 12px;margin-left:8px}
.cbar .brand,.cbar .cdate,.cbar .cops{border-right:1px solid var(--hair);align-self:stretch;display:flex;align-items:center}
.cbar .cops{border:0;align-self:center;margin:0 14px;padding:6px 12px}
.cbar .brand{max-width:280px}
.bname{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#cName{font-size:20px;font-weight:700;letter-spacing:.07em;color:#fff;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cStrat{font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--cy);text-transform:uppercase;background:none;border:0;padding:0}
.cdate{flex-direction:column;align-items:flex-start!important;justify-content:center;gap:1px}
.cdate b{font-size:16px;font-weight:600;color:#fff}.cdate span{display:flex}.cdate i{font-style:normal;font-size:13px;color:var(--muted);letter-spacing:0;text-transform:none}
.cdate i.chip{display:none}
.cops{font-size:12.5px;letter-spacing:.1em;border-radius:2px;color:var(--cy);border:1px solid rgba(99,216,255,.6);background:rgba(99,216,255,.06)}
.s-rep{display:flex;flex-direction:column;justify-content:center;gap:0}
.s-rep .label{font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500}
.s-rep .stars{font-size:21px}
.cashbal{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:6px 16px;margin-right:4px;border:1px solid rgba(243,199,84,.62);background:rgba(243,199,84,.07);border-radius:2px}
.cashbal b{font-size:22px;font-weight:600;color:var(--gold)}.cashbal span{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.cbar .btn.small{min-height:46px;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.cbar .btn svg{width:20px;height:20px;fill:currentColor;flex:none}
.cbar .ibtn{width:46px;justify-content:center;padding:0}
.cbar #presentBtn .lbl{display:none}
.bell{position:relative}
.bell sup{top:5px;right:5px;min-width:16px;height:16px;font-size:11px;line-height:16px}
@media (min-width:1600px){ .cbar #presentBtn{width:auto;padding:0 14px} .cbar #presentBtn .lbl{display:inline} }
/* ---------- the shell: nav · workspace · action bar ---------- */
body.hqmode #screen{padding:10px 12px}
.shell{height:100%;min-height:0;display:grid;grid-template-columns:86px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:10px}
.shell.has-bar{grid-template-rows:minmax(0,1fr) auto}
.shell.has-bar > .actbar{grid-column:1 / -1}
.lnav{display:flex;flex-direction:column;gap:6px;padding:6px;background:#081E3D;border:1px solid var(--hair);border-radius:2px}
.nv,.nv:hover:not(:disabled){flex-direction:column;align-items:center;gap:4px;padding:10px 2px 9px;margin:0;border:1px solid transparent;border-radius:2px;background:transparent;color:#D8E6F5;font-size:12.5px;font-weight:600;text-align:center}
.nv:hover{background:rgba(110,190,245,.08)!important;color:#fff}
.nv svg{width:26px;height:26px;fill:currentColor}
.nv span{line-height:1.15}
.nv.on,.nv.on:hover{background:linear-gradient(180deg,#2196F3,#1565C8)!important;border-color:rgba(140,215,255,.65);color:#fff;box-shadow:0 4px 14px rgba(0,100,220,.3), inset 0 1px 0 rgba(255,255,255,.22)}
.nv.locked{opacity:.5;cursor:default}
.nv[aria-disabled="true"]:not(.locked){opacity:.45;cursor:default}
.nv-note{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;line-height:1.15;color:var(--muted);font-weight:500}
.nv-note svg{width:11px;height:11px;fill:var(--muted)}
.nv.lit{animation:navLit 1.8s ease-out}
@keyframes navLit{0%{box-shadow:none}25%{box-shadow:0 0 0 2px rgba(86,230,166,.85),0 0 18px rgba(86,230,166,.55)}100%{box-shadow:none}}
@media (min-width:1600px){ .shell{grid-template-columns:96px minmax(0,1fr)} .nv,.nv:hover:not(:disabled){flex-direction:column;font-size:13.5px;padding:12px 2px} .nv span{text-align:center} }
.actbar{display:flex;align-items:center;gap:14px;min-height:58px;padding:6px 8px 6px 16px;background:linear-gradient(180deg,#0B2449,#081C3A);border:1px solid var(--line)}
.ab-i{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:700 14px/1 Georgia,serif;font-style:italic;color:var(--muted)}
.ab-hint{flex:1;margin:0;font-size:16px;line-height:1.3;color:#DCE8F6;min-width:0}
.ab-act{display:flex;align-items:center;gap:10px;flex:none}
.ab-act .grow{display:none}
.ab-act > .muted{font-size:14px;max-width:360px}
.actbar .btn.big{min-height:46px;font-size:17px;padding:8px 26px}
.actbar .btn.primary.big{min-width:230px;font-size:18px;letter-spacing:.02em}
@media (min-width:1600px){ .actbar{min-height:66px} .actbar .btn.primary.big{min-width:290px;min-height:52px;font-size:19px} .ab-hint{font-size:17px} }
/* ---------- the workspace: rail · main · dock ---------- */
.ws{height:100%;min-height:0;display:grid;grid-template-columns:222px minmax(0,1fr) 278px;gap:10px}
.ws.ws-options{grid-template-columns:200px minmax(0,1fr) 250px}
.ws.dock-shut{grid-template-columns:222px minmax(0,1fr) 44px}
.ws.ws-options.dock-shut{grid-template-columns:200px minmax(0,1fr) 44px}
@media (min-width:1600px){ .ws{grid-template-columns:272px minmax(0,1fr) 340px} .ws.ws-options{grid-template-columns:240px minmax(0,1fr) 300px} .ws.dock-shut{grid-template-columns:272px minmax(0,1fr) 44px} }
.ws-rail{display:flex;flex-direction:column;min-height:0;overflow:auto;background:#081E3D;border:1px solid var(--hair);border-radius:2px;box-shadow:none}
.ws-rail .ws-h{display:flex;flex-direction:column;gap:2px;padding:13px 14px 11px;font-size:17px;font-weight:600;color:#fff;border-bottom:1px solid var(--hair)}
.ws-rail .ws-h small{font-size:13px;font-weight:400;color:var(--muted)}
.stages{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:8px}
.stg{border:1px solid var(--hair);background:rgba(13,47,92,.32)}
.stg-h{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 10px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:default}
.stg-h:disabled{opacity:1;color:inherit}
.stg.done .stg-h{cursor:pointer}.stg.done .stg-h:hover{background:rgba(110,190,245,.06)}
.stg-k{flex:none;width:25px;height:25px;display:grid;place-items:center;font-size:13.5px;font-weight:700;border:1.5px solid rgba(169,194,221,.5);color:#E9F2FC;border-radius:2px}
.stg-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.stg-t b{font-size:15px;font-weight:600;color:#fff;line-height:1.2}
.stg-t small{font-size:12.5px;color:var(--muted);line-height:1.3}
.stg.done{border-left:3px solid var(--green);background:rgba(10,38,74,.55)}
.stg.done .stg-k{background:#25B072;border-color:#3CCB8A;color:#fff}
.stg.done .stg-t small{color:#BFD3EA}
.stg.cur{background:linear-gradient(145deg,rgba(33,140,235,.30),rgba(13,47,92,.45) 70%);border-color:rgba(99,216,255,.45);box-shadow:inset 3px 0 0 var(--cy)}
.stg.cur .stg-k{background:#1E9BEA;border-color:#7FE0FF;color:#fff}
.stg.cur .stg-t small{color:var(--cy)}
.stg.next .stg-t b{color:#D2E0F0}
.stg-lock svg{width:15px;height:15px;fill:var(--faint);margin-top:4px}
.stg-chev{font-style:normal;color:var(--muted);font-size:12px;margin-top:4px}
.subs{list-style:none;margin:0 10px 10px 22px;padding:0 0 0 14px;border-left:1px solid rgba(99,216,255,.28);display:flex;flex-direction:column;gap:1px}
.subs .ri{display:flex;gap:10px;align-items:flex-start;width:100%;padding:6px 6px;border:0;border-radius:2px;background:transparent;color:#fff;font:inherit;text-align:left;cursor:default;box-shadow:none}
.subs .ri.done{cursor:pointer}.subs .ri.done:hover{background:rgba(110,190,245,.07)}
.subs .ri.on{background:rgba(99,216,255,.09);box-shadow:none}
.ri-d{flex:none;width:11px;height:11px;margin:4px 0 0 -21px;border-radius:50%;border:2px solid rgba(99,216,255,.75);background:#081E3D}
.ri.on .ri-d{background:var(--cy);box-shadow:0 0 8px rgba(99,216,255,.7)}
.ri.done .ri-d{background:var(--green);border-color:var(--green)}
.subs .ri-t b{font-size:14px;font-weight:600;color:#fff}.subs .ri-t small{font-size:12.5px;color:var(--muted)}
.subs .ri:not(.on):not(.done) .ri-t b{color:#C9D9EC}
.ri-e{margin-left:auto;font-size:12px;color:var(--cy);align-self:center}
.ws-main{min-width:0;min-height:0;height:100%}
.ws-main > .tf{zoom:.8;height:100%;background:linear-gradient(145deg,rgba(21,68,119,.62) 0%,rgba(11,36,72,.95) 38%,#0A2244 100%);border:1px solid rgba(110,190,245,.24)}
@media (min-width:1600px) and (min-height:880px){ .ws-main > .tf{zoom:.9} }
.ws-main .tf-bar{color:var(--cy);font-size:15px;font-weight:500;letter-spacing:.01em;text-transform:none;border-bottom:0;padding:12px 24px 0}
.ws-main h1.tq{font-size:calc(33px * var(--tz));font-weight:700;color:#fff}
.ws-main .tf-story{border:0;background:none;padding:0;margin-top:-6px}
.ws-main .tf-story::before{display:none}
.ws-main .tf-story p{font-size:calc(18px * var(--tz));color:var(--muted);margin:0 0 2px}
.ws-main .tf-main{overflow:auto}
.ws-main .tf-body{gap:14px}
/* panels inside the workspace */
.pnl{background:rgba(7,24,50,.55);border:1px solid var(--line);padding:12px 16px}
.pnl-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.pnl-h h3{margin:0;font-size:20px;font-weight:600;color:var(--cy)}
.pnl-h .muted{font-size:15px}
.pnl-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
.build,.tt{display:flex;flex-direction:column;gap:12px}
/* ---------- the dock ---------- */
.dock{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:linear-gradient(160deg,#0F3060 0%,#0B2449 45%,#0A2142 100%);border:1px solid rgba(99,216,255,.36);box-shadow:-4px 0 18px rgba(0,8,24,.38), inset 0 1px 0 rgba(170,220,255,.07);border-radius:2px}
.dk-h{display:flex;align-items:center;gap:8px;padding:11px 12px 10px 14px;border-bottom:1px solid var(--hair);flex:none}
.dk-kind{display:none}
.dock:not(.dock-context) .dk-kind{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#04223F;background:var(--cy);padding:2px 6px}
.dk-t{flex:1;min-width:0;font-size:16.5px;font-weight:600;color:var(--cy);line-height:1.2}
.dk-x{flex:none;width:32px;height:32px;display:grid;place-items:center;background:rgba(20,62,112,.5);border:1px solid var(--line);color:#E9F2FC;font:inherit;font-size:16px;cursor:pointer;border-radius:2px}
.dk-x:hover{border-color:var(--cy)}
.dk-b{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.dk-tools{flex:none;padding:10px 12px 12px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:6px}
.dk-tools h4{margin:0 0 2px;font-size:14.5px;font-weight:600;color:var(--cy)}
.dk-help{display:flex;align-items:center;gap:11px;padding:8px 10px;background:rgba(13,47,92,.6);border:1px solid var(--line);color:#fff;font:inherit;text-align:left;cursor:pointer;border-radius:2px}
.dk-help:hover{border-color:rgba(99,216,255,.6);background:rgba(20,62,112,.7)}
.dk-help i{flex:none;width:28px;height:28px;border-radius:50%;background:#1E7FD8;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px}
.dk-help span{flex:1;display:flex;flex-direction:column;min-width:0}.dk-help b{font-size:14px;font-weight:600}.dk-help small{font-size:12px;color:var(--muted)}
.dk-help em{font-style:normal;font-size:22px;line-height:1;color:var(--muted)}
.dock.shut{align-items:stretch}
.dk-open{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;background:transparent;border:0;color:var(--cy);font:inherit;cursor:pointer}
.dk-open span{font-size:22px}.dk-open b{writing-mode:vertical-rl;font-size:14px;font-weight:600;letter-spacing:.04em}
/* context content */
.kvs{margin:0;display:flex;flex-direction:column}
.kvs > div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair)}
.kvs > div:last-child{border-bottom:0}
.kvs dt{font-size:13.5px;color:var(--muted)}
.kvs dd{margin:0;text-align:right;font-size:15px;font-weight:600;color:#fff;display:flex;flex-direction:column;align-items:flex-end}
.kvs dd small{font-size:11.5px;font-weight:400;color:var(--muted)}
.kvs .tot dd{font-size:19px}
.cx{border:1px solid var(--hair);background:rgba(6,20,38,.35);padding:9px 12px}
.cx h4{margin:0 0 3px;font-size:15px;font-weight:600;color:var(--cy);display:flex;align-items:center;gap:6px}
.ac-card{display:flex;gap:12px;align-items:center}
.ac-pic{width:96px;height:62px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#235C98,#0D2D57);border:1px solid var(--line)}
.ac-pic svg{width:84px;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.ac-t{display:flex;flex-direction:column;min-width:0}.ac-t b{font-size:15.5px;color:#fff}.ac-t > span{font-size:14px;color:#fff}.ac-t small{font-size:12px;color:var(--muted);line-height:1.3}
.cx-t,.deps-t{width:100%;border-collapse:collapse;font-size:13.5px}
.cx-t th,.cx-t td,.deps-t th,.deps-t td{padding:6px 4px;border-bottom:1px solid var(--hair);text-align:left}
.cx-t thead th,.deps-t thead th{font-size:12px;font-weight:600;color:var(--muted)}
.cx-t thead th.on{color:var(--cy)}
.cx-t tbody th{font-weight:500;color:var(--muted)}
.cx-t td{color:#fff;font-weight:600}
.deps-t td{color:#fff}
.cx.deps h4{margin-bottom:4px}
.cx-note{font-size:13px;margin:2px 0 0;line-height:1.35}
/* the forecast in the dock (cost your options) */
.fc-plans{display:flex;flex-direction:column;gap:8px}
.fc-plan{border:1px solid var(--line);background:rgba(6,20,38,.4);padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.fc-plan.best{border-color:rgba(86,230,166,.6)}
.fp-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.fp-h b{color:#fff;font-size:15px}.fp-h span{font-size:12.5px;color:var(--muted);text-align:right}
.fp-todo{margin:0;color:var(--cy);font-size:14px}
.fc-plan p{margin:0;font-size:13.5px}
.fp-p{display:flex;justify-content:space-between;align-items:baseline}.fp-p span{color:var(--muted);font-size:13px}.fp-p b{font-size:20px;font-weight:600}
.fc-plan .btn{min-height:38px;font-size:14.5px}
/* the calculation dock: a stacked sum and one large answer box (no number pad) */
.calc{display:flex;flex-direction:column;gap:12px}
.calc-q{margin:0;font-size:16.5px;color:#fff;line-height:1.35}
.cstack{display:flex;flex-direction:column;border:1px solid var(--line);background:rgba(4,16,31,.55);padding:4px 12px}
.cs{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair)}
.cs-op{font-family:var(--fig);font-size:20px;color:var(--cy);text-align:center}
.cs-l{font-size:14px;color:var(--muted);line-height:1.25}
.cs-v,.cs-v.mono{font-family:var(--fig);font-size:21px;font-weight:500;color:#fff;text-align:right;white-space:nowrap}
.cs.ans{border-bottom:0;border-top:2px solid rgba(99,216,255,.6);grid-template-columns:20px minmax(0,.8fr) minmax(0,1.4fr)}
.dock .answer{display:flex;align-items:center;gap:4px;background:#04101F;border:2px solid var(--cy);padding:4px 8px;border-radius:2px;box-shadow:0 0 0 3px rgba(99,216,255,.12)}
.dock .answer .unit{font-family:var(--fig);font-size:21px;font-weight:500;color:var(--muted);text-shadow:none}
.dock .answer input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-family:var(--fig);font-size:26px;font-weight:500;text-align:right;text-shadow:none;letter-spacing:0}
.calc .btn.primary.big{width:100%;min-height:50px;font-size:18px}
.calc .msg{min-height:1.3em;margin:0;font-size:14.5px;line-height:1.35;color:var(--orange)}
.calc .msg:empty{display:none}
.calc-hint{margin:0;font-size:12.5px;color:var(--muted)}
.calc-ok{margin:0;font-size:18px;color:var(--green);font-weight:600}
.cs-v.ok{color:var(--green)}
.calc-act{display:flex;gap:8px}.calc-act .btn{flex:1;min-height:46px}
/* figures still to complete, in a table or on the fuel order */
td.c.enter button,.cellbtn{width:100%;min-height:30px;padding:3px 10px;background:rgba(99,216,255,.09);border:1px solid rgba(99,216,255,.7);border-radius:2px;color:var(--cy);font:600 15px/1.2 var(--sans);letter-spacing:.01em;cursor:pointer;text-shadow:none;box-shadow:none}
td.c.enter button:hover,.cellbtn:hover{background:rgba(99,216,255,.18)}
td.c.enter.on button{background:rgba(99,216,255,.24);color:#fff;border-color:var(--cy);box-shadow:0 0 0 2px rgba(99,216,255,.25)}
.cellbtn{width:auto;min-height:34px;font-size:16px}
td.c.flash,b.flash{animation:cellFlash 1.6s ease-out}
@keyframes cellFlash{0%{background:rgba(86,230,166,.45);color:#fff}100%{background:transparent}}
/* the working space */
.dock-work .dk-b{overflow:hidden}
.wpad{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.wp-pins{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 10px;border:1px solid var(--hair);background:rgba(4,16,31,.45)}
.wp-pins > b{width:100%;font-size:13px;color:var(--cy)}
.wp-pins span{display:flex;flex-direction:column}.wp-pins small{font-size:11.5px;color:var(--muted)}.wp-pins span b{font-family:var(--fig);font-size:17px;font-weight:500}
.wp-none{margin:0;font-size:13px}
#padCv{flex:1;min-height:200px;width:100%;background:#04101F;border:1px solid var(--line);touch-action:none;cursor:crosshair;display:block}
.wp-tools{display:flex;flex-wrap:wrap;gap:6px}.wp-tools .btn.small{min-height:34px;padding:2px 10px;font-size:13.5px}
.wp-tools [aria-pressed="true"]{border-color:var(--cy);color:var(--cy)}
/* help in the dock */
.dock .help-l{margin:0;padding-left:18px;font-size:14.5px;line-height:1.45;display:flex;flex-direction:column;gap:4px}
.dock .rot{zoom:.62}
.dock .help-fares{display:flex;flex-direction:column;gap:8px;font-size:14px}
.dock .rcp-def{display:flex;flex-direction:column;gap:8px}
/* ---------- the service timeline (one row per service) ---------- */
.sgantt{display:flex;flex-direction:column;gap:6px}
.sg-ax,.sg-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.sg-l{display:flex;flex-direction:column;font-size:16px;font-weight:600;color:#fff}.sg-l small{font-size:12.5px;font-weight:400;color:var(--muted)}
.sg-tk{position:relative;height:20px;border-bottom:1px solid var(--hair)}
.sg-tk span{position:absolute;top:0;transform:translateX(-50%);font-size:13px;color:var(--muted);white-space:nowrap}
.sg-tr{position:relative;height:56px;background:rgba(4,16,31,.35);border:1px solid var(--hair)}
.sg-row.empty .sg-tr{display:flex;align-items:center;padding:0 12px;font-size:14px;color:var(--muted)}
.sg-b{position:absolute;top:5px;bottom:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;font-style:normal;overflow:hidden;white-space:nowrap;padding:0 3px;border:1px solid rgba(150,215,255,.55)}
.sg-b b{font-size:13.5px;font-weight:600;color:#fff;line-height:1.1}
.sg-b small{font-size:12px;color:#D9E9FA;line-height:1.1}
.sg-b.fly{background:linear-gradient(180deg,#1E8BEA,#1565C8)}
.sg-b.turn{background:repeating-linear-gradient(135deg,#1B2735 0 6px,#26354A 6px 12px);border-color:rgba(165,185,205,.45)}
.sg-b.turn b{color:#E3ECF5}.sg-b.turn small{color:#B9C8D8}
.sg-b.sm small{display:none}
.sg-b.xs b,.sg-b.xs small{display:none}
.sg-b.rdy{padding:0 10px;border-color:rgba(86,230,166,.55);background:rgba(86,230,166,.10)}
.sg-b.rdy b{color:var(--green)}.sg-b.rdy small{color:#CFF6E4}
.sg-b.rdy.late{border-color:rgba(242,99,106,.7);background:rgba(242,99,106,.12)}.sg-b.rdy.late b{color:var(--red)}
.sgantt.full .sg-tr{height:50px}
/* fares and the current plan summary */
.fares{display:flex;flex-wrap:wrap;gap:8px}
.fare{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:84px;padding:9px 12px;background:rgba(13,47,92,.5);border:1px solid var(--line);color:#fff;cursor:pointer}
.fare b{font-size:22px;font-weight:600;color:#fff}.fare span{font-size:13px;color:var(--muted)}
.fare.on{border-width:2px}.fare.on span{color:#DCEFFF}
.sumi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sumi > div{display:flex;flex-direction:column;gap:2px}
.sumi svg{width:26px;height:26px;fill:var(--cy);margin-bottom:2px}
.sumi b{font-size:22px;font-weight:600;color:#fff}.sumi small{font-size:12.5px;color:var(--muted);line-height:1.25}
.sumi .nos svg{fill:var(--orange)}.sumi .nos b{color:var(--orange)}
/* passengers per service: occupied cyan, empty outline, no seat orange */
.pkey{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.pkey span{display:flex;align-items:center;gap:6px}
.pkey i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pkey i.p{background:#63D8FF}.pkey i.e{border:1.5px solid rgba(99,216,255,.7)}.pkey i.n{background:var(--orange)}
.pgroups{display:flex;flex-wrap:wrap;gap:10px}
.pg{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);background:rgba(4,16,31,.35);border-radius:2px;box-shadow:none}
.pg-dots i.p{background:#63D8FF;box-shadow:0 0 5px rgba(99,216,255,.4)}
.pg-dots i.e{background:transparent;border:1.5px solid rgba(99,216,255,.6)}
.pg.flown{border-color:rgba(99,216,255,.45);background:rgba(16,58,110,.32);box-shadow:none}
.pg.flown .pg-dots i.p{background:#63D8FF}
.pg.nos{border:1.5px dashed rgba(245,154,74,.8);background:rgba(245,154,74,.06)}
.pg.nos .pg-dots i.p{background:var(--orange);box-shadow:none}
.pg.nos .pg-foot span{color:var(--orange)}
.pg-foot{display:flex;align-items:baseline;gap:6px}
.pg-foot b{font-size:19px;font-weight:600;color:#fff}
.pg-foot .pg-of{font-size:13.5px;color:var(--muted)}
.pg-foot > span:last-child{margin-left:auto;padding-left:10px;font-size:13.5px;color:var(--muted)}
.build .pgroups .pg,.tt .pgroups .pg{flex:1;min-width:200px}
/* services */
.svcs{display:flex;flex-wrap:wrap;gap:8px}
.svc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 14px;background:rgba(13,47,92,.5);border:1px solid var(--line);color:#fff;cursor:pointer}
.svc b{font-size:18px;font-weight:600}.svc span{font-size:13.5px;color:#DCEBFA}.svc small{font-size:12.5px;color:var(--muted)}
.svc:disabled{opacity:.42;cursor:default}
/* ---------- one service: route strip, stage indicator, timeline ---------- */
.rstrip{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(4,16,31,.5);border:1px solid var(--line)}
.rs-t{font-size:21px;font-weight:600;color:#fff}

.rot-stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rot-stages li{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--hair);color:var(--faint);font-size:16px;font-weight:600;background:rgba(4,16,31,.3)}

.rot-stages li.done{color:var(--green);border-color:rgba(86,230,166,.35)}
.rot-stages li.on{color:#fff;border-color:var(--cy);background:rgba(99,216,255,.10)}.rot-stages li.on i{color:var(--cy);background:rgba(99,216,255,.2)}
.rb.out,.rb.back{background:linear-gradient(180deg,#1E8BEA,#1565C8)!important;border-color:rgba(150,215,255,.55)!important}
.rb.turn,.rb.home{background:repeating-linear-gradient(135deg,#1B2735 0 6px,#26354A 6px 12px)!important;border-color:rgba(165,185,205,.45)!important}

.ready-big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 22px;border:1px solid rgba(86,230,166,.5);background:linear-gradient(145deg,rgba(86,230,166,.12),rgba(4,16,31,.4) 60%)}

.ready-big p{margin:0;font-size:19px}.ready-big p.muted{font-size:16px}
/* ---------- launch: the operating plan ---------- */
.opplan{border:1px solid var(--line);background:rgba(4,16,31,.4)}
.op-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.op-head .label{font-size:14px}.op-head b{font-size:18px;font-weight:600;color:#fff}
.op-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--hair);font-size:18px}
.op-row:last-child{border-bottom:0}
.op-l{color:var(--muted);font-size:16px}.op-v{color:#fff;min-width:0}
.op-s{font-size:15px;text-align:right}.op-row.ok .op-s{color:var(--green);font-size:20px}.op-row.warn .op-s{color:var(--orange)}
.op-row.warn{box-shadow:inset 3px 0 0 var(--orange)}
.launch{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px}
.btn.huge.go{font-size:24px;letter-spacing:.14em;padding:16px 54px;min-width:440px;min-height:66px}
.launch p{margin:0;font-size:16px}
/* ---------- fuel ---------- */
.ff-bill{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:18px}

.ff-order{border-color:rgba(99,216,255,.4);background:rgba(16,58,110,.25)}
.ff-prices .now{color:#fff}
/* ---------- the airport screen and locator map ---------- */
.home2{max-width:1500px;margin:0 auto;width:100%}
.home-g{display:grid;grid-template-columns:minmax(0,62fr) minmax(0,38fr);gap:20px;align-items:start}
.home-l{display:flex;flex-direction:column;gap:12px;min-width:0}
.home-l .airports{grid-template-columns:repeat(2,minmax(0,1fr))}
.apt-code{font-size:28px;font-weight:700;letter-spacing:.06em;color:var(--cy)}
.apt.on,.term.on{box-shadow:0 0 0 1px rgba(99,216,255,.35), inset 0 1px 0 rgba(255,255,255,.08), 0 0 16px rgba(99,216,255,.14)}
.locmap{display:flex;flex-direction:column;gap:6px;min-width:0}
.loc-box{position:relative;width:100%;aspect-ratio:.86;max-height:calc(100vh - 230px);margin:0 auto;background:#05162C;border:1px solid var(--line);overflow:hidden}
.loc-svg{position:absolute;inset:0;width:100%;height:100%}
.loc-svg .land{fill:#17406F}
.loc-svg .borders{stroke:rgba(150,200,255,.3);fill:none;vector-effect:non-scaling-stroke}
.loc-lines line{stroke:#63D8FF;stroke-width:2;stroke-dasharray:7 5;vector-effect:non-scaling-stroke}
.loc-apt{position:absolute;transform:translate(-50%,-50%);width:0;height:0}
.loc-apt i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#7F9BBE;border:2px solid #05162C}
.loc-apt.on i{left:-9px;top:-9px;width:18px;height:18px;background:#fff;box-shadow:0 0 0 4px rgba(99,216,255,.35),0 0 18px #63D8FF}
.loc-apt.dest i{background:#63D8FF}
.loc-apt b{position:absolute;font-size:12.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;color:#A9C2DD;text-shadow:0 0 4px #05162C,0 0 4px #05162C}
.loc-apt.on b{color:#fff;font-size:15px}
.loc-apt.dest b{color:#DFF6FF}
.loc-apt.at-w b{right:12px;top:-9px}.loc-apt.at-e b{left:12px;top:-9px}.loc-apt.at-n b{left:-14px;bottom:10px}.loc-apt.at-s b{left:-14px;top:10px}
.loc-apt.on.at-w b{right:16px}
.loc-tag{position:absolute;transform:translate(-50%,-50%);background:rgba(5,22,44,.9);border:1px solid var(--line);padding:2px 7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.loc-tag b{color:#fff}
.loc-cap{margin:0;font-size:13px;color:var(--muted)}
/* ---------- the strategy meters ---------- */
.st-meters{display:grid;grid-template-columns:1fr;gap:6px}
.st-meters > span{display:flex;flex-direction:column;gap:1px}
.st-meters small{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0}
.st-meters small em{font-style:normal;color:#fff;font-weight:600}
/* ---------- entering the HQ ---------- */
.hqboot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(900px 520px at 50% 38%, rgba(30,110,210,.24), transparent 70%), #061426}
.hb-in{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hb-name{font-size:46px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.hb-at{font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cy)}
.hb-init{margin:12px 0 2px;font-size:15px;color:var(--muted)}
.hb-l{list-style:none;margin:0 0 14px;padding:12px 18px;min-width:340px;display:flex;flex-direction:column;gap:9px;text-align:left;border:1px solid var(--hair);background:rgba(8,30,61,.6)}
.hb-l li{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.22;animation:hbOn .3s ease-out var(--d) forwards}
.hb-l li i{flex:none;width:9px;height:9px;border-radius:50%;background:#2B4566;animation:hbDot .3s ease-out var(--d) forwards}
.hb-l li:first-child i,.hb-l li.sys i{--lit:#56E6A6}
.hb-l li.sys{margin-top:6px;padding-top:9px;border-top:1px solid var(--hair);color:#fff}
@keyframes hbOn{to{opacity:1;color:#E9F2FC}}
@keyframes hbDot{to{background:var(--lit,#63D8FF);box-shadow:0 0 8px var(--lit,#63D8FF)}}
body.hq-enter #screen{animation:hqIn .6s ease-out}
@keyframes hqIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){ .hb-l li,.hb-l li i{animation:none;opacity:1} body.hq-enter #screen{animation:none} .nv.lit{animation:none} td.c.flash,b.flash{animation:none} }
/* a module coming online */
.sysnote{position:fixed;top:72px;left:50%;z-index:60;transform:translate(-50%,-6px);opacity:0;pointer-events:none;padding:8px 20px;background:rgba(6,20,38,.96);border:1px solid rgba(86,230,166,.65);color:var(--green);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:opacity .25s, transform .25s}
.sysnote.show{opacity:1;transform:translate(-50%,0)}
/* ---------- the Overview ---------- */
.hp{background:linear-gradient(145deg,rgba(21,68,119,.32),rgba(10,33,66,.0) 55%), #0A2142}
.kpi2{gap:14px;padding:12px 16px}

/* the wall's departure boards: a modern monospace (never Courier) */

/* fixes after the first screenshots */

.pnl{padding:10px 14px}.pnl-h{margin-bottom:8px}
.ws-main .tf-story p{font-size:calc(17px * var(--tz))}
.sg-tr{height:48px}.sgantt.full .sg-tr{height:44px}

.build .fares{flex-wrap:nowrap}.build .fare{flex:1 1 0;min-width:0;padding:8px 4px}
.build .fare b{font-size:20px}
.sumi b{font-size:20px;white-space:nowrap}.sumi small{font-size:12px}
.kvs dt{flex:1 1 auto;min-width:0}

.oc-same,.opts-wrap .oc-same{color:var(--muted)!important}
.calc .btn,.dock .btn{letter-spacing:.02em;text-transform:none}
.dk-t{font-size:16px}
.ws-options .stg-t b{font-size:14px}

/* second round of fixes */
.seg.out,.seg.back{background:linear-gradient(180deg,#1E8BEA,#1565C8)!important;box-shadow:none}
.seg.turn,.seg.home{background:repeating-linear-gradient(135deg,#1B2735 0 5px,#2C3D54 5px 10px)!important}
.rb.turn,.rb.home{color:#E3ECF5!important}
.rb span{font-style:normal;font-weight:600;font-size:17px}.rb span small{font-weight:400;color:#CFE0F2}
.ready-big p b{font-size:inherit;font-weight:700;line-height:inherit}
.dk-tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dock:not(.dock-context) .dk-kind{align-self:flex-start}
.sumi{grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr))}
.sumi b{white-space:nowrap}
.pg-foot > span:last-child{white-space:nowrap}
.home2 .actions{display:none}
.locmap .btn.primary{margin-top:8px;width:100%}
.home-l .lede.sm{font-size:16px}
.home-l .apt{padding:10px 12px;gap:3px}
.home-l .apt-code{font-size:24px}

.home-r{display:flex;flex-direction:column;gap:10px;min-width:0}.home-r > .btn{width:100%}

/* third round: dense spreadsheet, planner fares on one row, overview table, home height */
.ws-options .ws-main > .tf{zoom:.76}
@media (min-width:1600px) and (min-height:880px){ .ws-options .ws-main > .tf{zoom:.86} }
.opts-wrap table.fx td.c,.opts-wrap table.fx th[scope=row]{height:27px;padding-top:0;padding-bottom:0}

.planner .pr-head{flex-wrap:wrap}
.kvs dd{white-space:nowrap}
.ov table.ev th{font-size:10.5px;letter-spacing:.02em;padding-left:4px;padding-right:4px}
.ov table.ev td{padding-left:4px;padding-right:4px}
.home2{padding-top:10px;padding-bottom:12px}
.home2 .screen-title{margin-bottom:0}
.home-l{gap:8px}.home-l .airports{gap:8px}
.home-l .apt .muted{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.home-l .terms .term{padding:8px 12px;gap:2px}
.home-l .terms .term .muted{font-size:12.5px}

/* fourth round */
#strip{display:none!important}
.home-r > .btn{letter-spacing:.02em;font-size:17px;white-space:nowrap}
.opts-wrap table.fx td.c,.opts-wrap table.fx th[scope=row]{height:25px}
.opts-wrap .oc{gap:1px}.opts-wrap .oc-b{width:20px;height:20px;font-size:14px}.opts-wrap .oc-r{grid-template-columns:minmax(0,1fr) 20px 46px 20px}

.ov table.ev td{font-size:13.5px}
.kvs > div{padding:6px 0}
.dk-help{padding:6px 10px}.dk-help i{width:24px;height:24px;font-size:13px}
.dk-tools{gap:5px;padding:8px 12px 10px}

.ws-options h1.tq{font-size:calc(27px * var(--tz))}

.dock .help-fares > div{display:flex;flex-direction:column;gap:2px}.dock .help-fares > div > b{font-size:15px;display:flex;align-items:center;gap:6px}.dock .help-fares span,.dock .help-fares span b{font-size:14px;line-height:1.4;display:inline}

/* the fare menu in the costing dock; the planner's fare line */

.milestone{height:100%;align-items:center;justify-content:center}
