<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Airline Simulator · Opening</title>
<style>
/* ============================================================
   SHARED STYLE BLOCK — used by both windows. Change things here, not below.
   Two fonts only: --mono for airport hardware (boards, clocks, tickers, numbers),
   --sans for every piece of interface copy. Spacing scale --s1..--s5.
   ============================================================ */
:root{
  /* Step 1 (HQ & Operations Wall brief): mid-blue, navy structure, cyan highlights, white text.
     Amber only for money and the main action, red only for real alerts, green for good / operating. Square panels. */
  --bg:#0b2549; --navy:#081d3d; --panel:rgba(14,44,88,.78); --panel-solid:#10305f; --tint:rgba(120,190,255,.04); --tint2:rgba(120,190,255,.08);
  --cy:#7fd6ff; --cyrgb:127,214,255; --line:rgba(127,200,255,.42); --hair:rgba(127,200,255,.2);
  --amber:#ffc83d; --amber2:#ffe08a; --white:#f2f8ff; --muted:#bccfe8; --faint:rgba(225,238,255,.68); --grey:#9aaecb;
  --green:#6ef0b4; --ok:#5fe08f; --red:#ff6b6b; --orange:#ffa04d; --blue:#7cc4ff;
  --ocean:#0a2a55; --land:#245a95;
  --mono:"Courier New",ui-monospace,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --c1:#ffc83d; --c2:#6cc4ff;            /* livery colours, set by the pupil */
  --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --notch:0px; --r:2px; --rb:3px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--white);font-family:var(--sans);font-size:18px}
body{display:flex;flex-direction:column;min-height:100vh;position:relative;background:
    radial-gradient(1200px 700px at 75% -10%, rgba(86,197,255,.16), transparent 60%),
    radial-gradient(900px 600px at 0% 100%, rgba(47,127,224,.18), transparent 60%),
    linear-gradient(160deg, #123566, #0d2a52 55%, #0b2549);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1000;background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit}
[hidden]{display:none!important}
/* the one panel style */
.panel{position:relative;color:var(--white);background:linear-gradient(160deg, var(--tint2), rgba(var(--cyrgb),.02) 60%, var(--tint)), var(--panel);border:1px solid var(--line);
  box-shadow:0 0 22px rgba(var(--cyrgb),.14), inset 0 0 30px rgba(var(--cyrgb),.05)}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg, rgba(160,240,255,.035) 0 1px, transparent 1px 3px)}
/* the one heading style: small uppercase bar with a status dot */
.phead{display:flex;align-items:center;gap:var(--s3);padding:7px 14px;background:rgba(0,0,0,.2);border-bottom:1px solid rgba(var(--cyrgb),.35);font-weight:700;color:var(--cy);font-size:12px;letter-spacing:.22em;text-transform:uppercase;flex:none}
.phead::after{content:"● " attr(data-status);color:var(--green);margin-left:auto;text-shadow:0 0 10px rgba(125,255,196,.5);white-space:nowrap}
.label{color:var(--faint);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.hair{border-top:1px solid var(--hair)}
.btn{min-height:52px;min-width:52px;padding:8px 20px;border:1px solid var(--line);background:rgba(var(--cyrgb),.07);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--white);transition:border-color .15s, box-shadow .15s}
.btn:hover{border-color:var(--cy);box-shadow:0 0 14px rgba(var(--cyrgb),.25)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);color:#07121f;border-color:var(--amber);box-shadow:0 0 22px rgba(255,200,61,.3)}
.btn.good{background:var(--green);color:#04231a;border-color:var(--green)}
.btn.danger{background:rgba(255,90,90,.12);color:#ffb3b3;border-color:rgba(255,90,90,.7)}
.btn.dim{background:rgba(0,0,0,.25);color:var(--muted);border-color:var(--hair)}
.btn.small{min-height:42px;font-size:13px;padding:6px 12px;min-width:0}
.btn.big{min-height:64px;font-size:20px;padding:10px 30px;letter-spacing:.14em}
.btn[aria-pressed="true"]{background:rgba(var(--cyrgb),.16);color:var(--cy);border-color:var(--cy);box-shadow:inset 0 0 0 1px rgba(var(--cyrgb),.4)}
.stars{font-size:1.1em;letter-spacing:2px;color:var(--amber);white-space:nowrap;text-shadow:0 0 10px rgba(255,200,61,.35)}
.stars .off,.v .off{color:#24435c;text-shadow:none}
.flag{height:1em;vertical-align:-.12em;border:1px solid rgba(255,255,255,.8)}
.fin{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 6px rgba(255,255,255,.2))}
.plane-svg{width:120px;height:48px;flex:none;filter:drop-shadow(0 0 6px rgba(255,255,255,.15))}
.bar{position:relative;height:10px;background:rgba(var(--cyrgb),.12);margin:var(--s2) 0}
.bar i{display:block;height:100%;background:var(--c1);box-shadow:0 0 10px var(--c1);transition:width .3s}
.bar s{position:absolute;top:-4px;width:2px;height:18px;background:var(--white);opacity:.8}
.status{font-family:var(--mono);font-weight:700;letter-spacing:1px;white-space:nowrap}
.s-ontime,.s-landed{color:var(--ok)} .s-full{color:var(--green)} .s-boarding{color:var(--ok);animation:blink 1s steps(2,start) infinite}
.s-clearance{color:var(--cy);animation:blink 1.2s steps(2,start) infinite;text-shadow:0 0 12px rgba(var(--cyrgb),.6)}
.s-delayed{color:var(--orange)} .s-departed{color:var(--grey)} .s-cancelled{color:var(--red)} .s-scheduled{color:var(--white)} .s-grounded{color:var(--red)} .s-inflight{color:var(--c2)}
@keyframes blink{to{visibility:hidden}}
.mono{font-family:var(--mono)}
.amber{color:var(--amber)} .green{color:var(--green)} .red{color:var(--red)} .orange{color:var(--orange)} .blue{color:var(--blue)} .muted{color:var(--muted)} .grey{color:var(--grey)}
.right{text-align:right}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
h1,h2,h3{color:var(--cy);letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:700}
h1{font-size:30px} h2{font-size:18px} h3{font-size:12px;letter-spacing:.22em;color:var(--faint)}
p{margin:0;line-height:1.45}
.lede{font-size:22px;line-height:1.4}
.small{font-size:15px}
.pill{display:inline-block;padding:2px 10px;border:1px solid var(--hair);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pill.amber{color:var(--amber);border-color:rgba(255,200,61,.6)}
.pill.green{color:var(--green);border-color:rgba(125,255,196,.6)}
.pill.red{color:#ffb3b3;border-color:rgba(255,90,90,.7)}
table.data{border-collapse:collapse;width:100%}
table.data th{color:var(--faint);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair)}
table.data td{padding:10px;border-bottom:1px solid rgba(var(--cyrgb),.1);font-size:19px}
table.data td.num,table.data th.num{text-align:right}
.say{min-height:44px;min-width:44px;border:1px solid var(--hair);background:rgba(0,0,0,.25);font-size:20px;padding:0;color:var(--cy)}
body:not(.tts) .say{display:none}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--amber);color:#07121f;font-weight:700;letter-spacing:.06em;padding:12px 22px;z-index:90;font-size:17px;box-shadow:0 0 24px rgba(255,200,61,.5)}

/* ============================================================
   CONTROL WINDOW (laptop: the pupil's office)
   ============================================================ */
#control{display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}
body.display #control{display:none}
.cbar{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);background:rgba(8,29,61,.75);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;max-width:260px}
#cName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:17px;color:var(--c1);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 14px rgba(255,200,61,.25)}
.stat{display:flex;flex-direction:column;line-height:1.1;padding:0 10px;border-left:1px solid var(--hair)}
.stat b{font-family:var(--mono);font-size:19px;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,200,61,.3)}
#screen{flex:1;display:flex;flex-direction:column;gap:var(--s4);padding:var(--s4);max-width:1240px;width:100%;margin:0 auto}
.card{position:relative;background:linear-gradient(160deg, var(--tint2), rgba(var(--cyrgb),.02) 60%, var(--tint)), var(--panel);border:1px solid var(--line);box-shadow:0 0 22px rgba(var(--cyrgb),.14), inset 0 0 30px rgba(var(--cyrgb),.05);padding:var(--s4) 22px}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(160,240,255,.035) 0 1px, transparent 1px 3px)}
.card.tone-good{border-color:rgba(125,255,196,.7);box-shadow:0 0 26px rgba(125,255,196,.18)}
.card.tone-bad{border-color:rgba(255,154,61,.6);box-shadow:0 0 22px rgba(255,154,61,.12)}
.card.tone-warn{border-color:var(--orange)}
.screen-title{display:flex;align-self:stretch;align-items:center;gap:var(--s3);margin:calc(-1 * var(--s4)) -22px var(--s2);padding:7px 14px;border-bottom:1px solid rgba(var(--cyrgb),.35);background:rgba(0,0,0,.18)}
.screen-title h2{flex:1;font-size:13px;letter-spacing:.22em}
.screen-title::after{content:"● " attr(data-status);font-size:11px;letter-spacing:.2em;color:var(--green);text-transform:uppercase;margin-left:auto;white-space:nowrap;font-weight:700}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--s3)}
.options.fins{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.options.fins .opt{align-items:center}
.opt{position:relative;text-align:left;background:rgba(0,0,0,.26);border:1px solid transparent;padding:14px 16px;min-height:96px;display:flex;flex-direction:column;gap:6px;color:var(--white);transition:border-color .15s, box-shadow .15s}
.opt:hover{border-color:rgba(var(--cyrgb),.5)}
.opt.on,.opt[aria-pressed="true"]{border-color:var(--cy);box-shadow:0 0 16px rgba(var(--cyrgb),.3), inset 0 0 0 1px rgba(var(--cyrgb),.35);background:rgba(var(--cyrgb),.08)}
.opt .big{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--amber);text-shadow:0 0 12px rgba(255,200,61,.25)}
.opt .sub{color:var(--muted);font-size:15px}
.opt.locked{opacity:.45}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--s3)}
.fact{padding:var(--s2) 0;border-top:1px solid var(--hair)}
.fact .label{font-size:10px}
.fact .v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,200,61,.25)}
.fact .v.small{font-size:20px}
.fact .v.white{color:var(--white);text-shadow:none}
.fact .v.red{color:var(--red)}
.rule{border-left:3px solid var(--cy);padding:6px 14px;font-size:17px;color:var(--muted)}
.rule b{color:var(--white)}
.actions{display:flex;gap:var(--s3);justify-content:flex-end;flex-wrap:wrap;margin-top:auto}
.actions.left{justify-content:flex-start}
.plane-svg path{fill:var(--c1);stroke:#07121f;stroke-width:1}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 0 10px;text-align:center}
.biglogo{font-weight:800;font-size:clamp(44px,8vw,86px);letter-spacing:.16em;line-height:1;padding-left:.16em;margin:0;text-transform:uppercase}
.biglogo .a{color:var(--amber);text-shadow:0 0 28px rgba(255,200,61,.35)}
.biglogo .b{color:var(--blue);text-shadow:0 0 28px rgba(108,196,255,.35)}
.boot{font-family:var(--mono);font-size:14px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.boot::after{content:"_";animation:caret 1s steps(2,start) infinite}
@keyframes caret{to{visibility:hidden}}
.tasks{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s2) 0}
.task{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2) var(--s4);text-align:left;background:rgba(0,0,0,.26);border:1px solid transparent;border-left:3px solid rgba(var(--cyrgb),.35);padding:16px 18px;color:var(--white);min-height:78px;animation:rise .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.task:hover:not(:disabled){border-color:rgba(var(--cyrgb),.6);box-shadow:0 0 14px rgba(var(--cyrgb),.2)}
.task .ic{font-size:28px;flex:none;width:40px;text-align:center}
.task .grow{min-width:180px}
.task b{display:block;font-size:20px}
.task .sub{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.task .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.task.done{opacity:.5;border-left-color:var(--green)}
.task.warn{border-left-color:var(--orange)}
.news-mini{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--hair);padding-top:var(--s2);margin-top:var(--s2)}
.fl-list{display:flex;flex-direction:column;gap:var(--s2)}
.fl-row{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--hair);padding-top:var(--s2)}
.fl-row .plane-svg{width:64px;height:26px}
.gauge{display:flex;flex-direction:column;gap:2px}
/* day timeline */
.tl{display:flex;flex-direction:column;gap:4px}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--faint)}
.tl-bar{position:relative;height:28px;background:rgba(var(--cyrgb),.08);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.tl.compact .tl-bar{height:20px}
.tl-seg{position:absolute;top:3px;bottom:3px;background:var(--c1);box-shadow:0 0 8px var(--c1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tl-seg span{font-size:12px;font-weight:700;color:#07121f;white-space:nowrap;letter-spacing:.04em}
.tl.compact .tl-seg span{font-size:10px}
.tl-list{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:16px}
.options.chips{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opt.chip{min-height:0;padding:10px 12px;gap:3px}
.opt.chip .sub{font-size:13px}
/* calculation screen */
.calc{display:grid;grid-template-columns:1fr 340px;gap:var(--s4)}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.calc .question{font-size:25px;line-height:1.4}
.calc .question b{color:var(--amber);font-family:var(--mono)}
.numbers{display:flex;flex-direction:column}
.numbers .n{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--hair);padding:8px 4px;font-size:19px}
.numbers .n b{font-family:var(--mono);color:var(--amber);font-variant-numeric:tabular-nums;font-size:24px}
.answer{display:flex;align-items:center;gap:10px;background:#071b38;border:1px solid var(--line);padding:6px 14px}
.answer.ok{border-color:var(--green);box-shadow:0 0 18px rgba(125,255,196,.35)}
.answer .unit{font-family:var(--mono);font-size:30px;color:var(--amber);font-weight:700}
.answer input{flex:1;background:transparent;border:0;color:var(--amber);font-family:var(--mono);font-size:38px;font-weight:700;min-width:0;outline:0;letter-spacing:1px;text-shadow:0 0 12px rgba(255,200,61,.3)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{min-height:54px;font-size:26px;font-family:var(--mono);border:1px solid rgba(var(--cyrgb),.3);background:rgba(0,0,0,.3);font-weight:700;color:var(--white)}
.pad button:hover{border-color:var(--cy)}
.pad button.check{grid-column:1/-1;background:var(--amber);color:#07121f;border-color:var(--amber);font-family:var(--sans);letter-spacing:.14em;text-transform:uppercase;font-size:18px}
.pad button.back{background:rgba(0,0,0,.15);color:var(--muted)}
.msg{min-height:34px;font-size:19px;color:var(--muted)}
.msg.ok{color:var(--green);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.parts span{padding:3px 10px;border:1px solid rgba(var(--cyrgb),.3);color:var(--faint);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.parts span.on{border-color:var(--amber);color:#07121f;background:var(--amber);font-weight:700}
.parts span.done{border-color:var(--green);color:var(--green)}
/* flight, landing */
.progress{height:10px;background:rgba(var(--cyrgb),.12);overflow:hidden}
.progress i{display:block;height:100%;background:var(--c1);width:0;transition:width .3s linear;box-shadow:0 0 10px var(--c1)}
.flightline{display:flex;align-items:center;gap:var(--s3);font-family:var(--mono);font-size:22px;font-weight:700}
.outcomes{display:flex;flex-direction:column;gap:6px}
.outcome{display:flex;gap:var(--s3);align-items:baseline;border-top:1px solid var(--hair);padding:8px 4px;font-size:20px}
.outcome .status{min-width:9em;font-size:15px}
.result-big{font-family:var(--mono);font-size:46px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,200,61,.35)}
.result-big.neg{color:var(--red);text-shadow:0 0 18px rgba(255,90,90,.35)}
.why{display:flex;flex-direction:column;gap:4px}
.why div{display:flex;gap:10px;align-items:flex-start;font-size:19px;border-left:2px solid rgba(var(--cyrgb),.4);padding:6px 14px}
.why .ic{font-size:22px;flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:52px;height:52px;border:1px solid rgba(255,255,255,.25);cursor:pointer}
.sw.on{outline:2px solid var(--cy);outline-offset:3px;box-shadow:0 0 14px rgba(var(--cyrgb),.5)}
.name-input{font-family:var(--mono);font-size:30px;font-weight:700;background:#071b38;color:var(--amber);border:1px solid var(--line);padding:10px 16px;width:100%;max-width:520px;letter-spacing:.12em;outline:0;text-transform:uppercase}
.name-input:focus{border-color:var(--cy);box-shadow:0 0 16px rgba(var(--cyrgb),.3)}
.preview-plane{width:100%;max-width:420px;height:120px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
.plane-card{position:relative;background:rgba(0,0,0,.26);border:1px solid transparent;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.plane-card.afford{border-color:rgba(125,255,196,.7);box-shadow:0 0 16px rgba(125,255,196,.12)}
.plane-card.owned{border-color:var(--c1)}
.plane-card .nm{font-size:18px;font-weight:700;color:var(--white)}
.plane-card .pr{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--amber2);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,201,77,.35)}
.plane-card .pr.cant{color:var(--faint);text-shadow:none}
.plane-card .specs{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:14px;color:var(--muted)}
.plane-card .specs b{color:var(--white);font-family:var(--mono)}
.tier{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--cy);font-weight:700}
#strip{display:flex;gap:10px;align-items:center;padding:var(--s2) var(--s4);background:rgba(0,0,0,.6);border-top:1px solid var(--line);font-family:var(--mono);font-size:15px;overflow-x:auto;white-space:nowrap}
#strip .fl{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border-left:1px solid var(--hair)}
#strip .fl .st{font-weight:700}
#strip .iwb{margin-left:auto;color:var(--grey);font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
#strip .iwb.on{color:var(--green)}
.overlay{position:fixed;inset:0;background:rgba(4,14,32,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.overlay .box{position:relative;width:min(1100px,100%);max-height:100%;overflow:auto;background:#0d2a52;border:1px solid var(--line);box-shadow:0 0 40px rgba(var(--cyrgb),.12), 0 24px 80px rgba(0,0,0,.6);padding:var(--s4) 22px;display:flex;flex-direction:column;gap:var(--s3)}
#teacher h2{color:var(--cy)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s3)}
.tsec{border-top:1px solid var(--hair);padding:var(--s3) 0;display:flex;flex-direction:column;gap:8px}
.tsec h3{color:var(--cy);font-size:11px}
.tsec .row{gap:8px}
.tsec input[type=number],.tsec select{background:#071b38;color:var(--amber);border:1px solid var(--line);padding:6px 10px;min-height:44px;font-family:var(--mono);font-size:18px;width:130px}
.tsec select{width:auto;color:var(--white)}
textarea.code{width:100%;height:90px;background:#071b38;color:var(--amber);border:1px solid var(--line);font-family:var(--mono);font-size:13px;padding:8px}
.corner{position:fixed;right:0;top:0;width:48px;height:48px;z-index:40;opacity:0}
.reviews{display:flex;flex-direction:column;gap:6px}
.review{display:flex;gap:12px;align-items:center;border-left:3px solid var(--c2);padding:6px 12px}
.review .face{font-size:32px;flex:none}
.review .txt{flex:1;font-size:17px;line-height:1.3}
.review .stars{font-size:15px}

/* ---------- CR2: planning desk, forecast table, demand picture, tank, timeline ---------- */
.options.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stepbar{display:flex;gap:6px;flex-wrap:wrap}
.stepbar button{border:1px solid var(--hair);background:rgba(0,0,0,.2);color:var(--muted);padding:6px 14px;font-weight:700;letter-spacing:.06em;font-size:14px;min-height:40px}
.stepbar button.on{border-color:var(--amber);color:#07121f;background:var(--amber)}
.stepbar button:disabled{opacity:.35}
.task.main{border-left-color:var(--amber);background:rgba(255,200,61,.06);min-height:96px}
.task.main b{font-size:22px}
/* demand picture */
.dviz{display:flex;flex-direction:column;gap:4px;min-width:0}
.dviz-row{display:grid;gap:var(--s4)}
.loads{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.load{display:flex;flex-direction:column;gap:2px;border:1px solid rgba(var(--cyrgb),.45);border-top:0;padding:4px 6px 2px;position:relative}
.load::before{content:"";position:absolute;left:-1px;right:-1px;top:0;height:6px;border-top:1px solid rgba(var(--cyrgb),.45)}
.load .icons{display:flex;flex-wrap:wrap;gap:1px;max-width:220px}
.load i{font-style:normal;font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.load.left{border-color:transparent}.load.left::before{display:none}
.px{width:9px;height:15px;flex:none}
.px.on{fill:var(--c1)} .px.empty{fill:none;stroke:rgba(var(--cyrgb),.35);stroke-width:.8} .px.off{fill:#3a4c5e}
.pxkey .px{vertical-align:-3px}
/* fuel tank */
.tank{display:flex;flex-direction:column;gap:4px}
.tank-bar{position:relative;height:22px;background:rgba(var(--cyrgb),.08);border:1px solid rgba(var(--cyrgb),.35)}
.tank.compact .tank-bar{height:14px}
.tank-bar i{position:absolute;top:0;bottom:0;left:0}
.tank-bar i.keep{background:rgba(255,200,61,.45)}
.tank-bar i.use{background:var(--amber);box-shadow:0 0 10px rgba(255,200,61,.6);background-image:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(7,18,31,.25) 5px 8px)}
.tank-bar i.over{background:var(--red);box-shadow:0 0 10px rgba(255,90,90,.6)}
/* day timeline */
.tl{display:flex;flex-direction:column;gap:4px}
.tl-axis{position:relative;height:16px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-axis span:first-child{transform:none}.tl-axis span:last-child{transform:translateX(-100%)}
.tl-bar{position:relative;height:30px;background:rgba(var(--cyrgb),.06);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.tl.compact .tl-bar{height:16px}.tl.compact .tl-axis{display:none}
.seg{position:absolute;top:3px;bottom:3px;display:inline-block}
.seg.out,.seg.back{background:var(--c1);box-shadow:0 0 6px var(--c1)}
.seg.turn{background:#5d7186}
.seg.home{background:repeating-linear-gradient(90deg,#5d7186 0 3px,transparent 3px 6px)}
.seg.overrun{background:rgba(255,90,90,.5);border:1px solid var(--red)}
.tl-key{display:flex;gap:var(--s4);font-size:13px;color:var(--muted)}
.tl-key .seg{position:static;width:18px;height:10px;margin-right:6px;vertical-align:middle}
/* forecast table */
.ft{display:grid;grid-template-columns:1fr;gap:var(--s4);align-items:start}
.ft.has-side{grid-template-columns:1fr 300px}
@media (max-width:1000px){.ft.has-side{grid-template-columns:1fr}}
.ft-main{min-width:0;overflow-x:auto}
.ft-grid{display:grid;gap:0;border-top:1px solid var(--hair)}
.ft-grid > *{border-bottom:1px solid var(--hair);padding:8px 10px;min-height:46px;display:flex;align-items:center}
.ft-corner{align-items:flex-end}
.ft-h{flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;border-bottom:1px solid rgba(var(--cyrgb),.45)}
.ft-h b{font-family:var(--mono);font-size:22px;color:var(--amber)} .ft-h span{font-size:12px;color:var(--muted)}
.ft-h.picked{background:rgba(255,200,61,.1);box-shadow:inset 0 -3px 0 var(--amber)}
.ft-h.dis b{color:var(--faint)}
.ft-l{flex-direction:column;align-items:flex-start;justify-content:center;font-size:16px;color:var(--white)}
.ft-l small{font-size:13px;color:var(--cy)} .ft-l.given{color:var(--muted)} .ft-l.foot{border-bottom:0}
.c{font-family:var(--mono);font-size:20px;font-weight:700;justify-content:flex-start;font-variant-numeric:tabular-nums}
.c.given{color:var(--white)} .c.derived{color:var(--muted)} .c.derived.neg{color:var(--red)} .c.wait{color:#2c4257}
.c.done{color:var(--amber);text-shadow:0 0 10px rgba(255,200,61,.3)}
.c.enter{background:rgba(0,0,0,.35);border:1px dashed rgba(var(--cyrgb),.55);color:var(--cy);margin:4px 6px;min-height:40px;padding:4px 10px}
.c.enter.on{border:1px solid var(--amber);color:var(--amber);box-shadow:0 0 14px rgba(255,200,61,.35)}
.c.tick{background:none;border:0;color:var(--green);flex-direction:column;align-items:flex-start;text-align:left;padding:4px 0}
.c.tick small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--muted)}
.ft-bar,.ft-pick{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:0}
.seatbar{position:relative;width:100%;height:10px;background:rgba(var(--cyrgb),.12)}
.seatbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c1)}
.seatbar s{position:absolute;top:-4px;width:2px;height:18px;background:var(--green)}
.ft-side{display:flex;flex-direction:column;gap:var(--s3);border-left:1px solid var(--hair);padding-left:var(--s4)}
.side-q{display:flex;flex-direction:column;gap:2px}.side-q b{font-size:20px}
.cards{display:flex;flex-wrap:wrap;gap:6px}
.card-n{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid rgba(var(--cyrgb),.35);background:rgba(0,0,0,.3);padding:6px 10px;color:var(--white);min-height:52px}
.card-n span{font-size:12px;color:var(--muted)} .card-n b{font-family:var(--mono);font-size:18px;color:var(--amber)}
.card-n.on{border-color:var(--amber);box-shadow:0 0 12px rgba(255,200,61,.35)}
.ops{display:flex;gap:6px}.op{width:52px;height:52px;font-size:26px;font-family:var(--mono);border:1px solid rgba(var(--cyrgb),.35);background:rgba(0,0,0,.3);color:var(--white)}
.op.on{border-color:var(--amber);color:var(--amber)}
.sumline{font-family:var(--mono);font-size:18px;color:var(--cy)}
.yn{display:flex;gap:var(--s3)}
.vs{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--blue);padding:6px 14px;font-size:19px}
.vs .label{display:inline-block;min-width:70px}
.actions.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,rgba(8,29,61,.95) 30%);padding-top:var(--s3)}
/* IWB working space */
#work{position:fixed;inset:0;z-index:40;background:#0a2246;display:flex;flex-direction:column}
.w-top{display:flex;align-items:center;gap:var(--s3);padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(8,29,61,.95);flex-wrap:wrap}
.w-pins{flex:1;display:flex;gap:var(--s4);align-items:baseline;flex-wrap:wrap;font-family:var(--mono)}
.w-pins b{color:var(--cy);font-family:var(--sans);letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.w-pins span{display:flex;flex-direction:column;font-size:clamp(18px,1.8vw,30px);color:var(--amber);font-weight:700}
.w-pins small{font-family:var(--sans);font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.w-tools{display:flex;gap:6px;flex-wrap:wrap}.w-tools .btn{min-height:44px;font-size:14px;padding:6px 12px}
#wCanvas{flex:1;width:100%;touch-action:none;cursor:crosshair;background-image:linear-gradient(rgba(var(--cyrgb),.06) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--cyrgb),.06) 1px,transparent 1px);background-size:40px 40px}
.mplane.parked{opacity:.75}

/* ============================================================
   CR4: READING AND LAYOUT, in the agent style. System sans for words, Courier New for
   numbers (plain zeros), 22px running text and 32px numbers at the standard size,
   mixed case on questions, stories and tables; the uppercase panel chrome stays.
   No scanlines over text. --tz is the teacher's text size (saved with the run).
   ============================================================ */
:root{--tz:1;--num:var(--mono);
  --fs:calc(22px * var(--tz));--fn:calc(32px * var(--tz));--fq:calc(40px * var(--tz));--dim:#a3b4c4;--op:#8feaff;--open:#ffc83d}
html,body{font-size:var(--fs)}
body::after,.card::before,.panel::before{display:none}
h1,.lede,.msg.ok,.load i,.bempty{letter-spacing:0!important;text-transform:none!important}
h1{font-size:var(--fq)} h2{font-size:calc(18px * var(--tz))} h3{font-size:calc(16px * var(--tz))}
.label{font-size:calc(15px * var(--tz))}
.small,.opt .sub,.task .sub,.tl-key,.tl-list,.plane-card .specs,.review .txt,.rule,.why div,.vs,.outcome,.numbers .n,.msg,.lede,.tsec,table.data td{font-size:var(--fs)}
.btn{min-height:58px;padding:8px 22px;font-size:calc(18px * var(--tz))}
.btn.small{min-height:46px;padding:6px 14px;font-size:calc(15px * var(--tz))}
.btn.big{min-height:70px;font-size:calc(21px * var(--tz));padding:10px 34px}
.btn.huge{min-height:92px;font-size:calc(27px * var(--tz));padding:14px 56px;background:var(--amber);color:#07121f;border-color:var(--amber);box-shadow:0 0 26px rgba(255,200,61,.35);letter-spacing:.16em}
.num,.fact .v,.result-big,.c,.answer input,.answer .unit,.stat b,.opt .big,.plane-card .pr{font-family:var(--num)}
.fact .v,.stat b{font-size:var(--fn)}
.screen-title h2{font-size:calc(16px * var(--tz))}
.screen-title::after{font-size:calc(14px * var(--tz))}
.screen-title{padding:10px 18px}
#cName{font-size:calc(20px * var(--tz))}
.stat .label{font-size:calc(13px * var(--tz))}
.stat b{font-size:calc(24px * var(--tz))}
#screen{max-width:none;width:96%;padding:16px 0;margin:0 auto}
#strip{font-size:calc(18px * var(--tz))}
.muted{color:var(--muted)}
/* focus mode: a task screen shows only the task */
body.focus .cbar,body.focus #strip,body.focus .corner-btns{display:none!important}
body.focus #screen{height:100vh;width:96%;padding:14px 0;overflow:hidden}
/* the task frame */
.tf{display:flex;flex-direction:column;gap:12px;height:100%;min-height:0;position:relative;padding:0 24px 18px;
  background:linear-gradient(160deg, var(--tint2), rgba(var(--cyrgb),.02) 60%, var(--tint)), var(--panel);border:1px solid var(--line);
  box-shadow:0 0 22px rgba(var(--cyrgb),.14), inset 0 0 30px rgba(var(--cyrgb),.05)}
.tf-bar{margin:0 -24px;font-size:calc(15px * var(--tz));padding:9px 24px}
.phead{font-size:calc(15px * var(--tz))}
.tf-top{display:flex;align-items:center;gap:16px;flex:none}
.tf-top h1.tq{flex:1;min-width:0}
.tf-top .btn{min-height:52px}
.step-mark{font-size:calc(15px * var(--tz));font-weight:700;color:var(--amber);border:1px solid rgba(255,200,61,.6);padding:6px 12px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
h1.tq{font-size:var(--fq);line-height:1.15;color:var(--white);flex:none;font-weight:700}
.tf-story{display:flex;flex-wrap:wrap;gap:4px 28px;flex:none;border-left:3px solid var(--cy);padding:2px 0 2px 16px}
.tf-story p{font-size:calc(24px * var(--tz));line-height:1.35;color:var(--white)}
.tf-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:28px}
.tf-body.with-side{grid-template-columns:minmax(0,1fr) minmax(380px,30%)}
.tf-main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.tf-side{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--hair);padding-left:24px}
.tf-foot{display:flex;gap:16px;flex:none;justify-content:flex-end}
/* choice cards */
.choices{display:grid;gap:20px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:rgba(0,0,0,.3);border:1px solid var(--line);border-left:3px solid var(--cy);padding:22px 24px;color:var(--white);min-height:120px;transition:border-color .15s, box-shadow .15s}
.choice b{font-size:calc(30px * var(--tz));color:var(--white)}
.choice > span{font-size:var(--fs);color:var(--muted)}
.choice:hover{border-color:var(--cy);box-shadow:0 0 18px rgba(var(--cyrgb),.25), inset 0 0 20px rgba(var(--cyrgb),.06)}
.choice.on{border-color:var(--amber);box-shadow:0 0 18px rgba(255,200,61,.3), inset 0 0 0 1px var(--amber)}
.choice.carry{border-left-color:var(--green)}
.choice.small{min-height:0;padding:12px 16px}.choice.small b{font-size:var(--fs)}
.choice.locked{opacity:.5}
.choice .tank{width:100%}
.result-line{font-size:calc(26px * var(--tz));font-weight:700;color:var(--green)}
/* the forecast table */
.ft2{min-width:0}
table.fx{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
table.fx th,table.fx td{padding:6px 14px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:middle;height:calc(50px * var(--tz))}
table.fx thead th{font-size:var(--fs);border-bottom:2px solid var(--line);height:auto;padding-bottom:8px}
table.fx thead th b{display:block;font-family:var(--mono);font-size:var(--fn);color:var(--amber);font-weight:700;text-shadow:0 0 12px rgba(255,200,61,.3)}
table.fx thead th small{display:block;font-size:calc(18px * var(--tz));color:var(--muted)}
table.fx thead th .flag{height:24px}
table.fx thead th:first-child{width:38%}
table.fx thead th.picked{box-shadow:inset 0 -4px 0 var(--amber)}
table.fx tbody th{font-size:var(--fs);font-weight:400;color:var(--white)}
table.fx tbody th .link{font-size:calc(18px * var(--tz));margin-left:8px}
table.fx tbody th.dim,table.fx thead th.dim{color:var(--dim)}
table.fx thead th.dim b{color:#c9a54a}
table.fx td.c{font-size:var(--fn);font-weight:700;font-variant-numeric:tabular-nums;color:var(--white);position:relative}
table.fx td.c.derived{color:var(--white)} table.fx td.c.done{color:var(--amber);text-shadow:0 0 12px rgba(255,200,61,.35)} table.fx td.c.wait{color:var(--dim)}
table.fx td.c.dim{color:var(--dim)}
table.fx td.c.opd{outline:3px solid var(--op);outline-offset:-5px;color:var(--op)}
table.fx td.c.on{outline:3px solid var(--open);outline-offset:-5px}
table.fx td.c.pickable{cursor:pointer}
table.fx td.c.pickable:hover{outline:2px dashed var(--op);outline-offset:-5px}
table.fx td.enter button{font:inherit;font-size:var(--fn);min-width:3.2em;min-height:calc(42px * var(--tz));padding:0 12px;background:rgba(0,0,0,.4);border:2px dashed rgba(var(--cyrgb),.6);color:var(--cy);text-align:left}
table.fx td.enter.on button{border:0;background:transparent;color:var(--amber)}
table.fx td.tick button{font:inherit;background:none;border:0;color:var(--green);padding:0}
table.fx td.c .link{display:block;font-size:calc(18px * var(--tz));font-weight:400}
table.fx tfoot td{border-bottom:0;padding-top:12px;height:auto}
table.fx tfoot .btn{width:100%}
.link{background:none;border:0;padding:0;color:var(--cy);text-decoration:underline;font-size:var(--fs)}
.explain{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-top:12px;padding:12px 16px;border:1px solid var(--line);background:rgba(0,0,0,.35);font-size:var(--fs)}
.explain i{font-style:normal;color:var(--cy)}
/* the side panel: the sum in words, the answer, the pad */
.side2{display:flex;flex-direction:column;gap:12px;height:100%}
.say-it{font-size:calc(26px * var(--tz));line-height:1.45;color:var(--white)}
.say-it .s-op{color:var(--op);font-weight:700;border:2px solid var(--op);padding:0 6px;white-space:nowrap}
.say-it .s-ans,.big-sum .s-ans{color:var(--amber);font-weight:700;border:2px solid var(--amber);padding:0 8px;min-width:2em;display:inline-block;text-align:center}
.say-it .s-q{color:var(--dim);border:2px dashed var(--dim);padding:0 8px}
.say-it .s-done{color:var(--amber);font-weight:700}
.side2 .answer{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;padding:0;border:0}   /* typing still works; the answer shows in the sum and the cell */
.side2.picks .btn{width:100%}
.side2 .answer input{font-size:var(--fn)}
.side2 .pad{gap:8px}
.side2 .pad button{min-height:calc(54px * var(--tz));font-size:calc(30px * var(--tz));font-family:var(--num)}
.side2 .pad button.check{font-size:calc(26px * var(--tz))}
.side2 .msg{font-size:var(--fs);min-height:1.4em}
.side2 .ops{flex-wrap:wrap}.side2 .op{width:auto;min-width:64px;height:64px;padding:0 12px;font-size:calc(30px * var(--tz))}
.sumline{font-size:var(--fn);color:var(--white);font-family:var(--num)}
.big-sum{font-size:calc(44px * var(--tz));font-weight:700;color:var(--white)}
.reward{font-size:calc(26px * var(--tz))}.reward b{color:var(--amber)}
/* bigger pieces elsewhere */
.tank-bar{height:28px}
.tank-bar i.ghost{background:repeating-linear-gradient(-45deg,rgba(255,200,61,.55) 0 6px,rgba(255,200,61,.2) 6px 12px);border:2px dashed var(--amber)}
.tank .row .muted,.tank-note{font-size:var(--fs)}
.key-use{display:inline-block;width:22px;height:14px;background:var(--amber);vertical-align:middle;margin-right:6px}
.load i{font-size:calc(16px * var(--tz))}
.px{width:12px;height:20px}
.load .icons{max-width:300px}
.dviz .small{font-size:var(--fs)}
.tl-axis{font-size:calc(16px * var(--tz));height:22px}
.flightline{font-size:calc(26px * var(--tz))}
.outcome .status{font-size:var(--fs)}
.c.derived.neg{color:var(--red)}
.overlay .box{width:min(1600px,96vw)}

table.fx.one{width:auto;min-width:min(100%,820px)}
table.fx.one thead th:first-child{width:auto;min-width:420px}
table.fx.one td.c{min-width:340px}
table.fx td.enter:not(.on) button{border-color:var(--dim);color:var(--dim)}
.choice{min-height:clamp(120px,20vh,240px);justify-content:center}
.load i{font-size:var(--fs)} .tank .label{font-size:calc(15px * var(--tz))} #strip .iwb{font-size:calc(14px * var(--tz))}
.load i{white-space:nowrap}
.toast{font-family:var(--sans);letter-spacing:0;font-size:var(--fs);padding:14px 26px}
table.fx th,table.fx td{height:clamp(calc(50px * var(--tz)),7vh,84px)}
.side2 .pad button{min-height:clamp(calc(54px * var(--tz)),7.5vh,96px)}

/* landing report: a short presentation */
.pres{gap:10px}
.pres.good{border-color:rgba(125,255,196,.7);box-shadow:0 0 26px rgba(125,255,196,.18), inset 0 0 30px rgba(var(--cyrgb),.05)}
.pres.bad{border-color:rgba(255,154,61,.6)}
.sl-progress{display:flex;gap:6px;flex:none}
.sl-progress i{flex:1;height:5px;background:rgba(var(--cyrgb),.15)}
.sl-progress i.done{background:rgba(var(--cyrgb),.6)}
.sl-progress i.on{background:var(--amber);box-shadow:0 0 10px rgba(255,200,61,.6)}
.sl-stage{flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden}
.slide{flex:1;display:flex;flex-direction:column;gap:22px;padding:18px 8px;animation:slideIn .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
.sl-h{font-size:calc(34px * var(--tz));color:var(--cy);letter-spacing:.08em;text-align:center}
.sl-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;width:100%}
.sl-mid > *{width:min(1400px,100%)}
.sl-mid .sl-center{flex:none}
.sl-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.sl-kicker{color:var(--cy);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:calc(17px * var(--tz))}
.sl-title{font-size:calc(64px * var(--tz));line-height:1.05;color:var(--white);text-shadow:0 0 24px rgba(var(--cyrgb),.25)}
.sl-title.good{color:var(--green);text-shadow:0 0 26px rgba(125,255,196,.35)} .sl-title.bad{color:var(--orange)}
.sl-figs{display:flex;gap:80px;justify-content:center;flex-wrap:wrap}
.sl-figs > div{display:flex;flex-direction:column;gap:6px;align-items:center}
.sl-big{font-family:var(--mono);font-size:calc(72px * var(--tz));color:var(--amber);text-shadow:0 0 22px rgba(255,200,61,.4);font-variant-numeric:tabular-nums}
.sl-big.white{color:var(--white);text-shadow:0 0 18px rgba(var(--cyrgb),.25)} .sl-big.neg{color:var(--red)}
.stagger > *{opacity:0;animation:rise2 .5s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i,0) * 280ms + 150ms)}
@keyframes rise2{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sl-list{display:flex;flex-direction:column;gap:14px}
.sl-flight{display:grid;grid-template-columns:auto auto minmax(120px,auto) minmax(160px,1fr) auto auto auto;align-items:center;gap:22px;padding:16px 22px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-left:3px solid var(--c1);font-size:calc(26px * var(--tz))}
.sl-flight .t{color:var(--muted)} .sl-flight .status{font-size:calc(20px * var(--tz))}
.sl-seats{height:14px;background:rgba(var(--cyrgb),.12);position:relative}
.sl-seats i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c1);box-shadow:0 0 10px var(--c1);transition:width 1s cubic-bezier(.2,.9,.3,1) .4s}
.sl-seats i.go,.sl-bar i.go{width:var(--w)}
.sl-fc{display:flex;flex-direction:column;gap:30px}
.sl-bar{display:grid;grid-template-columns:260px 1fr 200px;align-items:center;gap:24px}
.sl-bar .label{font-size:calc(18px * var(--tz))}
.sl-bar i{height:34px;width:0;transition:width 1.1s cubic-bezier(.2,.9,.3,1) .2s}
.sl-bar i.exp{background:repeating-linear-gradient(-45deg,rgba(var(--cyrgb),.55) 0 8px,rgba(var(--cyrgb),.25) 8px 16px);border:1px solid var(--cy)}
.sl-bar i.got{background:var(--amber);box-shadow:0 0 14px rgba(255,200,61,.5)}
.sl-bar b{font-size:var(--fn);text-align:right}
.sl-verdict{font-size:calc(28px * var(--tz));opacity:0;animation:rise2 .5s 1.2s forwards}
.sl-verdict.good{color:var(--green)}
.sl-callout{font-size:calc(26px * var(--tz));border-left:3px solid var(--amber);padding:10px 18px;background:rgba(255,200,61,.07);opacity:0;animation:rise2 .5s 1.6s forwards}
.sl-why{display:flex;align-items:center;gap:28px;max-width:1200px;text-align:left;padding:30px 40px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-left:4px solid var(--cy);box-shadow:0 0 22px rgba(var(--cyrgb),.12);animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.sl-why .ic{font-size:64px}
.sl-why p{font-size:calc(34px * var(--tz));line-height:1.35}
.sl-dots{display:flex;gap:10px}.sl-dots i{width:12px;height:12px;border:1px solid var(--cy)}.sl-dots i.past{background:rgba(var(--cyrgb),.5)}.sl-dots i.on{background:var(--amber);border-color:var(--amber)}
.sl-stars{display:flex;gap:14px;font-size:calc(80px * var(--tz));line-height:1}
.sl-stars span{color:#24435c;animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--i) * 120ms)}
.sl-stars span.on{color:var(--amber);text-shadow:0 0 22px rgba(255,200,61,.5)}
.sl-stars span.half{background:linear-gradient(90deg,var(--amber) 50%,#24435c 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sl-stars span.new{animation-name:starIn;animation-duration:.8s}
@keyframes starIn{0%{opacity:0;transform:scale(2.2) rotate(-30deg)}70%{transform:scale(.9)}100%{opacity:1;transform:none}}
.sl-repline{font-size:calc(26px * var(--tz))}
.sl-reviews{display:flex;flex-direction:column;gap:10px;width:min(1100px,100%);text-align:left}
.sl-reviews .review .txt{font-size:var(--fs)}
@media (prefers-reduced-motion: reduce){ .slide,.stagger > *,.sl-why,.sl-stars span,.sl-verdict,.sl-callout{animation:none!important;opacity:1!important} .sl-seats i,.sl-bar i{transition:none} }
@media (max-height:820px){ .say-it{font-size:22px} .side2 .pad button{min-height:48px} .side2{gap:8px} }
/* test mode bar */
.testbar{position:fixed;left:12px;bottom:12px;z-index:60;display:flex;gap:8px;align-items:center;padding:8px 10px;background:rgba(40,8,8,.92);border:1px solid #ff7a7a;box-shadow:0 0 18px rgba(255,90,90,.35)}
.testbar b{color:#ff9a9a;letter-spacing:.2em;font-size:13px;padding:0 4px}
.testbar .btn.small{min-height:38px;font-size:12px}
.w-pins span{font-size:clamp(22px,2.2vw,40px)}
.w-pins b{font-size:clamp(16px,1.3vw,24px)}
.w-pins small{font-size:clamp(13px,1vw,18px)}

/* ============================================================
   STEP 1 (HQ / Operations Wall brief): square panels, the top bar, the HQ dashboard,
   the shared map and the Operations Wall (a fixed 1920 × 1080 stage, scaled to fit).
   ============================================================ */
.panel,.card,.tf,.choice,.opt,.plane-card,.overlay .box,.hp,.answer,.explain{border-radius:var(--r)}
.btn,.pill,.op,.pad button,.card-n,.chip,.say,.step-mark,.stepbar button{border-radius:var(--rb)}
.card,.tf{background:linear-gradient(180deg, rgba(255,255,255,.035), transparent 120px), var(--panel);box-shadow:0 10px 30px rgba(3,14,35,.3), inset 0 1px 0 rgba(255,255,255,.05)}
.choice,.opt,.plane-card,.sl-flight,.sl-why{background:rgba(6,24,52,.45)}
.phead[data-status=""]::after{display:none}
.amber{color:var(--amber)}
/* ---------- top bar ---------- */
.cbar{gap:10px;padding:8px 14px;background:rgba(8,29,61,.94);border-bottom:1px solid var(--line);flex-wrap:nowrap;min-height:64px}
.brand{max-width:230px}
.cdate{display:flex;flex-direction:column;line-height:1.15;padding:0 12px;border-left:1px solid var(--hair);white-space:nowrap}
.cdate b{font-size:calc(19px * var(--tz));color:var(--white)}
.cdate span{display:flex;gap:8px;align-items:center;margin-top:3px}
.cdate i{font-style:normal;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cy);font-weight:700}
.cdate i.chip{border:1px solid var(--hair);padding:1px 6px;color:var(--faint);letter-spacing:.12em}
.cops{font-size:13px;font-weight:700;letter-spacing:.12em;padding:7px 10px;border:1px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px;border-radius:var(--rb)}
.cops.ready,.cops.done,.cops.run{color:var(--green);border-color:rgba(110,240,180,.45);background:rgba(110,240,180,.06)}
.cops.hold,.cops.idle{color:var(--amber);border-color:rgba(255,200,61,.45);background:rgba(255,200,61,.06)}
.cops.alert{color:#fff;border-color:var(--red);background:rgba(255,107,107,.2);animation:apulse 1.6s ease-in-out infinite}
@keyframes apulse{50%{box-shadow:0 0 18px rgba(255,107,107,.55)}}
.bell{position:relative;font-size:20px}
.bell sup{position:absolute;top:3px;right:3px;background:#e5484d;color:#fff;font:700 12px/18px var(--sans);min-width:18px;height:18px;border-radius:9px;text-align:center;padding:0 4px}
.cbar .btn.small{min-height:44px;padding:6px 12px}
.cbar > *{flex-shrink:0}.cbar .brand,.cbar .cops{flex-shrink:1;min-width:0}.cbar .btn{white-space:nowrap}
.cbar .lbs{display:none}
@media (max-width:2100px){ .cbar .s-fuel{display:none} }
@media (max-width:1600px){ .cbar .lbl{display:none} .cbar .lbs{display:inline} }
@media (max-width:1450px){ .cbar .s-fleet{display:none} .cdate i.chip{display:none} .cops{max-width:240px;font-size:12px} .brand{max-width:200px} }
/* ---------- the HQ dashboard ---------- */
body.hqmode #strip{display:none}
body.hqmode #control{height:100vh}
body.hqmode #screen{flex:1;min-height:0;width:100%;padding:12px 14px;overflow:hidden}
.hqd{height:100%;min-height:0;display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}
.hqd.wide{grid-template-rows:auto minmax(0,1.2fr) minmax(0,.85fr) minmax(0,1.05fr);grid-template-areas:
  "k1 k1 k2 k2 k3 k3 k4 k4 fu fu fu fu" "mp mp mp mp mp mp mp td td td td td" "mp mp mp mp mp mp mp fl fl fl fl fl" "rt rt rt rt rt fi fi fi fi in in in"}
.hqd.wide .fuelp{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:18px;padding-top:6px;padding-bottom:6px}
.hqd.wide .fu-row{grid-template-columns:1fr 1fr}.hqd.wide .fu-sp{display:none}
.hqd.wide .fuelp .tank{gap:2px}
.hqd.wide .kpi .spark{top:12px;bottom:auto;width:30%}
.more{background:none;border:0;color:var(--cy);font:inherit;font-size:15px;text-align:left;padding:4px 10px;cursor:pointer;text-decoration:underline}
.hqd.compact .chip{font-size:12px;padding:2px 6px}
.hqd.compact{gap:10px;grid-template-rows:auto minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:
  "k1 k1 k1 k2 k2 k2 k3 k3 k3 k4 k4 k4" "mp mp mp mp mp mp mp td td td td td" "rt rt rt rt rt rt rt fl fl fl fl fl"}
.k-cash{grid-area:k1}.k-profit{grid-area:k2}.k-rep{grid-area:k3}.k-fuel{grid-area:k4}.p-today{grid-area:td}.p-map{grid-area:mp}.p-fleet{grid-area:fl}.p-intel{grid-area:in}.p-routes{grid-area:rt}.p-fin{grid-area:fi}.p-fuel{grid-area:fu}
.hp{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 90px), var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(3,14,35,.28), inset 0 1px 0 rgba(255,255,255,.05)}
.hp .phead{font-size:13px;padding:8px 14px}
.hp .phead.tabs{padding:0 8px;gap:2px}
.ptab{background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);font:inherit;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:9px 10px;cursor:pointer;white-space:nowrap}
.ptab:hover{color:var(--white)}
.ptab[aria-pressed="true"]{color:var(--cy);border-bottom-color:var(--cy)}
.ptab sup{background:var(--amber);color:#081d3d;padding:1px 6px;border-radius:8px;font-size:11px;letter-spacing:0;margin-left:2px}
.phead .layers{display:flex;gap:0;margin-left:auto;margin-right:-8px}
.phead .layers .ptab{padding:2px 9px;letter-spacing:.1em}
.pb{flex:1;min-height:0;overflow:auto;padding:10px 14px}
.kpi{padding:12px 16px 12px;gap:2px;justify-content:center}
.kpi .label{font-size:13px}
.kv{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .stars{font-size:30px;letter-spacing:1px}
.ks{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kpi .spark{position:absolute;right:12px;top:12px;width:34%;height:30px}
.spark polyline{fill:none;stroke:var(--cy);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
.spark.pr polyline{stroke:#36c48d}.spark.fu polyline{stroke:var(--amber)}
.tr{font-size:.85em}.tr.up{color:var(--green)}.tr.down{color:var(--red)}.tr.flat{color:var(--grey)}
.p-today{border-color:rgba(255,200,61,.55);box-shadow:0 0 22px rgba(255,200,61,.1), 0 10px 30px rgba(3,14,35,.28)}
.td-body{flex:1;min-height:0;overflow:hidden;padding:12px 16px 4px;display:flex;flex-direction:column;gap:6px}
.td-news{font-size:calc(23px * var(--tz));color:var(--white);text-transform:none;letter-spacing:0;line-height:1.25}
.td-body p{font-size:16px;color:var(--muted);border-left:3px solid var(--cy);padding-left:10px}
.td-act{display:flex;align-items:center;gap:14px;padding:8px 16px 14px;flex-wrap:wrap}
.td-act .muted{font-size:15px}
.btn.act{min-height:64px;font-size:calc(21px * var(--tz));padding:10px 28px;letter-spacing:.12em}
.p-map .hq-map{flex:1;min-height:0}
.map-key{padding:6px 14px;font-size:14px;color:var(--muted);border-top:1px solid var(--hair);flex:none;display:flex;gap:6px;align-items:center}
.k{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin:0 4px 0 6px}
.k.rev{background:#3a95f0}.k.cost{background:#d95926}.k.pl{background:#1fa877;height:4px;width:16px;vertical-align:3px}.k.gain{background:#36c48d}.k.loss{background:var(--red)}
.hq-t{width:100%;border-collapse:collapse}
.hq-t th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.hq-t td{font-size:17px;padding:7px 8px;border-bottom:1px solid rgba(127,200,255,.12);white-space:nowrap}
.hq-t .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hq-t td .num{font-size:16px}
.hq-t .flag{height:16px;margin-right:4px}
.ac{display:flex;align-items:center;gap:10px}.ac .plane-svg{width:58px;height:24px}
.ubar{display:inline-block;width:64px;height:8px;background:rgba(127,200,255,.15);margin-right:8px;vertical-align:middle;position:relative}
.ubar i{position:absolute;left:0;top:0;bottom:0;background:var(--cy)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 8px;border:1px solid;letter-spacing:.04em}
.chip.ok{color:var(--green);border-color:rgba(110,240,180,.5)}.chip.bad{color:#ffb0b0;border-color:var(--red)}.chip.idle{color:var(--muted);border-color:var(--hair)}
.next-ac{margin-top:10px;display:flex;flex-direction:column;gap:2px;font-size:16px;border-top:1px solid var(--hair);padding-top:8px}
.next-ac .label{font-size:12px}
.intel{display:flex;flex-direction:column;gap:6px}
.ii{display:flex;gap:10px;align-items:baseline;font-size:16px;line-height:1.3;padding:6px 10px;border-left:3px solid var(--hair);background:rgba(4,18,43,.35)}
.ii .tag{font-family:var(--mono);font-size:13px;color:var(--cy);min-width:56px;font-weight:700;flex:none}
.ii.warn{border-left-color:var(--amber)}.ii.warn .tag{color:var(--amber)}
.ii.good{border-left-color:var(--green)}.ii.good .tag{color:var(--green)}
.intel.big .ii{font-size:var(--fs)}.intel.big .ii .tag{font-size:16px;min-width:70px}
.fuelp{display:flex;flex-direction:column;gap:10px}
.fuelp .tank-bar{height:22px}.fuelp .tank .muted,.fuelp .tank-note{font-size:15px}
.fu-row{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px}
.fu-row > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.fu-row .label{font-size:12px;letter-spacing:.1em;white-space:nowrap}
.fu-row b{font-family:var(--mono);font-size:26px}
.fu-row .muted{font-size:14px}
.fu-sp .spark{width:100%;height:40px}
.hqd.compact .kv{font-size:28px}.hqd.compact .kv .stars{font-size:24px}
.hqd.compact .ks{font-size:14px}
.hqd.compact .kpi{padding:8px 14px;gap:0}
.hqd.compact .kpi .spark{width:26%;height:24px;top:8px;bottom:auto}
.hqd.compact .td-news{font-size:calc(19px * var(--tz))}
.hqd.compact .td-body p{font-size:15px}
.hqd.compact .td-act .muted{font-size:14px}
.hqd.compact .btn.act{min-height:56px;font-size:calc(19px * var(--tz));padding:8px 20px}
.hqd.compact .hq-t td{font-size:15px;padding:5px 6px}.hqd.compact .hq-t td .num{font-size:15px}
.hqd.compact .hq-t th{font-size:11px;padding:4px 6px}
.hqd.compact .ac .plane-svg{width:44px;height:18px}
.hqd.compact .ubar{display:none}
.hqd.compact .ii{font-size:15px;padding:4px 8px}
.hqd.compact .fu-row b{font-size:22px}
/* ---------- finance chart ---------- */
.fc{position:relative;display:flex;flex-direction:column;height:100%;min-height:0;gap:4px}
.fc-legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex:none}
.fcs{flex:1;min-height:0;width:100%;display:block}
.fcs .grid{stroke:rgba(160,200,255,.14);stroke-width:1}.fcs .grid.zero{stroke:rgba(200,225,255,.5)}
.fcs .ax{fill:var(--muted);font-size:14px;font-family:var(--sans)}
.fcs .b.rev{fill:#3a95f0}.fcs .b.cost{fill:#d95926}
.fcs .pl{fill:none;stroke:#1fa877;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.fcs .pd{fill:#1fa877;stroke:#0d2a52;stroke-width:2}
.fcs .hov{fill:transparent}.fcs .hov:hover{fill:rgba(127,214,255,.08)}
.fc-tip{position:absolute;z-index:5;background:#0d2a55;border:1px solid var(--line);padding:8px 12px;font-size:15px;display:flex;flex-direction:column;gap:3px;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fc-tip b{font-family:var(--mono)}
.fc-empty{font-size:16px;padding:20px 0}
/* ---------- the map (HQ panel and the wall) ---------- */
.mapbox{position:relative;overflow:hidden;background:var(--ocean)}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;display:block}
.ocean{fill:var(--ocean)}
.land{fill:var(--land)}
.borders{fill:none;stroke:#cfe3ff;stroke-opacity:.35;stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mapgrid line{stroke:var(--cy);stroke-opacity:.08;stroke-width:1;vector-effect:non-scaling-stroke}
.routeHalo{stroke:rgba(6,20,45,.65);stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.route{stroke:var(--c1);stroke-width:4;stroke-dasharray:3 10;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 4px var(--c1))}
.route.gain{stroke:#36c48d;stroke-dasharray:none;filter:none}.route.loss{stroke:var(--red);stroke-dasharray:none;filter:none}.route.nodata{stroke:var(--grey);filter:none}
.route.offer{stroke:var(--cy);stroke-opacity:.35;stroke-dasharray:2 8;stroke-width:2;filter:none}
.route.offer.opp{stroke:var(--amber);stroke-opacity:.85;stroke-dasharray:8 8;stroke-width:3}
.route.alert{stroke:var(--red);stroke-dasharray:none;stroke-width:6;filter:drop-shadow(0 0 8px var(--red));animation:aflash 1s steps(2,start) infinite}
@keyframes aflash{50%{stroke:var(--amber)}}
.dim{opacity:.22}
.dem{fill:rgba(127,214,255,.18);stroke:var(--cy);stroke-width:1.5}.dem.mine{fill:rgba(255,200,61,.22);stroke:var(--amber)}
.marker .lbl{fill:#fff;font-weight:700;font-family:var(--sans);paint-order:stroke;stroke:#06142d;stroke-width:4px;stroke-linejoin:round}
.marker .frame{fill:none;stroke:#fff;stroke-width:1.5}
.marker .dot{fill:#fff;stroke:#06142d;stroke-width:2}
.marker .leader{stroke:#fff;stroke-width:2;stroke-opacity:.8}
.marker.offer{opacity:.4}.marker.opp{opacity:.95}.marker.dim{opacity:.22}
.marker.home .lbl{fill:var(--c1)}
.warnmark circle{fill:var(--red);stroke:#fff;stroke-width:2;animation:apulse 1.2s infinite}
.warnmark text{fill:#fff;font-weight:900;font-family:var(--sans)}
.mplane{fill:var(--c1);stroke:#06142d;stroke-width:1.5;filter:drop-shadow(0 0 6px var(--c1))}.mplane.parked{opacity:.75}
.zoomBtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:6}
.zoomBtns .btn{width:44px;height:44px;font-size:22px;padding:0;background:rgba(8,29,61,.88);min-width:0;min-height:0}
.zoomBtns .btn.world{font-size:9px;letter-spacing:.1em}
/* ---------- executive alert (HQ) ---------- */
.card.exec{border-color:var(--red);box-shadow:0 0 0 1px rgba(255,107,107,.35), 0 0 34px rgba(255,107,107,.2)}
.exec-bar{display:flex;align-items:center;gap:18px;margin:calc(-1 * var(--s4)) -22px 4px;padding:10px 22px;background:linear-gradient(90deg, rgba(255,107,107,.32), rgba(255,160,77,.12));border-bottom:1px solid var(--red);text-transform:uppercase;letter-spacing:.16em;font-size:calc(15px * var(--tz));font-weight:700}
.exec-bar b{color:#fff}.exec-bar span{color:var(--amber2)}.exec-bar .say{margin-left:auto}
.exec-h{font-size:var(--fq);color:#fff;text-transform:none;letter-spacing:0}
.card.exec{flex:1;min-height:0;gap:18px}
.card.exec .lede{font-size:calc(28px * var(--tz))}
.card.exec .options{flex:1;grid-auto-rows:minmax(0,1fr);grid-template-columns:repeat(auto-fit,minmax(300px,1fr));max-height:420px}
.card.exec .opt{justify-content:center;padding:22px 26px;border:1px solid var(--line);border-left:4px solid var(--amber)}
.card.exec .opt .big{font-size:calc(30px * var(--tz))!important;font-family:var(--sans)}
.card.exec .opt .sub{font-size:var(--fs)}
.card.exec .opt.on{border-color:var(--amber);box-shadow:0 0 18px rgba(255,200,61,.3), inset 0 0 0 1px var(--amber)}
/* ---------- the Operations Wall ---------- */
#display{display:none}
body.display #display,body.wallview #display{display:block;position:fixed;inset:0;z-index:30;overflow:hidden;background:#051634}
body.wallview #control{display:none}
.wall{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:grid;grid-template-columns:500px minmax(0,1fr);grid-template-rows:84px minmax(0,1fr) 104px 56px;
  grid-template-areas:"hd hd" "bd mp" "bd st" "tk tk";gap:14px;padding:14px;color:var(--white);font-family:var(--sans);
  background:radial-gradient(1100px 700px at 70% 0%, rgba(86,197,255,.14), transparent 60%), linear-gradient(160deg, #10305e, #0b2549 60%, #09203f)}
.w-head{grid-area:hd;display:flex;align-items:center;gap:26px;padding:0 20px;background:rgba(5,20,46,.85);border:1px solid var(--line)}
.w-brand{display:flex;align-items:center;gap:12px;min-width:0;max-width:430px}
.w-brand .fin{width:40px;height:40px}
.w-brand div{display:flex;flex-direction:column;min-width:0}
.w-brand b{font-size:26px;color:var(--c1);letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-brand small{font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--cy);font-weight:700}
.w-period{display:flex;flex-direction:column;padding-left:24px;border-left:1px solid var(--hair);flex:1;min-width:0}
.w-period b{font-size:30px;letter-spacing:.14em;color:#fff}
.w-period span{font-size:22px;color:var(--muted);white-space:nowrap}
.w-clock{text-align:center}.w-clock small{display:block;font-size:13px;letter-spacing:.22em;color:var(--faint);font-weight:700}
.w-clock b{font-family:var(--mono);font-size:44px;color:var(--amber);letter-spacing:2px;text-shadow:0 0 16px rgba(255,200,61,.35)}
.w-live{font-size:20px;font-weight:800;letter-spacing:.14em;padding:10px 16px;border:2px solid;white-space:nowrap;border-radius:var(--rb)}
.w-live.ready,.w-live.done,.w-live.run{color:var(--green);border-color:rgba(110,240,180,.55)}
.w-live.hold,.w-live.idle{color:var(--amber);border-color:rgba(255,200,61,.55)}
.w-live.alert{color:#fff;border-color:var(--red);background:rgba(255,107,107,.25);animation:apulse 1.4s infinite}
.w-btns{display:flex;gap:8px}.w-btns .btn{min-height:46px;font-size:15px;padding:6px 14px}
.w-boards{grid-area:bd;display:grid;grid-template-rows:1fr 1fr;gap:14px;min-height:0}
.w-board{background:#04122b;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;font-family:var(--mono)}
.w-bh{display:flex;align-items:center;gap:12px;padding:10px 16px;font-family:var(--sans);font-weight:800;font-size:28px;letter-spacing:.2em;color:var(--amber);background:rgba(255,200,61,.06);border-bottom:1px solid var(--line)}
.w-bh.arr span{display:inline-block;transform:rotate(25deg)}
.w-bh i{margin-left:auto;font-style:normal;font-size:16px;color:var(--faint);letter-spacing:.1em}
.w-board table{width:100%;border-collapse:collapse;table-layout:fixed}
.w-board th{font-family:var(--sans);font-size:14px;letter-spacing:.18em;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);font-weight:700}
.w-board th.t{width:92px}.w-board th.f{width:96px}.w-board th.s{width:176px}
.w-board td{font-size:23px;font-weight:700;padding:9px 10px;border-bottom:1px solid rgba(127,200,255,.12);color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.w-board td.t,.w-board td.f{color:#fff}
.w-board td .status{font-size:17px}
.w-board tr.gone td{opacity:.55}
.w-board tr.hit td{background:rgba(255,107,107,.16)}.w-board tr.hit td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.bempty{color:var(--faint);padding:20px;font-size:18px;text-align:center;font-family:var(--sans);letter-spacing:.06em}
.w-map{grid-area:mp;border:1px solid var(--line);min-height:0}
.w-status{grid-area:st;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:rgba(5,20,46,.85);border:1px solid var(--line)}
.ws-big,.ws-row{display:flex;flex-direction:column;justify-content:center;padding:8px 16px;border-left:1px solid var(--hair);min-width:0}
.ws-big:first-child,.ws-h + .ws-big{border-left:0}
.ws-h{display:none}
.ws-big span,.ws-row span{font-size:13px;letter-spacing:.12em;color:var(--faint);font-weight:700;white-space:nowrap}
.ws-big b,.ws-row b{font-family:var(--mono);font-size:40px;color:#fff;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-big small{font-size:14px;color:var(--muted)}
.ws-row b{font-size:30px}.ws-row b small{font-size:16px;color:var(--muted)}
.ws-row.amber b{color:var(--amber)}.ws-row.red b{color:var(--red)}
.ws-row i{font-style:normal;font-size:20px;color:var(--grey)}.ws-row i.up{color:var(--red)}.ws-row i.down{color:var(--green)}
.w-ticker{grid-area:tk;display:flex;align-items:stretch;background:var(--amber);color:#081d3d;overflow:hidden}
.w-ticker > b{display:flex;align-items:center;padding:0 22px;font-size:24px;letter-spacing:.14em;background:#081d3d;color:var(--amber);flex:none;border:1px solid var(--amber)}
.w-ticker .tk{flex:1;overflow:hidden;display:flex;align-items:center}
.w-ticker .tk span{display:inline-block;padding-left:100%;white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:27px;animation:tick 45s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.w-alert{grid-area:mp;align-self:end;justify-self:center;z-index:4;width:min(900px,92%);margin-bottom:26px;background:rgba(40,8,14,.92);border:2px solid var(--red);box-shadow:0 0 40px rgba(255,107,107,.4);padding:0 0 18px;text-align:center}
.wa-top{background:var(--red);color:#fff;font-weight:900;font-size:26px;letter-spacing:.24em;padding:10px}
.w-alert h2{font-size:52px;color:#fff;letter-spacing:.04em;margin:16px 20px 4px;text-transform:uppercase}
.w-alert p{font-size:28px;color:var(--amber2);margin:0 0 12px}
.wa-foot{display:flex;flex-direction:column;gap:4px}.wa-foot b{font-size:22px;letter-spacing:.16em;color:#fff}.wa-foot span{font-size:20px;color:var(--muted)}
.mode-alert .w-map{box-shadow:0 0 0 3px var(--red), 0 0 40px rgba(255,107,107,.35)}
.mode-alert .w-board tr:not(.hit) td,.mode-alert .w-status{opacity:.5}
.w-over{grid-row:2 / 4;grid-column:1 / 3;z-index:6;background:#081d3f;border:1px solid var(--line);padding:24px 34px;display:flex;flex-direction:column;gap:18px;min-height:0;overflow:hidden}
.w-over > *{animation:rise2 .5s cubic-bezier(.2,.9,.3,1) both}
.wo-head small,.wo-launch small,.wo-sub{font-size:18px;letter-spacing:.26em;color:var(--cy);font-weight:700}
.wo-head h1{font-size:60px;color:#fff;letter-spacing:.06em;line-height:1.05}
.wo-tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;flex:none}
.wt{border:1px solid var(--line);background:rgba(127,200,255,.06);padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wt span{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.wt b{font-family:var(--mono);font-size:46px;color:var(--amber);line-height:1.05;white-space:nowrap}
.wt small{font-size:17px;color:var(--muted)}
.wt.good b{color:var(--green)}.wt.bad b{color:var(--red)}.wt.stars b{font-family:var(--sans);font-size:38px}
.wo-body{flex:1;min-height:0;display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.wo-chart{display:flex;flex-direction:column;gap:8px;min-height:0}
.wo-chart .fc-legend{font-size:20px}.wo-chart .fcs .ax{font-size:20px}
.wo-report{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.wo-report > div:not(.reviews):not(.wo-sub){display:flex;gap:12px;align-items:baseline;font-size:21px;border-left:3px solid var(--hair);padding:4px 12px}
.wo-report .status{font-size:16px;min-width:8.5em}
.wo-report .review .txt{font-size:19px}.wo-report .review .face{font-size:30px}
.wo-ms{display:flex;align-items:baseline;gap:22px;padding:12px 20px;border:2px solid var(--amber);background:rgba(255,200,61,.1);flex:none;animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
.wo-ms b{color:var(--amber);font-size:24px;letter-spacing:.2em}.wo-ms span{font-size:34px;font-weight:800;color:#fff}.wo-ms small{font-size:22px;color:var(--muted);margin-left:auto}
.wo-launch{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.wo-launch h1{font-size:84px;color:#fff;letter-spacing:.1em}
.wl-plane .plane-svg{width:640px;height:256px;filter:drop-shadow(0 0 30px rgba(127,214,255,.35))}
.wo-launch h2{font-size:48px;color:var(--cy);text-transform:none;letter-spacing:.04em}
.wl-facts{display:flex;gap:48px;font-size:26px;color:var(--muted)}.wl-facts b{font-family:var(--mono);font-size:40px;color:var(--amber);margin-right:8px}
.wo-launch p{font-size:30px}
#wReturn{font-size:16px}
#work{z-index:40}
.standby{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#051634;z-index:20;text-align:center;padding:20px}
.standby h1{font-size:clamp(28px,4vw,60px)}
.tapfs{position:fixed;inset:0;z-index:50;background:rgba(5,22,52,.92);border:0;color:var(--amber);font-size:clamp(28px,4vw,56px);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){ .w-ticker .tk span{animation-duration:120s} .route.alert,.cops.alert,.w-live.alert,.warnmark circle,.w-over,.wo-ms{animation:none!important} }

/* ============================================================
   STEP 2: weeks and months: stage milestones, reviews, the run, period results, savings
   ============================================================ */
.stage-card .stage-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:10px 40px}
.stage-card .lede{max-width:60ch;font-size:calc(26px * var(--tz))}
.stage-scale{display:flex;align-items:center;gap:18px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:calc(20px * var(--tz))}
.stage-scale span{padding:8px 18px;border:1px solid var(--hair);color:var(--faint);border-radius:var(--rb)}
.stage-scale span.past{color:var(--muted);border-color:var(--line)}
.stage-scale span.on{color:#081d3d;background:var(--amber);border-color:var(--amber);box-shadow:0 0 22px rgba(255,200,61,.35)}
.stage-scale i{font-style:normal;color:var(--faint)}
.stage-scale.big{font-size:34px}
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;min-height:0}
.rv-figs{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;align-content:start}
.rv-figs > div{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--hair);padding-top:8px}
.rv-figs b{font-size:var(--fn);color:var(--amber)}
.rv-pick{display:flex;flex-direction:column;gap:10px}
.rv-pick h3{color:var(--cy);font-size:calc(16px * var(--tz));letter-spacing:.16em}
.rv-pick .choice.small{min-height:0;padding:12px 16px}
.rv-pick .choice.small b{font-size:calc(22px * var(--tz))}
.sim-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:10px 20px}
.sim-chips{display:flex;gap:12px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.sim-chip{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px;padding:10px 8px;border:1px solid var(--hair);background:rgba(4,18,43,.35);opacity:.45;transition:opacity .2s,border-color .2s;border-radius:var(--rb)}
.sim-chip b{font-size:calc(20px * var(--tz));letter-spacing:.14em;color:var(--cy)}
.sim-chip i{display:block;width:34px;height:8px;background:#36c48d;border-radius:2px;transition:height .3s}
.sim-chip.neg i{background:var(--red)}
.sim-chip span{font-size:calc(17px * var(--tz));color:var(--green);min-height:1.2em}
.sim-chip.neg span{color:var(--red)}
.sim-chip.on{opacity:1;border-color:var(--line)}
.sim-total{display:flex;gap:16px;align-items:baseline;justify-content:center}
.sim-total b{font-size:calc(52px * var(--tz))}
.sim-body .lede{text-align:center}
.pchart{display:flex;align-items:flex-end;gap:14px;height:min(42vh,360px);padding:0 10px;border-bottom:1px solid var(--line)}
.pc-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.pc-col i{display:block;width:70%;max-width:70px;height:0;background:#36c48d;border-radius:3px 3px 0 0;animation:growH .8s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i) * 90ms)}
.pc-col.neg i{background:var(--red)}
@keyframes growH{to{height:var(--h)}}
.pc-col span{font-size:calc(16px * var(--tz));color:var(--muted);white-space:nowrap}
.pc-col b{font-size:calc(17px * var(--tz));letter-spacing:.1em;color:var(--cy);margin-top:4px}
.big-t td{font-size:var(--fs);padding:12px 10px}.big-t th{font-size:14px}
.big-t tr.tot td{color:var(--muted);border-top:2px solid var(--line)}
.sl-why.paused{border-left-color:var(--red);box-shadow:0 0 30px rgba(255,107,107,.25)}
.sl-why.paused b{color:var(--red);letter-spacing:.16em}
.save-box{margin-top:auto;border:1px solid var(--line);background:rgba(4,18,43,.4);padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-radius:var(--r)}
.save-box.ready{border-color:var(--green);box-shadow:0 0 18px rgba(110,240,180,.18)}
.save-top{display:flex;gap:10px;align-items:baseline;font-size:17px}.save-top b{color:var(--white)}.save-top .amber{margin-left:auto}
.save-bar{height:12px;background:rgba(127,200,255,.14);position:relative;border-radius:2px;overflow:hidden}
.save-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f80d2,#7fd6ff)}
.save-box.ready .save-bar i{background:#36c48d}
.save-foot{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.td-more{display:flex;gap:8px;flex-wrap:wrap}.td-more .btn{min-height:48px;font-size:15px;padding:6px 14px}
.fcs .fcm{stroke:var(--white);stroke-width:2;stroke-dasharray:4 3}
.k.fcm{background:none;border-top:2px dashed var(--white);height:0;width:16px;vertical-align:3px;border-radius:0}
.hqd.compact .save-box{padding:6px 10px;gap:4px}.hqd.compact .save-foot{font-size:13px}.hqd.compact .td-more .btn{min-height:42px;font-size:13px}
.w-sim{grid-area:mp;align-self:end;justify-self:center;z-index:4;width:min(1100px,94%);margin-bottom:22px;background:rgba(5,20,46,.94);border:2px solid var(--green);padding:16px 22px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 0 34px rgba(110,240,180,.25)}
.wsim-h{font-size:28px;font-weight:800;letter-spacing:.16em;color:var(--green)}
.wsim-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wsim-chips span{font-family:var(--mono);font-size:24px;font-weight:700;padding:6px 12px;border:1px solid var(--hair);color:var(--faint)}
.wsim-chips span.on{color:#081d3d;background:var(--green);border-color:var(--green)}
.wsim-p,.wo-paused{font-size:26px;font-weight:800;letter-spacing:.14em;color:#fff;background:rgba(255,107,107,.3);border:2px solid var(--red);padding:8px 16px}
.mode-sim .w-board td{opacity:.75}
@media (prefers-reduced-motion: reduce){ .pc-col i{animation:none;height:var(--h)} }

.td-act{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px 14px}
.td-act .muted{grid-column:1 / -1}
.td-more{flex-direction:column;align-items:flex-start}
.td-more .btn{min-height:40px;font-size:13px;padding:4px 12px;letter-spacing:.06em}
.hqd.compact .td-act .muted{display:none}
.td-body:has(.save-box) p{display:none}
.hqd.compact .td-body:has(.save-box) .td-news{font-size:calc(17px * var(--tz))}
.hqd.compact .td-body{padding-top:8px;gap:4px}.hqd.compact .td-act{padding-top:4px;padding-bottom:10px}
.hqd.compact .td-more .btn{min-height:36px;font-size:12px}
table.fx.dense th,table.fx.dense td{height:40px!important;padding-top:2px;padding-bottom:2px}
table.fx.dense td.c{font-size:calc(26px * var(--tz))}
.sim-chips.dense{gap:5px}.sim-chips.dense .sim-chip{min-width:30px;padding:6px 2px;gap:4px}
.sim-chips.dense .sim-chip b{font-size:13px;letter-spacing:0}.sim-chips.dense .sim-chip i{width:16px}.sim-chips.dense .sim-chip span{display:none}
.pchart.dense{gap:4px}.pchart.dense .pc-col span{display:none}.pchart.dense .pc-col b{font-size:12px;letter-spacing:0}
.wsim-chips.dense span{font-size:16px;padding:4px 6px}
.mk{font-style:normal;font:inherit;letter-spacing:inherit;text-transform:none}
.hqd.wide .td-more{flex-direction:row;flex-wrap:wrap}
.hqd.wide .td-body:has(.save-box) .td-news{font-size:calc(20px * var(--tz))}
/* Home: in the top bar, and a small corner button on full-screen task screens */
.homefab{display:none;position:fixed;left:8px;bottom:8px;z-index:45;min-height:40px!important;min-width:40px;padding:0 12px!important;font-size:14px!important;opacity:.8;background:rgba(8,29,61,.9)}
.homefab:hover{opacity:1}
body.focus .homefab{display:inline-flex;align-items:center;justify-content:center}
body.focus .testbar{left:110px}
/* ============================================================
   VISUAL POLISH (Visual Polish & Strategy brief): blue/cyan for action and selection, gold kept
   for money, stars and achievements, layered surfaces lit from the top left.
   ============================================================ */
:root{ --act-a:#2a8fe0; --act-m:#1d79d0; --act-b:#1560b8; --sel:#46c8ff; --sel-rgb:70,200,255; --open:#e9f8ff; --op:#5cc8f5;
  --surface:radial-gradient(130% 70% at 0% 0%, rgba(96,176,255,.14), transparent 55%), linear-gradient(160deg, #15407a 0%, #10305f 45%, #0b2448 100%);
  --lift:inset 0 1px 0 rgba(170,225,255,.16), inset 0 -1px 0 rgba(0,8,25,.5), 0 12px 32px rgba(2,10,28,.38); }
/* primary action: illuminated blue, not fluorescent */
.btn.primary,.btn.huge,.btn.act,.pad button.check,.side2 .pad button.check{background:linear-gradient(160deg, var(--act-a) 0%, var(--act-m) 40%, var(--act-b) 100%);color:#fff;border:1px solid rgba(120,215,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32), inset 0 -2px 0 rgba(5,25,60,.45), 0 0 16px rgba(41,185,239,.22), 0 6px 18px rgba(3,14,35,.35);text-shadow:0 1px 0 rgba(4,20,50,.45)}
.btn.primary:hover:not(:disabled),.btn.huge:hover:not(:disabled),.btn.act:hover:not(:disabled),.pad button.check:hover{border-color:#9fe6ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(5,25,60,.45), 0 0 28px rgba(41,185,239,.5), 0 6px 18px rgba(3,14,35,.35);filter:brightness(1.06)}
.btn.primary:disabled,.btn.huge:disabled{opacity:1;background:#173761;color:rgba(214,232,255,.5);border-color:rgba(127,200,255,.22);box-shadow:none;text-shadow:none}
.btn{background:linear-gradient(180deg, rgba(127,200,255,.12), rgba(127,200,255,.03));box-shadow:inset 0 1px 0 rgba(170,225,255,.12)}
.btn:focus-visible,.choice:focus-visible,.opt:focus-visible,.strat:focus-visible,.ptab:focus-visible{outline:2px solid #bdeeff;outline-offset:2px}
.btn.good{background:linear-gradient(160deg,#3fd08a,#1f9d63);color:#04231a}
/* selected: navy base, cyan edge, blue wash, a bright side marker */
.choice.on,.opt.on,.opt[aria-pressed="true"],.card-n.on,.card.exec .opt.on,.plane-card.picked{border-color:var(--sel)!important;background:linear-gradient(135deg, rgba(41,140,230,.32), rgba(41,185,239,.10) 60%, rgba(8,29,61,.45));
  box-shadow:inset 3px 0 0 #7fe0ff, inset 0 0 0 1px rgba(var(--sel-rgb),.45), 0 0 22px rgba(var(--sel-rgb),.26)}
.choice,.opt,.plane-card,.card-n{background:linear-gradient(160deg, rgba(30,82,152,.38), rgba(8,26,56,.6));border:1px solid rgba(127,200,255,.24)}
.choice{border-left:3px solid rgba(127,200,255,.55)}
.choice:hover,.opt:hover{border-color:rgba(var(--sel-rgb),.7)}
.card.exec .opt{border-left-color:rgba(var(--sel-rgb),.8)}
.opt .big{font-family:var(--sans);color:var(--white);text-shadow:none;font-variant-numeric:tabular-nums}
.sw.on{outline:2px solid var(--sel);box-shadow:0 0 14px rgba(var(--sel-rgb),.5)}
.op.on{border-color:var(--sel);color:#dff6ff;background:rgba(41,140,230,.28)}
.stepbar button.on,.parts span.on,.stage-scale span.on{background:linear-gradient(160deg, var(--act-a), var(--act-b));color:#fff;border-color:rgba(120,215,255,.75);box-shadow:0 0 18px rgba(41,185,239,.3)}
.step-mark{color:#bfeeff;border-color:rgba(var(--sel-rgb),.6)}
.sl-progress i.on{background:linear-gradient(90deg,#1f95dc,#7fe0ff);box-shadow:0 0 10px rgba(41,185,239,.6)}
.ft-h.picked{background:rgba(41,140,230,.16);box-shadow:inset 0 -3px 0 var(--sel)}
table.fx thead th.picked{box-shadow:inset 0 -4px 0 var(--sel)}
