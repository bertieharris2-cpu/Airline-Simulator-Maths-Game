<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations briefing — One big Saturday</title>
<link rel="stylesheet" href="kit/brief-kit.css" data-kit>
<script src="kit/brief-kit.js" data-kit></script>
</head>
<body data-brief="event_weekend">
<script>
/* 8 · One big Saturday (the All Blacks announcement, week 4). His week as a row of seven gates, the route's usual passengers at
   each, his flights in place. An event card drops onto the match weekend and a wave of supporters floods those gates while
   the rest stay calm; his flights don't move. After Next the match weekend lights (no tap since 19 Oct, evening). Caption: An event changes one weekend, not every
   weekend. Lands on the Operations Request for changing one particular date (the day_override upgrade: the request is noted;
   the systems team builds it later). */
const D = Object.assign({ id:'event_weekend', route:'Dublin', title:'IRELAND v NEW ZEALAND', when:'SAT 5 OCT', want:[48, 45, 47, 50, 61, 71, 66], mult:[1, 1, 1, 1, 1, 2, 2], seats:[57, 57, 57, 57, 57, 57, 57],
  flights:[{ t:'06:00' }, { t:'09:40' }, { t:'13:40' }], options:['Change one particular date', 'Change weekends', 'Change every day'] }, K.B);
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], want = D.want, ev = want.map((v, k) => Math.round(v * (D.mult[k] || 1))), hit = D.mult.map((m, k) => m > 1 ? k : -1).filter(k => k >= 0);
const per = Math.max(1, Math.ceil(Math.max(...ev, ...D.seats) / 48)), num = K.num;
K.run(() => {   // Back plays the briefing again from here (the kit: Next and Back are always allowed)
K.start({ title:'One big Saturday' });
const L = K.layers();
K.terminal({ horizon:250, glassBottom:360, tower:false, pane:205, poolX:800 });
const BX = k => 105 + k * 200, ROWY = r => 752 - r * 33, COLX = (k, c) => BX(k) + 100 + (c - 2.5) * 27;
const bays = DAYS.map((d, k) => { const g = K.s('g', null, L.mid), x = BX(k); K.s('rect', { x:x + 6, y:372, width:188, height:408, fill:'#0d2242', opacity:.55 }, g);
  K.txt(g, x + 100, 888, d, { 'font-size':24, 'font-weight':700, 'text-anchor':'middle', fill:'#B8CBE6' }); const cnt = K.txt(g, x + 100, 404, `${num(want[k])} want`, { 'font-size':18, 'font-weight':600, 'text-anchor':'middle', fill:'#9FBDE3' });
  const out = K.s('rect', { x:x + 4, y:370, width:192, height:530, fill:'none', stroke:'#36C6FF', 'stroke-width':3, opacity:0 }, L.top); return { g, x, cnt, out, people:[] }; });
const flies = D.seats.some(v => v > 0) && D.flights.length;
const seatLine = !flies ? [] : bays.map((b, k) => { const n = Math.round(D.seats[k] / per), y = ROWY(n / 6) - 26; const g = K.s('g', null, L.top); K.s('rect', { x:b.x + 10, y:y - 2, width:180, height:4, fill:'#EAF2FF', filter:K.B.kitFlat ? undefined : 'url(#fGlowLine)' }, g); K.txt(g, b.x + 188, y - 8, `${num(D.seats[k])} seats`, { 'font-size':14, 'font-weight':600, 'text-anchor':'end', stroke:'#06142b', 'stroke-width':4, 'paint-order':'stroke' }); return g; });
/* his flights under each day: the same all week, and they do not move */
bays.forEach(b => { const g = K.s('g', null, L.top); K.s('rect', { x:b.x + 10, y:796, width:180, height:58, fill:'#06142b', stroke:'#2b5c95', 'stroke-width':1.5 }, g); if(!flies) K.txt(g, b.x + 100, 831, 'no flights', { 'font-size':15, 'text-anchor':'middle', fill:'#8EA6C8' }); D.flights.slice(0, 4).forEach((f, i, a) => { const w = 168 / a.length, c = K.s('g', { transform:`translate(${b.x + 16 + i * w} 806)` }, g); K.s('rect', { x:0, y:0, width:w - 6, height:38, fill:'#1f6fd1', opacity:.9 }, c); K.txt(c, (w - 6) / 2, 25, f.t, { 'font-size':15, 'font-weight':700, 'text-anchor':'middle' }); }); });
if(per > 1) K.call(220, 340, `each figure = ${per} travellers`, 'quiet');
const place = (k, i) => { const r = Math.floor(i / 6), c = i % 6; return [COLX(k, c) + (r % 2 ? 6 : -6), ROWY(r)]; };
function fill(k, n, kind){ const b = bays[k]; for(let i = b.people.length; i < n; i++){ const [x, y] = place(k, i); const P = K.person(b.g, x, y, kind || 'pax', { scale:1 - Math.floor(i / 6) * .03, child:false }); b.people.push(P); } }

(async () => {
  K.mark(0); await K.caption(flies ? `${D.route}, a usual week: the same flights every day.` : `${D.route}, a usual week. You don't fly there yet.`);
  DAYS.forEach((d, k) => fill(k, Math.round(want[k] / per)));
  await K.wait(1600);
  // the event card drops onto the match weekend
  const k0 = hit[0] === undefined ? 5 : hit[0], k1 = hit[hit.length - 1] === undefined ? 5 : hit[hit.length - 1];
  const card = K.s('g', { opacity:0 }, L.top), cx = (BX(k0) + BX(k1) + 200) / 2, cw = (k1 - k0 + 1) * 200 - 20;
  K.s('rect', { x:cx - cw / 2, y:0, width:cw, height:96, fill:'#0a1a33', stroke:'#F2C14E', 'stroke-width':3 }, card); K.s('rect', { x:cx - cw / 2, y:0, width:cw, height:8, fill:'#F2C14E' }, card);
  K.txt(card, cx, 44, D.title, { 'font-size':24, 'font-weight':800, 'text-anchor':'middle' }); K.txt(card, cx, 76, D.when, { 'font-size':18, 'text-anchor':'middle', fill:'#FFE3A8', 'letter-spacing':2 });
  await K.caption('Then an event is announced…');
  await K.tween(900, t => { card.setAttribute('opacity', t); card.setAttribute('transform', `translate(0 ${120 + 140 * t})`); }, 'out');
  // a wave of supporters floods those days; the rest stay calm
  for(const k of hit){ const b = bays[k], before = b.people.length; fill(k, Math.round(ev[k] / per), 'fan');
    const add = b.people.slice(before); add.forEach(p => { p.g.style.opacity = 0; }); await Promise.all(add.map((p, i) => { const x = p.x, y = p.y; p.set(x, y - 60); return K.wait(i * 12).then(() => { p.g.style.opacity = 1; return K.tween(420, t => p.set(x, y - 60 * (1 - t)), 'out'); }); }));
    K.count(b.cnt, want[k], ev[k], 600).then(() => b.cnt.textContent = `${num(ev[k])} want`); }
  await K.caption(flies ? 'Your flights stay where they are.' : 'Twice the usual people, and no flights of yours to carry them.');
  await K.wait(800);
  await K.cont('Next');
  // Reveal: the days that changed light by themselves (no tap since 19 Oct, evening)
  K.mark(1); hit.forEach(k => { bays[k].out.setAttribute('stroke', '#F2C14E'); bays[k].out.setAttribute('opacity', 1); });
  const extra = hit.reduce((t, k) => t + Math.max(0, ev[k] - D.seats[k]), 0);
  K.question(`${hit.map(k => DAYS[k]).join(' and ')}: <b>twice</b> the usual.${flies && extra ? ` ${num(extra)} more than your seats.` : ''}`);
  await K.caption(`<b>An event changes one weekend, not every weekend.</b>`);
  await K.cont('Go on');
  // the Operations Request: one date
  K.mark(2); K.question('<b>Operations request:</b> what should the planner let you do?');
  await K.caption('Choose the change that fits an event.');
  let chosen = null;
  for(;;){
    const ch = K.chips({ x:800, y:150, center:true, label:'Operations request', items:[1, 0, 2].map(i => ({ label:D.options[i], value:i })) });
    ch.btns.forEach(b => { b.style.width = '19cqw'; b.style.padding = '.9cqw 1cqw'; });
    chosen = await K.decide(ch.wait()); ch.off();   // a decision (an Operations Request), not a guess: it stays
    await K.caption(chosen === 0 ? 'One date: extra flights for the match weekend only; the next weekend goes back to normal.' : chosen === 1 ? 'Every weekend: the extra flights would fly every Saturday and Sunday, mostly empty.' : 'Every day: the extra flights would fly all week, empty except for the match.');
    await K.wait(1800); ch.remove(); if(chosen === 0) break;
    const again = K.chips({ x:800, y:160, center:true, label:'Again', items:[{ label:'Choose again', value:'a' }, { label:'Keep this choice', value:'k' }] });
    const a = await K.decide(again.wait()); again.remove(); if(a === 'k') break;
  }
  await K.caption(chosen === 0 ? 'Noted: the systems team will build changes for one date. This time, plan the match week on its own plan.' : 'Noted. The systems team will look at it.');
  await K.cont('Back to the plan');
  K.done({ chosen, right:chosen === 0 });
})();
});
</script>
</body>
</html>
