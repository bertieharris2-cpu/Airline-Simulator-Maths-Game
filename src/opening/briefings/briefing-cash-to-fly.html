const pArt = i => (FLEET[i] && FLEET[i].art) || undefined;
function makePlane(art, behind, plain){ const g = K.plane(L.mid, { natural:true, flip:true, art, plain }); g.dataset.behind = behind ? 1 : 0; g.style.opacity = 0; return g; }
const planes = [makePlane(pArt(0), false)];
const spot = (g, d) => { const b = +g.dataset.behind; return { x:Math.min(1150 - g.w - (b ? 34 : 0), Math.max(400, SC(Math.min(d, 6)) - g.w / 2)) + (b ? 34 : 0), y:468 - g.h - (b ? 58 : 0) }; };   // (a big plane at Monday keeps clear of the gauge)
const put = (g, x, y, o) => { K.at(g, x, y); if(o !== undefined) g.style.opacity = o; };
function planesAt(d, o){ planes.forEach(g => { const p = spot(g, d); put(g, p.x, p.y, o); }); }
async function taxiIn(){ planes.forEach(g => { const p = spot(g, 0); put(g, 1640, p.y, 1); });
  await K.tween(RM ? 0 : 1500, k => planes.forEach(g => { const p = spot(g, 0); put(g, lerp(1640, p.x, k), p.y); }), 'out'); }
/* a day flown: the planes that fly lift off to the left; a grounded one stays, grey; all of them are at the next day after */
async function planesFly(d, row){
  const go = planes.filter((g, i) => row.flew.includes(i)), stay = planes.filter((g, i) => row.grounded.includes(i));
  stay.forEach(g => g.style.opacity = .35);
  await K.tween(RM ? 0 : 560, k => go.forEach(g => { const p = spot(g, d); put(g, p.x - 150 * k * k, p.y - 80 * k * k, 1 - k); }), 'in');
}
async function planesNext(d){
  planes.forEach(g => g.style.opacity = 0);
  await K.tween(RM ? 0 : 420, k => planes.forEach(g => { const p = spot(g, d); put(g, p.x, p.y - 24 * (1 - k), k); }), 'out');
  planesAt(d, 1);
}

/* the coins: the day's tickets, from the day's stand into the cash */
function coin(parent){ const g = sv('g', null, parent); sv('ellipse', { cx:0, cy:2.2, rx:13, ry:13, fill:'#a87a0c' }, g); sv('ellipse', { cx:0, cy:0, rx:13, ry:13, fill:'#f2c14e' }, g); sv('ellipse', { cx:0, cy:0, rx:9, ry:9, fill:'none', stroke:'#c99512', 'stroke-width':1.6 }, g); return g; }
async function coins(d){
  if(RM) return; const x0 = SC(d), y0 = 500, x1 = GC, y1 = GT + 26, cx = (x0 + x1) / 2, cy = 150, cs = [0, 1, 2, 3, 4, 5].map(() => coin(L.top));
  await Promise.all(cs.map((c, j) => W8(j * 70).then(() => K.tween(640, k => { const a = 1 - k, x = a * a * x0 + 2 * a * k * cx + k * k * x1, y = a * a * y0 + 2 * a * k * cy + k * k * y1; K.at(c, x, y, .85); c.setAttribute('opacity', k > .9 ? (1 - k) * 10 : 1); }, 'io'))));
  cs.forEach(c => c.remove());
}

/* the flight board: a line per day flown (tickets in green, fuel and costs plain, the day's result), the week so far */
const BX = 1160, BW = 426, BY = 80, BH = 690, CR = { t:1336, f:1414, c:1494, r:BX + BW - 18 };
const board = sv('g', { opacity:0 }, L.mid);
sv('rect', { x:BX, y:BY, width:BW, height:BH, fill:'#020812', stroke:'rgba(65,122,171,.6)' }, board); sv('line', { x1:BX, y1:BY + .5, x2:BX + BW, y2:BY + .5, stroke:'#9cc4f0', 'stroke-opacity':.5 }, board);
const bTitle = txt(board, BX + 18, BY + 36, '', { 'font-size':16.5, 'font-weight':700, 'letter-spacing':1.6, fill:'#9fbde3' });
[['DAY', BX + 18, 'start'], ['TICKETS', CR.t, 'end'], ['FUEL', CR.f, 'end'], ['COSTS', CR.c, 'end'], ['RESULT', CR.r, 'end']].forEach(([s, x, a]) => txt(board, x, BY + 70, s, { 'font-size':14.5, 'font-weight':600, 'letter-spacing':.6, fill:'#6f86a8', 'text-anchor':a }));
sv('line', { x1:BX + 14, y1:BY + 82, x2:BX + BW - 14, y2:BY + 82, stroke:'rgba(53,96,135,.5)' }, board);
const RY = i => BY + 92 + i * 70;
const bRows = DAYS.map((x, i) => { const y = RY(i), g = sv('g', null, board);
  const t = (xx, s, a) => txt(g, xx, y + 30, s, Object.assign({ 'font-size':16.5, 'text-anchor':'end' }, a || {}));
  return { date:t(BX + 18, x.d, { 'text-anchor':'start', 'font-size':17, fill:'#6f86a8' }), tk:t(CR.t, '', { fill:'#3ce394' }), fu:t(CR.f, '', { fill:'#9fbde3' }), co:t(CR.c, '', { fill:'#9fbde3' }),
    re:t(CR.r, '', { 'font-weight':700, 'font-size':18, fill:'#eaf2ff' }), note:txt(g, BX + 18, y + 54, '', { 'font-size':15, fill:'#8ea6c8' }), rule:sv('line', { x1:BX + 14, y1:y + 66, x2:BX + BW - 14, y2:y + 66, stroke:'rgba(53,96,135,.38)', opacity:0 }, g) }; });
sv('line', { x1:BX + 14, y1:BY + BH - 74, x2:BX + BW - 14, y2:BY + BH - 74, stroke:'#9fbde3', 'stroke-width':2 }, board);
txt(board, BX + 18, BY + BH - 28, 'Week so far', { 'font-size':19, fill:'#c6d8f0' });
const soFar = txt(board, BX + BW - 18, BY + BH - 26, '£0', { 'font-size':28, 'font-weight':700, 'text-anchor':'end', fill:'#eaf2ff' });
function boardRow(W, i){ const r = W.rows[i], b = bRows[i];
  b.date.setAttribute('fill', '#eaf2ff'); b.date.setAttribute('font-weight', 700);
  b.tk.textContent = r.tickets ? '+' + money(r.tickets) : '£0'; b.fu.textContent = r.fuel ? '−' + money(r.fuel) : '£0'; b.co.textContent = r.costs ? '−' + money(r.costs) : '£0'; b.re.textContent = money(r.result);
  b.note.textContent = r.grounded.length ? (W.planes.length > 1 && r.flew.length ? `1 plane grounded: its ${money(W.planes[r.grounded[0]].idle)} still paid` : `grounded: the day's ${money(r.costs)} still paid`) : r.dearL ? `ran dry: ${num(r.dearL)} L at +${PENCE}p` : '';
  b.rule.setAttribute('opacity', 1); soFar.textContent = money(flying(W)); }
function boardClear(W, title){ bTitle.textContent = title; bRows.forEach(b => { b.date.setAttribute('fill', '#6f86a8'); b.date.setAttribute('font-weight', 400); [b.tk, b.fu, b.co, b.re, b.note].forEach(t => t.textContent = ''); b.rule.setAttribute('opacity', 0); }); soFar.textContent = '£0'; }

/* the controls: Buy under the gauge, Fly under the week */
const act = (cls, x, y) => { const b = K.h('button', { class:'bk-act ' + cls, type:'button' }, hud, ''); K.pos(b, x, y); b.hidden = true; return b; };
const buyB = act('', GC, 772), flyB = act('sec', MID, 772);
const press = (...bs) => K.decide(new Promise(res => bs.forEach((b, i) => b.onclick = () => { if(b.disabled || b.hidden) return; bs.forEach(x => x.onclick = null); res(i); }))).then(i => bs[i]);   // a decision: Next waits for it (kept as which button, so a replay presses the same one)
let W = week(D.cash, [ME]), stage = 1, stagedBuys = 0;
function spendLabel(){ const top = yOf(shown), ln = yOf(R), room = shown - R;
  if(stage < 2 || room <= 0 || ln - top < 56){ spend.setAttribute('opacity', 0); spend2.setAttribute('opacity', 0); spendBg.setAttribute('opacity', 0); return; }
  const y = (top + ln) / 2; spend.textContent = money(room); spend.setAttribute('y', (y - 2).toFixed(1)); spend2.setAttribute('y', (y + 18).toFixed(1)); spend.setAttribute('opacity', 1); spend2.setAttribute('opacity', 1); spendBg.setAttribute('y', (y - 26).toFixed(1)); spendBg.setAttribute('opacity', .94); }
function sayBuy(){ const n = canBuy(W, R), all = Math.ceil(stillNeed(W) / BL - 1e-9);
  if(!all) return 'The fuel for the rest of the week is bought.';
  if(!n) return W.cash <= R ? `Keeping ${money(R)} leaves nothing to spend on fuel.` : `Above your line there isn't enough for a block (${money(PR)}).`;
  return `You can buy ${n === all ? 'all ' : ''}${blocks(n)} and keep ${money(W.cash - n * PR)}.`; }
function refresh(){
  const n = canBuy(W, R); buyB.innerHTML = n ? `Buy ${blocks(n)} · ${money(n * PR)}` : 'Buy'; buyB.disabled = !n;
  keepT.textContent = `keeping ${money(R)}`; const low = rLive && R < PR; hint1.setAttribute('opacity', low ? 1 : 0); hint2.setAttribute('opacity', low ? 1 : 0);
  spendLabel(); if(stage === 2 && touched){ const c = document.querySelector('.bk-cap'); if(c) c.innerHTML = sayBuy(); }
  if(W.day < 7) flyB.innerHTML = `Fly ${DAYS[W.day].name} &#9654;`;
  if(stage === 2) flyB.hidden = n > 0;   // nothing above the line: the week can still be flown (emergency fuel)
  needsLine();
}
/* under the strip: what the week needs, then what is bought so far */
function needsLine(){ const b = boughtL(W), who = W.planes.length > 1 ? 'Two planes need' : 'This week needs';
  needs.textContent = b ? `${who} ${num(weekL(W))} L · bought so far ${blocks(Math.round(b / BL))} (${num(b)} L)` : `${who} ${num(weekL(W))} L — ${blocks(Math.ceil(weekL(W) / BL - 1e-9))} at ${money(PR)}.`; }
const boughtL = W => W.log.reduce((t, x) => t + (x.buy || 0) * BL, 0);
const weekL = W => W.planes.reduce((t, P) => t + P.litres.reduce((a, v) => a + v, 0), 0);
async function doBuy(n, fast){
  const t0 = W.tank, c0 = W.cash; buyB.classList.remove('lit'); buy(W, n); refresh();
  K.tween(RM ? 0 : fast ? 200 : 520, k => setLevel(lerp(c0, W.cash, k)), 'out');
  await K.tween(RM ? 0 : fast ? 260 : 900, k => paintDrums(W, lerp(t0, W.tank, k)), 'io'); paintDrums(W); setLevel(W.cash);
}
async function doFly(fast){
  const d = W.day, c0 = W.cash, before = Math.min(Math.max(0, W.tank), needOn(W, d)), row = fly(W);
  buyB.classList.remove('lit'); buyB.disabled = flyB.disabled = true;
  if(!fast) await planesFly(d, row);
  if(row.flew.length) await K.tween(RM ? 0 : fast ? 120 : 380, k => paintDrum(d, { need:needOn(W, d), fill:before * (1 - k), state:'open' }), 'io');
  paintDrums(W);
  if(row.flew.length && !fast){ const up = c0 - row.dearCost + row.tickets; await Promise.all([coins(d), W8(260).then(() => levelTo(up, 520))]); }
  await levelTo(row.cash, fast ? 120 : 360);
  boardRow(W, d); if(row.grounded.length) dayNote[d].textContent = W.planes.length > 1 && row.flew.length ? '1 grounded' : 'grounded';
  if(fast) planesAt(Math.min(W.day, 6), 1); else if(W.day < 7) await planesNext(W.day); else planesAt(6, 1);
  refresh(); flyB.disabled = false; return row;
}
/* a buy or a day flown, until Sunday is flown; the caption follows what happened */
async function flyTheWeek(counts, first){
  while(W.day < 7){
    flyB.hidden = false; buyB.hidden = false; refresh();
    const b = first || await press(buyB, flyB); first = null;
    if(b === buyB){ await doBuy(canBuy(W, R)); if(counts) stagedBuys++; continue; }
    const row = await doFly(), d = row.d, n = canBuy(W, R), next = W.day < 7 ? needOn(W, W.day) : 0;
    const short = W.day < 7 && next && W.tank < next && n > 0; if(short) buyB.classList.add('lit');   // Buy lights whenever the tickets can fill tomorrow's drum
    if(row.grounded.length) await K.caption(W.planes.length > 1 && row.flew.length ? 'A plane you can\'t fuel still costs you every day.' : 'Grounded: the fuel couldn\'t be paid for, and the day\'s costs still ran.');
    else if(row.dearL) await K.caption(`Ran dry: today's fuel cost ${PENCE}p a litre more.`);
    else if(short) await K.caption(`${DAYS[d].name}'s tickets are in. <b>You can buy ${n} more ${n === 1 ? 'block' : 'blocks'} now.</b>`);
  }
  flyB.hidden = true; buyB.hidden = true;
}
const fadeIn = (el, ms) => K.tween(RM ? 0 : ms || 260, k => el.setAttribute('opacity', k), 'out');

(async () => {
  /* ---------- 1 · Show: the week needs fuel ---------- */
  K.mark(0); setLevel(0); paintDrums(W); boardClear(W, `WEEK ${D.week} · ${ME.name.toUpperCase()}`);
  fadeIn(board, 400);
  for(let i = 0; i < 7; i++){ fadeIn(stands[i].g); fadeIn(drums[i].g); fadeIn(dayLab[i]); await W8(80); }
  needsLine(); fadeIn(needs, 400);
  await taxiIn(); stands[0].now.setAttribute('opacity', 1); dayLab[0].setAttribute('fill', '#36c6ff');
  await levelTo(D.cash, 1000);
  await K.caption(`Your planes need fuel every day. You have <b>${money(D.cash)}</b>.`);
  await K.cont();

  /* ---------- 2 · Decide: how much do you keep back? ---------- */
  K.mark(0); stage = 2;
  await K.caption('Before you buy, decide how much cash you\'ll keep for emergencies. There\'s no right amount — it\'s your call.');
  setR(R); rLive = true; await fadeIn(rv, 300); fadeIn(perBlock, 300); keepT.setAttribute('opacity', 1);
  buyB.hidden = false; refresh(); setTimeout(() => { try{ rHand.focus({ preventScroll:true }); }catch(e){} }, 60);
  if(!RM){ const r0 = R; for(let j = 0; j < 2; j++){ await K.tween(260, k => { if(!touched) rv.setAttribute('transform', `translate(0 ${(yOf(r0) - 22 * Math.sin(k * Math.PI)).toFixed(1)})`); }, 'io'); } if(!touched) setR(r0); }
  // nothing above the line: the week can still be flown (the drums empty, emergency fuel)
  flyB.hidden = canBuy(W, R) > 0; refresh();
  const first = await press(buyB, flyB);

  /* ---------- 3 · Buy and fly: the week in stages ---------- */
  K.mark(0); stage = 3; touched = false;
  if(first === buyB){ await doBuy(canBuy(W, R)); stagedBuys++; await K.caption(`Now fly the week, one day at a time.`); }
  await flyTheWeek(true, first === flyB ? flyB : null);
  const W1 = W;
  await K.caption('You don\'t need the whole week\'s fuel on Monday. <b>Buy what you can, fly, and buy the rest with the tickets.</b>');
  await K.cont();

  /* ---------- 4 · The twist: a plane you can't fuel ---------- */
  K.mark(1); stage = 4;
  let bought = false, W2 = null;
  if(NEW){
    // back to Monday
    W = week(D.cash, [ME]); boardClear(W, `WEEK ${D.week} · ${ME.name.toUpperCase()}`); dayNote.forEach(t => t.textContent = ''); paintDrums(W); planesAt(0, 1); await levelTo(D.cash, 600);
    await K.caption('Back to Monday.');
    const afford = NEW.price <= D.cash;
    const card = K.h('div', { class:'bk-card' }, hud, `<span class="ey">The shop</span><h3>The shop has a ${K.esc(NEW.name)} for ${money(NEW.price)}. ${afford ? 'Buy it?' : ''}</h3>
      <p>${afford ? (SH.where ? `On ${K.esc(SH.where)} it would need ${num(NEW.litres.reduce((a, v) => a + v, 0))} L of fuel this week, and cost ${money(NEW.idle)} a day to run.` : `It would fly a week like yours: ${num(NEW.litres.reduce((a, v) => a + v, 0))} L of fuel, and ${money(NEW.idle)} a day to run.`) : `That's more than the ${money(D.cash)} you have.`}</p>
      <div class="bk-row">${afford ? '<button class="bk-chip" data-c="buy" type="button">Buy it</button>' : ''}<button class="bk-chip" data-c="no" type="button">${afford ? 'Not now' : 'Go on'}</button></div>`);
    K.pos(card, MID, 290);
    const pick = await K.decide(new Promise(res => card.querySelectorAll('[data-c]').forEach(b => b.onclick = () => res(b.getAttribute('data-c'))))); 
    card.classList.add('out'); setTimeout(() => card.remove(), 400);
    if(pick === 'buy'){
      bought = true; W = week(D.cash - NEW.price, [ME, NEW]);
      const p2 = makePlane(SH.art || '', true, true); planes.push(p2); const p = spot(p2, 0);
      await K.tween(RM ? 0 : 900, k => put(p2, p.x - 260 * (1 - k), p.y - 120 * (1 - k) * (1 - k), Math.min(1, k * 1.6)), 'out');
      await levelTo(W.cash, 800); boardClear(W, `WEEK ${D.week} · 2 PLANES`); paintDrums(W);
      needsLine();
      await K.caption(`Two planes need fuel every day. You have <b>${money(W.cash)}</b>.`);
      await flyTheWeek(false); W2 = W;
      await K.caption(W2.grounded ? 'A plane you can\'t fuel still costs you every day. <b>Fuel first, then planes.</b>' : 'Before buying a plane, ask: <b>can I still afford to run the planes I\'ll have?</b>');
    } else {
      // the week runs as before; a quieter card says what the plane would have done
      for(const x of W1.log){ if(x.buy) await doBuy(x.buy, true); else await doFly(true); }
      if(afford){ W2 = autoWeek(week(D.cash - NEW.price, [ME, NEW]), R);
        const q = K.h('div', { class:'bk-card' }, hud, `<span class="ey">If you had bought it</span><p>The cash would have dropped to <b>${money(D.cash - NEW.price)}</b> on Monday, and two planes would have needed ${num(weekL(W2))} L this week.</p>`);
        K.pos(q, MID, 290); await W8(2600); q.classList.add('out'); setTimeout(() => q.remove(), 400); }
      await K.caption(afford ? 'Before buying a plane, ask: <b>can I still afford to run the planes I\'ll have?</b>' : 'Fuel first, then planes.');
    }
    if(W2){
      const A = W1, B2 = W2, row = (label, a, b, cls) => `<tr><td>${label}</td><td class="${cls || ''}">${a}</td><td class="${cls || ''}">${b}</td></tr>`;
      const plate = K.h('div', { class:'bk-card' }, hud, `<span class="ey">The same week, twice</span><table><thead><tr><th></th><th>Without the ${K.esc(NEW.name)}</th><th>With it</th></tr></thead><tbody>
        ${row('Cash on Sunday night', money(A.cash), money(B2.cash), 'gold')}${row('Bought fuel', times(A.buys), times(B2.buys))}
        ${row(`Days on fuel at +${PENCE}p`, num(A.dear), num(B2.dear))}${row('Days with a plane grounded', num(A.grounded), num(B2.grounded))}
        ${row('The week\'s flying', money(flying(A)), money(flying(B2)))}</tbody></table>`);
      K.pos(plate, MID, 290); await K.cont(); plate.classList.add('out');
    } else await K.cont();
  }

  /* ---------- 5 · Use: the rules of the game ---------- */
  K.mark(2); stage = 5; rLive = false; buyB.hidden = flyB.hidden = true;
  const dim = sv('rect', { x:0, y:0, width:1600, height:900, fill:'#020812', opacity:0 }, L.top); K.tween(RM ? 0 : 400, k => dim.setAttribute('opacity', .82 * k));
  const card = sv('g', { opacity:0 }, L.top);
  if(!K.piece('rules-card', card, { x:440, y:210, w:720 })){   // (a page opened on its own has no kit art: the same card, drawn)
    sv('rect', { x:440, y:210, width:720, height:400, fill:'#081f3d', stroke:'rgba(65,122,171,.7)' }, card);
    [['YOUR AIM THIS YEAR', 60, 20, 700, '#36c6ff'], ['Make as much money as you can.', 116, 34, 600, '#eaf2ff'], ['In January you\'ll choose what kind of airline you are.', 172, 25, 400, '#c6d8f0'],
      ['Keep cash for emergencies: you decide how much.', 216, 25, 400, '#c6d8f0'], ['Run out of cash and the airline closes.', 260, 25, 400, '#c6d8f0'], ['You start again from Launch Day. No loans.', 304, 25, 400, '#c6d8f0']]
      .forEach(([s, y, f, w, c]) => txt(card, 476, 210 + y, s, { 'font-size':f, 'font-weight':w, fill:c, 'letter-spacing':f === 20 ? 3 : 0 }));
  }
  await K.tween(RM ? 0 : 500, k => card.setAttribute('opacity', k), 'out');
  await K.caption('Your aim this year. <b>This card stays on Home until January.</b>');
  await K.cont(D.next === 'shop' ? 'Back to the shop' : 'Back to the Fuel desk');
  K.done({ reserve:R, boughtPlaneInScene:bought, stagedBuys });
})();
});
</script>
