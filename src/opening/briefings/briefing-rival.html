<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations briefing — Customers have a choice</title>
<link rel="stylesheet" href="kit/brief-kit.css" data-kit>
<script src="kit/brief-kit.js" data-kit></script>
</head>
<body data-brief="rival_split">
<script>
/* 2 · Customers have a choice (Thursday, week 1: Red Kite). Claude Design handover 18 Oct 2026, 3.8 Option A "drag the line
   through the queue": four beats.
   1 Context: Red Kite's ATR (its oxblood livery, from the kit) taxis in to the next gate; its fare sign lights beside yours.
   2 Predict: how many of your passengers will walk? A cyan handle on a track under your queue; dragging it walks that many
     figures, one by one, across to Red Kite's queue, with a running count; Lock in my guess.
   3 Reveal: the rule ("For every £10 dearer, 1 in 10 walk") builds in three steps while the queue settles; the guess stays
     beside the answer. Never "wrong".
   4 Use: who stays, in rows of ten, then back to the Red Kite card.
   The figures are the game's (the switching rule, his fare, who wants to fly). */
const D = Object.assign({ id:'rival_split', route:{ city:'Dublin' }, fare:110, rival:50, want:30, stay:12, rivalName:'Red Kite', airline:'Your airline', perTen:.1 }, K.B);
const money = K.money, num = K.num, city = D.route.city, gap = Math.max(0, D.fare - D.rival), steps = Math.min(10, Math.round(gap / 10));
// the game's own figures (the card shows the same): who wants to fly at his fare, and who stays with him; the rule for a page opened on its own
const T = Math.max(1, Math.round(D.want)), stayT = Math.max(0, Math.min(T, D.stay !== undefined ? Math.round(D.stay) : T - Math.round(T * Math.min(1, steps * (D.perTen || .1))))), walkT = T - stayT;
const per = T > 60 ? Math.ceil(T / 60) : 1, N = Math.ceil(T / per), walkN = Math.round(walkT / per), rk = String(D.rivalName || 'Red Kite');
K.start({ title:'Customers have a choice' });
const L = K.layers(), sv = K.s, flat = !!K.B.kitFlat;
/* the gates at night: pillars, the apron band, the floor */
sv('rect', { x:0, y:0, width:1600, height:900, fill:flat ? 'url(#gNight)' : 'url(#gSky)' }, L.back);
[230, 520, 810, 1100, 1390].forEach(x => sv('rect', { x:x - 6, y:0, width:12, height:330, fill:'#0a1f3d', opacity:.9 }, L.back));
sv('rect', { x:0, y:330, width:1600, height:92, fill:flat ? 'url(#gApronF)' : '#0d2342' }, L.back); sv('rect', { x:0, y:330, width:1600, height:2, fill:'#5b86b8', opacity:.35 }, L.back);
sv('rect', { x:0, y:422, width:1600, height:478, fill:flat ? 'url(#gFloorF)' : '#081831' }, L.back);
if(flat) sv('ellipse', { cx:800, cy:520, rx:760, ry:150, fill:'url(#gPoolF)' }, L.back);
/* the two aircraft, one scale (the kit's 12 px = 1 m, × 1.6), both facing left: his at his gate, Red Kite's taxiing in */
const mine = K.plane(L.back, { x:170, y:0, w:304, flip:true });
K.at(mine, 170, 404 - mine.h);
const theirs = K.plane(L.back, { x:1700, y:0, w:522, flip:true, piece:'redkite', plain:true, art:'', kind:'jet', tail:flat ? undefined : '#7a1428' });
const RKY = 404 - theirs.h; K.at(theirs, 1700, RKY);
/* the fare signs: his route, airline and fare; Red Kite's badge and fare (gold: money) */
const sign = (x, w) => { const g = sv('g', null, L.mid); K.at(g, x, 446); sv('rect', { x:0, y:0, width:w, height:64, fill:'#04111f', stroke:'#2b5c95', 'stroke-width':2 }, g); return g; };
const sA = sign(210, 372); K.txt(sA, 20, 42, `${city.toUpperCase()}${D.airline ? ' · ' + String(D.airline).toUpperCase().slice(0, 16) : ''}`, { 'font-size':24, 'font-weight':800, 'letter-spacing':1 });
const fA = K.txt(sA, 352, 42, money(D.fare), { 'font-size':26, 'font-weight':800, 'text-anchor':'end', fill:'#f2c14e' });
const sB = sign(1000, 300); sB.style.opacity = 0;
const badge = sv('g', null, sB); K.at(badge, 12, 10); if(flat && window.KIT_ART && window.KIT_ART['red-kite-badge']){ const b = sv('g', null, badge); b.innerHTML = window.KIT_ART['red-kite-badge'].replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, ''); b.setAttribute('transform', `scale(${44 / 40})`); }
else sv('rect', { x:0, y:0, width:44, height:44, fill:'#7a1428' }, badge);
K.txt(sB, 70, 42, rk.toUpperCase(), { 'font-size':24, 'font-weight':800, 'letter-spacing':1 });
const fB = K.txt(sB, 282, 42, money(D.rival), { 'font-size':26, 'font-weight':800, 'text-anchor':'end', fill:'#f2c14e' });
/* the queues, in rows of ten: his under his sign, Red Kite's under theirs */
const COLS = 10, DX = 34, DY = 58, Y0 = 590, AX = 230, BX = 1035, rows = Math.ceil(N / COLS);
const spotA = i => [AX + (i % COLS) * DX, Y0 + Math.floor(i / COLS) * DY], spotB = j => [BX + (j % COLS) * DX, Y0 + Math.floor(j / COLS) * DY];
const Q = []; for(let i = 0; i < N; i++){ const [x, y] = spotA(i), p = K.person(L.front, x, y, 'pax'); p.g.style.opacity = 0; p.home = i; Q.push(p); }
const note = per > 1 ? K.call(AX - 20, Y0 - 110, `each figure = ${per} travellers`, 'quiet') : null;
/* walking with a change of mind: a new walk takes over from wherever the figure is */
function go(p, x2, y2, ms, delay){ const tok = (p.tok || 0) + 1; p.tok = tok;
  return K.wait(delay || 0).then(() => { if(p.tok !== tok) return; const x1 = p.x, y1 = p.y;
    return K.tween(ms, (k, raw) => { if(p.tok !== tok) return; const bob = K.RM ? 0 : Math.abs(Math.sin(raw * Math.PI * 6)) * -2; p.set(K.lerp(x1, x2, k), K.lerp(y1, y2, k) + bob); }, 'lin').then(() => { if(p.tok === tok) p.set(x2, y2); }); }); }
/* n figures across: the back of his queue walks first, one by one */
let across = 0;
function walkTo(n, gapMs){ n = Math.max(0, Math.min(N, n)); const out = [];
  const order = Q.slice().sort((a, b) => b.home - a.home);
  order.forEach((p, k) => { const want = k < n, was = !!p.over; if(want === was) return; p.over = want;
    const [x, y] = want ? spotB(k) : spotA(p.home), d = Math.abs(k - (want ? across : n)) * (gapMs === undefined ? 70 : gapMs);
    out.push(go(p, x, y, 900, d)); });
  across = n; return Promise.all(out); }
const arrow = sv('g', { opacity:0 }, L.mid); sv('line', { x1:640, y1:Y0 + 20, x2:960, y2:Y0 + 20, stroke:'#9fbde3', 'stroke-width':3, 'stroke-dasharray':'12 10' }, arrow); sv('path', { d:`M960 ${Y0 + 8} L 980 ${Y0 + 20} L 960 ${Y0 + 32}`, fill:'none', stroke:'#9fbde3', 'stroke-width':3 }, arrow);

(async () => {
  // 1 Context: his queue; Red Kite taxis in next door, and its fare lights beside his
  K.mark(0);
  await Promise.all(Q.map((p, i) => { const x = p.x, y = p.y; p.set(x - 240, y); p.g.style.opacity = 1; return go(p, x, y, 800, i * 10); }));
  if(note) note.out(false);
  await K.tween(2400, t => K.at(theirs, 1700 - t * 780, RKY), 'out');
  sB.style.opacity = 1; await K.tween(450, t => { fB.setAttribute('opacity', t); fA.setAttribute('opacity', .4 + .6 * t); }, 'out');
  await K.caption(`${K.esc(rk)} Air is selling ${K.esc(city)} at ${money(D.rival)}. You charge ${money(D.fare)}: <b>${money(gap)} dearer</b>.`);
  await K.cont('Next');
  // 2 Predict: drag the marker; that many walk across
  K.mark(1); arrow.setAttribute('opacity', 1);
  await K.caption(`How many of your ${num(T)} passengers will walk to ${K.esc(rk)}? <b>Drag the marker.</b>`);
  const RW = (COLS - 1) * DX + 30, RX = AX - 15, RY = Y0 + rows * DY + 10, stops = Array.from({ length:N + 1 }, (_, k) => k);
  let guess = 0; const tip = K.call(RX, RY - 64, 'Drag: how many walk?', 'quiet');
  const rail = K.rail({ x:RX, y:RY, w:RW, stops, value:0, label:'How many walk', onMove:v => { guess = v; walkTo(v, 60); tip.move(RX + RW * v / N - 30, RY - 64); tip.say(`You think: <b style="color:#36c6ff">${num(v * per)}</b> walk`); } });
  // the track's marks: 0, 10, 20, … (in travellers)
  const tl = sv('g', null, L.top); for(let v = 0; v <= N; v += Math.max(1, Math.round(10 / per))) K.txt(tl, RX + RW * v / N, RY + 40, num(v * per), { 'font-size':15, fill:'#9fbde3', 'text-anchor':'middle' });
  await K.cont('Lock in my guess', 'sec');
  rail.lock(); await K.wait(250); rail.el.remove(); tl.remove(); tip.out(); arrow.setAttribute('opacity', 0);
  // 3 Reveal: the rule, in three steps, while the queue settles on what happens
  K.mark(2);
  await K.caption(`For every £10 dearer, 1 in 10 walk.`);
  await K.wait(700); await K.caption(`For every £10 dearer, 1 in 10 walk. <b>${money(gap)} dearer</b>`);
  await K.wait(700); await K.caption(`For every £10 dearer, 1 in 10 walk. <b>${money(gap)} dearer → ${steps} in 10</b>`);
  await walkTo(walkN, 50);
  await K.caption(`For every £10 dearer, 1 in 10 walk. <b>${money(gap)} dearer → ${steps} in 10 → ${num(walkT)} of ${num(T)}.</b>`);
  const res = K.call(800, 800, `Your guess <b>${num(guess * per)}</b> · <b style="color:#f2c14e">${num(walkT)} walked</b>`); res.style.transform = 'translateX(-50%)';
  await K.cont('Next');
  // 4 Use: who stays, in rows of ten
  K.mark(3); res.out(); if(note) note.out();
  await Promise.all(Q.map(p => K.tween(300, t => p.g.style.opacity = 1 - t)));
  const box = sv('g', { opacity:0 }, L.front), BW = COLS * DX + 40, bx = 800 - BW / 2, by = 548, sp = Math.round(COLS * (1 - steps * (D.perTen || .1)));
  sv('rect', { x:bx, y:by, width:BW, height:rows * DY + 50, fill:'#05152b', stroke:'#2b5c95', 'stroke-width':2 }, box);
  for(let i = 0; i < N; i++){ const r = Math.floor(i / COLS), c = i % COLS, inRow = Math.min(COLS, N - r * COLS), lit = c < (inRow === COLS ? sp : Math.round(inRow * sp / COLS));
    const p = K.person(box, bx + 36 + c * DX, by + 70 + r * DY, 'pax'); if(!lit) p.g.style.opacity = .45; }
  if(sp > 0){ const x2 = bx + 36 + (sp - 1) * DX + 12; sv('path', { d:`M${bx + 24} ${by + 18} L ${bx + 24} ${by + 10} L ${x2} ${by + 10} L ${x2} ${by + 18}`, fill:'none', stroke:'#36c6ff', 'stroke-width':2 }, box);
    K.txt(box, bx + 24, by + 2, `${sp} in every 10 stay`, { 'font-size':16, 'font-weight':700, fill:'#36c6ff' }); }
  await K.tween(450, t => box.setAttribute('opacity', t), 'out');
  await K.caption(`<b>${num(stayT)} stay with you: ${sp} in every 10.</b> That's the "stay with you" figure on the ${K.esc(rk)} card.`);
  await K.cont('Back to the card');
  K.done({ guess:guess * per, walked:walkT });
})();
</script>
</body>
</html>
