<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations briefing — Cash, tank, profit</title>
<link rel="stylesheet" href="kit/brief-kit.css" data-kit>
<script src="kit/brief-kit.js" data-kit></script>
</head>
<body data-brief="fuel_cash_tank_profit">
<script>
/* 5 · Cash, tank, profit (the first Fuel desk visit), reworked to Fable's scene: hangar-side, a cash vault on the left, a large
   fuel tank in the middle, the week's flight board on the right. Before he buys he predicts what happens to today's profit. He
   presses Buy: coins stream out of the vault along the pipe into the tank, which fills; the profit display doesn't stir. Then
   the week runs at speed: each day a plane taxis out, a column of fuel drains from the tank into it and a matching chip of cost
   drops onto that day's line; tickets come back into the vault. The week ends with the tank still part-full. */
const D = Object.assign({ id:'fuel_cash_tank_profit', cash:14800, price:1.3, blk:1000, tank:8000, perDay:600, days:7, day:{ tickets:7200, other:3200 },
  flight:{ dep:'06:00', plane:'Twin Otter', to:'Dublin', litres:180 } }, K.B);
const money = K.money, num = K.num, price = +D.price || 1.3, blk = D.blk || 1000, days = Math.max(1, Math.min(7, D.days || 7));
const per = Math.round(D.perDay || 600), weekL = per * days, buyL = Math.min(D.tank || 8000, Math.max(blk, Math.ceil(weekL * 1.3 / blk) * blk)), cost = Math.round(buyL * price);
const fuelDay = Math.round(per * price), tick = Math.round((D.day && D.day.tickets) || 0), other = Math.round((D.day && D.day.other) || 0), dayProfit = tick - fuelDay - other;
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].slice(7 - days);
K.start({ title:'Cash, tank, profit' });
const L = K.layers();
K.apron({ horizon:430, hangarX:860, towerX:330 });
/* the vault, the pipe, the tank */
const V = K.vault(L.mid, { x:110, y:420, w:240, h:260, value:D.cash });
const pipe = K.s('path', { d:'M350 560 C 430 560 450 640 520 640 L 600 640', fill:'none', stroke:'url(#gMetal)', 'stroke-width':14, 'stroke-linecap':'round' }, L.mid);
const T = K.tank(L.mid, { x:600, y:300, w:250, h:380 });
const tankTitle = K.txt(L.mid, 725, 286, 'YOUR FUEL TANK', { 'font-size':15, 'letter-spacing':3, fill:'#9FBDE3', 'text-anchor':'middle' });
const out = K.s('path', { d:'M850 640 L 960 640', fill:'none', stroke:'url(#gMetal)', 'stroke-width':12, 'stroke-linecap':'round' }, L.mid);
/* the week's board, with today's profit over it */
const bd = K.s('g', { filter:'url(#fSh)' }, L.mid), BX = 1040, BY = 190, RH = 52;
K.s('rect', { x:BX, y:BY, width:470, height:110 + RH * days, fill:'#050f22', stroke:'#2b5c95', 'stroke-width':2 }, bd);
K.txt(bd, BX + 18, BY + 34, 'PROFIT THIS WEEK', { 'font-size':15, 'letter-spacing':3, fill:'#F2C14E', 'font-weight':700 });
const prof = K.txt(bd, BX + 452, BY + 38, money(0), { 'font-size':30, 'font-weight':800, 'text-anchor':'end' });
K.txt(bd, BX + 18, BY + 84, 'Day', { 'font-size':13, fill:'#8EA6C8' }); K.txt(bd, BX + 156, BY + 84, 'Fuel burned', { 'font-size':13, fill:'#8EA6C8', 'text-anchor':'middle' }); K.txt(bd, BX + 342, BY + 84, 'Other costs', { 'font-size':13, fill:'#8EA6C8', 'text-anchor':'end' }); K.txt(bd, BX + 452, BY + 84, 'Tickets', { 'font-size':13, fill:'#8EA6C8', 'text-anchor':'end' });   // profit = tickets − fuel burned − other costs
const rows = DAYS.map((d, i) => { const y = BY + 96 + i * RH; K.s('rect', { x:BX + 10, y, width:450, height:RH - 8, fill:'#0b1d38' }, bd); K.txt(bd, BX + 22, y + 29, d, { 'font-size':18, 'font-weight':600 }); return { y }; });
const plane = K.plane(L.front, { x:930, y:690, w:300 }); plane.style.opacity = 0;

(async () => {
  K.mark(0); T.set(0, 0, '0 litres', '£0 of fuel');
  await K.caption('Your cash, your fuel tank, and this week\'s flights.');
  await K.wait(1600);
  // Predict: what does buying do to profit?
  K.mark(1); K.question(`You are buying <b>${num(buyL)} litres</b> for <b>${money(cost)}</b>. What happens to today's profit?`);
  await K.caption('Tap what you think. A guess is fine.');
  const ch = K.chips({ x:800, y:118, center:true, label:'Profit', items:[{ label:'It goes down', value:'down' }, { label:'It stays the same', value:'same' }, { label:'It goes up', value:'up' }] });
  ch.btns.forEach(b => b.style.width = '12cqw');
  const guess = await ch.wait(); ch.set(guess, 'mine'); ch.off();
  // Reveal: he buys; the cash moves into the tank; profit does not stir
  K.mark(2); K.question('Press <b>Buy fuel</b>');
  const buy = K.h('button', { class:'bk-chip', type:'button', style:'position:absolute;width:13cqw;border-color:#F2C14E' }, K.hud(), `Buy fuel<small>${num(buyL)} L at £${price.toFixed(2)} a litre</small>`); K.pos(buy, 655, 772);
  await new Promise(res => buy.onclick = res); buy.remove(); ch.remove();
  K.question(null);
  await Promise.all([K.coins(L.top, [300, 540], [640, 610], 16, 1800), V.set(D.cash - cost, 1600), T.set(buyL / (D.tank || buyL), 1700, `${num(buyL)} litres`, `${money(cost)} of fuel`)]);
  const still = K.call(BX + 360, BY - 10, 'Profit: <b>not moved</b>', '');
  await K.caption(`${money(cost)} moved from cash into the tank. Profit didn't move: ${guess === 'same' ? 'as you thought.' : 'nothing has been burned yet.'}`);
  await K.wait(2200); still.out();
  // the week at speed: each day a flight burns its fuel; tickets come back
  await K.caption('Now the week flies.');
  let left = buyL, p = 0;
  for(let i = 0; i < days; i++){
    const r = rows[i]; plane.style.opacity = 1;
    const go = K.tween(700, t => K.at(plane, 930 + t * 520, 690 - t * 40), 'in');
    left -= per; const drain = T.set(Math.max(0, left) / (D.tank || buyL), 650, `${num(Math.max(0, left))} litres`, `${money(Math.max(0, left) * price)} of fuel`);
    const chip = K.s('g', { opacity:0 }, L.top); K.s('rect', { x:BX + 82, y:r.y + 8, width:148, height:28, fill:'#3b2330', stroke:'#c9d6e6', 'stroke-opacity':.3 }, chip); K.txt(chip, BX + 156, r.y + 28, `${num(per)} L · −${money(fuelDay)}`, { 'font-size':14, 'font-weight':700, 'text-anchor':'middle' });
    const chip2 = K.txt(L.top, BX + 452, r.y + 29, '', { 'font-size':16, 'font-weight':700, 'text-anchor':'end', fill:'#4ADE9B' }), chip3 = K.txt(L.top, BX + 342, r.y + 29, '', { 'font-size':15, 'font-weight':600, 'text-anchor':'end', fill:'#c9d6e6' });
    await Promise.all([go, drain, K.tween(400, t => { chip.setAttribute('opacity', t); chip.setAttribute('transform', `translate(0 ${-14 * (1 - t)})`); }, 'out')]);
    chip2.textContent = money(tick); chip3.textContent = '−' + money(other); p += dayProfit; K.count(prof, p - dayProfit, p, 300, money);
    K.coins(L.top, [BX + 420, r.y + 20], [250, 520], 5, 700); V.set(D.cash - cost + (tick - other) * (i + 1), 500);   // the day's takings, less its other costs
    plane.style.opacity = 0; K.at(plane, 930, 690); await K.wait(250);
  }
  const keep = Math.max(0, left);
  K.call(725, 300, `Still in the tank: <b>${num(keep)} L</b>, <b>${money(keep * price)}</b>`, '');
  K.question(null);
  await K.caption('Buying fuel moves cash into the tank. <b>Profit only counts what your flights burn.</b>');
  await K.cont('Go on');
  K.mark(3); K.question('Next: your first fuel order');
  await K.caption('Buy what the week needs, at a good price, and keep cash for the rest.');
  await K.cont('To the Fuel desk');
  K.done({ guess });
})();
</script>
</body>
</html>
