<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations briefing — Cash, tank, profit</title>
<link rel="stylesheet" href="kit/brief-kit.css" data-kit>
<script src="kit/brief-kit.js" data-kit></script>
</head>
<body data-brief="fuel_cash_tank_profit">
<script>
/* 5 · Cash, tank, profit (the first Fuel desk visit, before the first order: from Launch Day since 19 Oct, evening). Version A
   (Claude Design handover 19 Oct, evening, 7.8): no guess anywhere; four beats, Show → Reveal, and Go on is the Use.
   1 Show, What fuel is: a fuel price board drops in over the airport: today's price a litre and ten weeks of it.
   2 Show, Buying: the order flows from the vault into the tank; cash falls, the tank fills, profit stays £0.
   3 Show, The week flies: each day a plane burns its litres; that day's fuel, other costs and tickets land on its row, the
     profit counts up, and the tank empties.
   4 Reveal, The rule: the Fuel burned column is framed; the whole bill was paid a day at a time.
   The figures are a fixed teaching example kept in the workbook (BriefingData, D105), not the pupil's own: the defaults below
   are the same example, for the page opened on its own. Ticket money is gold and costs are plain figures, as on the Sheet. */
const D = Object.assign({ id:'fuel_cash_tank_profit', cash:8600, price:1.3, buyL:3000, tank:5000, perDay:600, days:5,
  tickets:6660, otherCosts:3610, history:[1.22, 1.25, 1.3, 1.37, 1.47, 1.41, 1.36, 1.3, 1.35, 1.3], next:'order' }, K.B);
const money = K.money, num = K.num, price = +D.price || 1.3, days = Math.max(1, Math.min(7, Math.round(+D.days || 5)));
const per = Math.round(+D.perDay || 600), buyL = Math.round(+D.buyL || per * days), cost = Math.round(buyL * price), cap = Math.max(buyL, Math.round(+D.tank || buyL));
const DY = D.day || { tickets:D.tickets, other:D.otherCosts };   // the workbook's BriefingData keeps them flat (tickets, otherCosts)
const fuelDay = Math.round(per * price), tick = Math.round(+DY.tickets || 0), other = Math.round(+DY.other || 0), dayProfit = tick - fuelDay - other;
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].slice(7 - days), HIST = (Array.isArray(D.history) && D.history.length > 1 ? D.history : [price]).map(Number);
const p2 = v => '£' + (+v).toFixed(2);
K.run(() => {   // Back plays the briefing again from here (the kit: Next and Back are always allowed)
/* year one (20 Oct 2026, Bertie's review): the words sit under the price board, centred, and the vault, tank, week and plane
   move down SH to make room for them */
const SH = K.y1 ? 100 : 0;
K.start({ title:'Cash, tank, profit', words:{ x:800, y:178, w:1000 } });
const L = K.layers();
K.apron({ horizon:430, hangarX:860, towerX:330 });
/* the vault, the pipe, the tank */
const V = K.vault(L.mid, { x:110, y:420 + SH, w:240, h:260, value:D.cash });
K.s('path', { d:`M350 ${560 + SH} C 430 ${560 + SH} 450 ${640 + SH} 520 ${640 + SH} L 600 ${640 + SH}`, fill:'none', stroke:'url(#gMetal)', 'stroke-width':14, 'stroke-linecap':'round' }, L.mid);
const T = K.tank(L.mid, { x:600, y:300 + SH, w:250, h:380 });
K.txt(L.mid, 725, 286 + SH, 'YOUR FUEL TANK', { 'font-size':15, 'letter-spacing':3, fill:'#9FBDE3', 'text-anchor':'middle' });
K.s('path', { d:`M850 ${640 + SH} L 960 ${640 + SH}`, fill:'none', stroke:'url(#gMetal)', 'stroke-width':12, 'stroke-linecap':'round' }, L.mid);
/* the week's board: profit this week over its days (ticket money gold, costs plain) */
const bd = K.s('g', null, L.mid), BX = 1040, BY = 190 + SH * 1.5, RH = 52;   // (the week's board a little lower still, clear of the words)
K.s('rect', { x:BX, y:BY, width:470, height:110 + RH * days, fill:'#050f22', stroke:'#2b5c95', 'stroke-width':2 }, bd);
K.txt(bd, BX + 18, BY + 34, 'PROFIT THIS WEEK', { 'font-size':15, 'letter-spacing':3, fill:'#F2C14E', 'font-weight':700 });
const prof = K.txt(bd, BX + 452, BY + 38, money(0), { 'font-size':30, 'font-weight':800, 'text-anchor':'end' });
K.txt(bd, BX + 18, BY + 84, 'Day', { 'font-size':13, fill:'#8EA6C8' }); K.txt(bd, BX + 156, BY + 84, 'Fuel burned', { 'font-size':13, fill:'#8EA6C8', 'text-anchor':'middle' }); K.txt(bd, BX + 342, BY + 84, 'Other costs', { 'font-size':13, fill:'#8EA6C8', 'text-anchor':'end' }); K.txt(bd, BX + 452, BY + 84, 'Tickets', { 'font-size':13, fill:'#8EA6C8', 'text-anchor':'end' });   // profit = tickets − fuel burned − other costs
const rows = DAYS.map((d, i) => { const y = BY + 96 + i * RH; K.s('rect', { x:BX + 10, y, width:450, height:RH - 8, fill:'#0b1d38' }, bd); K.txt(bd, BX + 22, y + 29, d, { 'font-size':18, 'font-weight':600 }); return { y }; });
const plane = K.plane(L.front, { x:930, y:690 + SH, w:300 }); plane.style.opacity = 0;
/* the fuel price board: square, over the airport; today's price in gold and the last ten weeks, today's point cyan */
const PB = { x:330, y:14, w:940, h:150 }, pb = K.s('g', { transform:'translate(0 -220)' }, L.top);
K.s('rect', { x:PB.x, y:PB.y, width:PB.w, height:PB.h, fill:'#020812', stroke:'#2b5c95', 'stroke-width':2 }, pb);
K.txt(pb, PB.x + 28, PB.y + 38, 'FUEL PRICE · A LITRE', { 'font-size':14, 'letter-spacing':2.5, 'font-weight':700, fill:'#9FBDE3' });
K.txt(pb, PB.x + 28, PB.y + 98, p2(price), { 'font-size':54, 'font-weight':800, fill:'#F2C14E' });
K.txt(pb, PB.x + 30, PB.y + 128, 'today', { 'font-size':16, fill:'#9FBDE3' });
const cx0 = PB.x + 300, cx1 = PB.x + PB.w - 60, cy0 = PB.y + 30, cy1 = PB.y + 90, lo = Math.min(...HIST), hi = Math.max(...HIST);
const hx = i => cx0 + (cx1 - cx0) * i / Math.max(1, HIST.length - 1), hy = v => cy1 - (cy1 - cy0) * (v - lo) / Math.max(0.01, hi - lo);
[cy0, cy1].forEach(y => K.s('line', { x1:cx0, y1:y, x2:cx1, y2:y, stroke:'#2b5c95', 'stroke-dasharray':'4 6', 'stroke-width':1.5 }, pb));
K.s('path', { d:HIST.map((v, i) => `${i ? 'L' : 'M'}${hx(i).toFixed(1)} ${hy(v).toFixed(1)}`).join(' '), fill:'none', stroke:'#9FBDE3', 'stroke-width':3 }, pb);
HIST.forEach((v, i) => K.s('circle', { cx:hx(i), cy:hy(v), r:i === HIST.length - 1 ? 8 : 4.5, fill:i === HIST.length - 1 ? '#36C6FF' : '#9FBDE3' }, pb));
const iLo = HIST.indexOf(lo), iHi = HIST.indexOf(hi);
K.txt(pb, hx(iLo), hy(lo) + 24, p2(lo), { 'font-size':15, 'text-anchor':'middle', fill:'#EAF2FF' }); K.txt(pb, hx(iHi), hy(hi) - 12, p2(hi), { 'font-size':15, 'text-anchor':'middle', fill:'#EAF2FF' });
K.txt(pb, cx0, PB.y + PB.h - 8, `${HIST.length} weeks ago`, { 'font-size':14, fill:'#8EA6C8' }); K.txt(pb, cx1, PB.y + PB.h - 8, 'today', { 'font-size':14, 'text-anchor':'end', fill:'#36C6FF' });

(async () => {
  // 1 Show · What fuel is: the price board drops in
  K.mark(0); T.set(0, 0, '0 litres', '£0 of fuel');
  await K.tween(700, t => pb.setAttribute('transform', `translate(0 ${(-220 * (1 - t)).toFixed(1)})`), 'out');
  await K.caption(`Every plane needs fuel to fly. Its price goes up and down, like petrol at a garage. You can't stop that, but <b>when the price is good you can buy extra and keep it in your tank.</b>`);
  await K.cont('Next');
  // 2 Show · Buying: the order flows from the vault into the tank; profit doesn't stir
  K.mark(0);
  const tag = K.call(450, 520 + SH, `−${money(cost)} →`, 'quiet');
  await Promise.all([K.coins(L.top, [300, 540 + SH], [640, 610 + SH], 16, 1800), V.set(D.cash - cost, 1600), T.set(buyL / cap, 1700, `${num(buyL)} litres`, `${money(cost)} of fuel`)]);
  await K.caption(`You buy ${num(buyL)} litres at ${p2(price)} a litre. ${money(cost)} leaves the bank and the fuel waits in your tank. <b>Nothing has flown yet, so profit is still £0.</b>`);
  await K.cont('Fly the week');
  // 3 Show · The week flies: each day burns its fuel, and that day's fuel comes off that day's profit
  K.mark(0); tag.out();
  let left = buyL, p = 0;
  for(let i = 0; i < days; i++){
    const r = rows[i]; plane.style.opacity = 1;
    const go = K.tween(700, t => K.at(plane, 930 + t * 520, 690 + SH - t * 40), 'in');
    left -= per; const drain = T.set(Math.max(0, left) / cap, 650, `${num(Math.max(0, left))} litres`, `${money(Math.max(0, left) * price)} of fuel`);
    const chip = K.s('g', { opacity:0 }, L.top); K.s('rect', { x:BX + 82, y:r.y + 8, width:148, height:28, fill:'#0d2648', stroke:'#5b86b8', 'stroke-opacity':.55 }, chip); K.txt(chip, BX + 156, r.y + 28, `${num(per)} L · −${money(fuelDay)}`, { 'font-size':14, 'font-weight':700, 'text-anchor':'middle', fill:'#EAF2FF' });
    const tk = K.txt(L.top, BX + 452, r.y + 29, '', { 'font-size':16, 'font-weight':700, 'text-anchor':'end', fill:'#F2C14E' }), oc = K.txt(L.top, BX + 342, r.y + 29, '', { 'font-size':15, 'font-weight':600, 'text-anchor':'end', fill:'#c9d6e6' });
    await Promise.all([go, drain, K.tween(400, t => { chip.setAttribute('opacity', t); chip.setAttribute('transform', `translate(0 ${-14 * (1 - t)})`); }, 'out')]);
    tk.textContent = money(tick); oc.textContent = '−' + money(other); p += dayProfit; K.count(prof, p - dayProfit, p, 300, money);
    K.coins(L.top, [BX + 420, r.y + 20], [250, 520 + SH], 5, 700); V.set(D.cash - cost + (tick - other) * (i + 1), 500);   // the day's takings, less its other costs
    plane.style.opacity = 0; K.at(plane, 930, 690 + SH); await K.wait(250);
  }
  const keep = Math.max(0, left);
  K.call(725, 300 + SH, `Still in the tank: <b>${num(keep)} L, ${money(keep * price)}</b>`, '');
  await K.caption(`Each day your planes burn ${num(per)} litres. <b>That day's fuel, ${money(fuelDay)}, comes off that day's profit.</b>`);
  await K.cont('Next');
  // 4 Reveal · The rule: the Fuel burned column framed; the whole bill, a day at a time
  K.mark(1);
  const fy0 = rows[0].y + 2, fy1 = rows[days - 1].y + RH - 6;
  const fr = K.s('rect', { x:BX + 74, y:fy0, width:164, height:fy1 - fy0, fill:'none', stroke:'#36C6FF', 'stroke-width':3, opacity:0 }, L.top);
  await K.tween(400, t => fr.setAttribute('opacity', t), 'out');
  const note = K.h('div', { class:'bk-call', style:'transform:none;white-space:normal;width:29%;text-align:left;border:0;background:none;box-shadow:none;padding:0;font-weight:400;color:#c6d8f0' }, K.hud(), `${DAYS[0]} to ${DAYS[days - 1]}: ${days} × ${money(fuelDay)} = <b style="color:#F2C14E">${money(fuelDay * days)}</b>, the whole bill, a day at a time`);
  K.pos(note, BX, BY + 110 + RH * days + 14);
  await K.caption(`The fuel's cost doesn't come off all at once. <b>Each day pays for the fuel it burns.</b>`);
  await K.cont(D.next === 'order' ? 'Go on' : 'To the Fuel desk');
  K.done({});
})();
});
</script>
</body>
</html>
