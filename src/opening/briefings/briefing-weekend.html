<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations briefing — Weekdays and weekends</title>
<link rel="stylesheet" href="kit/brief-kit.css" data-kit>
<script src="kit/brief-kit.js" data-kit></script>
</head>
<body data-brief="weekend_demand">
<script>
/* 4 · Weekdays and weekends (the week-2 review), reworked to Fable's scene: seven day columns, each a little gate lounge. Through
   the week business travellers (briefcases, cyan) fill the columns; at the weekend families and holidaymakers (orange, pale)
   take their place and the columns swell past the glowing seats line, the extra left standing. He taps the days that look
   different while it happens. His own timetable slides in beneath: the same flights every day. Then the Operations Request;
   granted, the weekend's timetable changes and the waiting travellers fly. The game is told the choice (chosen, right). */
const D = Object.assign({ id:'weekend_demand', route:'Dublin', want:[48, 45, 47, 50, 61, 83, 77], seats:[57, 57, 57, 57, 57, 57, 57],
  flights:[{ t:'09:40', n:19 }, { t:'14:50', n:19 }, { t:'19:10', n:19 }],
  options:[['Change weekdays and weekends separately', 'two timetables: Mon–Fri and Sat–Sun'], ['Change every day together', 'the planner as it is now'], ['Change one particular date', "a single day's exception"]] }, K.B);
const want = D.want, seats = D.seats, DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const BIZ = [.7, .71, .7, .72, .66, .15, .13], FAM = [.13, .11, .13, .12, .16, .49, .49];
const biz = D.biz || want.map((v, i) => Math.round(v * BIZ[i])), fam = D.fam || want.map((v, i) => Math.round(v * FAM[i])), lei = D.lei || want.map((v, i) => v - biz[i] - fam[i]);
const avg = a => a.reduce((t, v) => t + v, 0) / Math.max(1, a.length), wd = avg(want.slice(0, 5)), we = avg(want.slice(5)), up = we >= wd, pct = Math.round(Math.abs(we - wd) / Math.max(1, wd) * 100);
const per = Math.max(1, Math.ceil(Math.max(...want, ...seats) / 40)), num = K.num;
K.start({ title:'Weekdays and weekends' });
const L = K.layers();
K.terminal({ horizon:250, glassBottom:360, tower:false, pane:205, poolX:800 });

/* the bays: a gate door at the back, the lounge floor, the seats line, the day's flights beneath */
const BX = k => 105 + k * 200, ROWY = r => 752 - r * 37, COLX = (k, c) => BX(k) + 100 + (c - 2.5) * 27;
const bays = DAYS.map((d, k) => {
  const g = K.s('g', null, L.mid), x = BX(k);
  K.s('rect', { x:x + 6, y:372, width:188, height:408, fill:k >= 5 ? '#10284b' : '#0d2242', opacity:.55 }, g);
  const door = K.s('g', { transform:`translate(${x + 70} 300)` }, g); K.s('rect', { x:0, y:0, width:60, height:72, fill:'#0a1a31', stroke:'#2b5c95', 'stroke-width':2 }, door); K.s('rect', { x:4, y:4, width:52, height:64, fill:'#7fd0ff', opacity:.08 }, door);
  const lab = K.txt(g, x + 100, 888, d, { 'font-size':24, 'font-weight':700, 'text-anchor':'middle', fill:k >= 5 ? '#EAF2FF' : '#B8CBE6' });
  const cnt = K.txt(g, x + 100, 404, '', { 'font-size':18, 'font-weight':600, 'text-anchor':'middle', fill:'#9FBDE3' });
  const outline = K.s('rect', { x:x + 4, y:370, width:192, height:530, fill:'none', stroke:'#36C6FF', 'stroke-width':3, opacity:0 }, L.top);
  return { g, x, lab, cnt, outline, people:[] };
});
/* the seats line of each day: glowing, at the row where the seats run out */
const seatFig = k => Math.round(seats[k] / per), rowsOf = n => Math.ceil(n / 6);
bays.forEach((b, k) => { const n = seatFig(k), r = n / 6, y = ROWY(r) - 30; const line = K.s('g', { opacity:0 }, L.top);
  K.s('rect', { x:b.x + 10, y:y - 2, width:180, height:4, fill:'#EAF2FF', filter:K.B.kitFlat ? undefined : 'url(#fGlowLine)' }, line);
  const t = K.txt(line, b.x + 188, y - 8, `${num(seats[k])} seats`, { 'font-size':14, 'font-weight':600, 'text-anchor':'end', fill:'#EAF2FF', stroke:'#06142b', 'stroke-width':4, 'paint-order':'stroke' }); b.line = line; b.lineY = y; });
if(per > 1) K.call(1515, 300, `each figure = ${per} travellers`, 'quiet');
/* the flights beneath each day */
const strips = bays.map((b, k) => { const g = K.s('g', { opacity:0, transform:'translate(0 40)' }, L.top); K.s('rect', { x:b.x + 10, y:796, width:180, height:58, fill:'#06142b', stroke:'#2b5c95', 'stroke-width':1.5 }, g);
  D.flights.slice(0, 4).forEach((f, i, a) => { const w = 168 / a.length; const c = K.s('g', { transform:`translate(${b.x + 16 + i * w} 806)` }, g); K.s('rect', { x:0, y:0, width:w - 6, height:38, fill:'#1f6fd1', opacity:.9 }, c); K.txt(c, (w - 6) / 2, 25, f.t, { 'font-size':15, 'font-weight':700, 'text-anchor':'middle' }); });
  return g; });

/* who comes each day: a shuffled mix of business, leisure and families, in rows from the front */
function crowd(k){
  const b = bays[k], kinds = [].concat(Array(Math.round(biz[k] / per)).fill('biz'), Array(Math.round(lei[k] / per)).fill('lei'), Array(Math.round(fam[k] / per)).fill('fam'));
  for(let i = kinds.length - 1; i > 0; i--){ const j = Math.floor(((i * 7919 + k * 104729) % 1000) / 1000 * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
  return kinds.slice(0, 54).map((kind, i) => { const r = Math.floor(i / 6), c = i % 6, sc = 1 - r * .035; const P = K.person(b.g, COLX(k, c) + (r % 2 ? 6 : -6), ROWY(r), kind, { scale:sc, child:false }); P.g.style.opacity = 0; P.r = r; P.over = i >= seatFig(k); return P; });
}
let taps = new Set(), tapping = true, leftCall = null;   // leftCall: the 'left at the gate' label, gone once they fly
const hitbox = bays.map((b, k) => { const el = K.h('button', { 'aria-label':DAYS[k], type:'button', style:'position:absolute;background:transparent;border:0;cursor:pointer' }, K.hud()); K.pos(el, b.x + 4, 370); el.style.width = (100 * 192 / 1600) + '%'; el.style.height = (100 * 530 / 900) + '%';
  el.onclick = () => { if(!tapping) return; taps.has(k) ? taps.delete(k) : taps.add(k); b.outline.setAttribute('opacity', taps.has(k) ? .95 : 0); }; return el; });

(async () => {
  K.mark(0); K.caption(`${D.route} last week: who wanted to fly, day by day.`);
  K.question('Tap the days that look <b>different</b>');
  // the week fills, a day at a time
  for(let k = 0; k < 7; k++){
    const P = crowd(k); bays[k].people = P;
    bays[k].line.setAttribute('opacity', 1);
    await Promise.all(P.map((p, i) => { const x = p.x, y = p.y; p.set(x, y + 40); return K.wait(i * 14).then(() => { p.g.style.opacity = 1; return K.tween(380, t => p.set(x, y + 40 * (1 - t)), 'out'); }); }));
    P.forEach(p => { if(p.over) p.g.classList.add('dim'); });
    K.count(bays[k].cnt, 0, want[k], 400).then(() => { bays[k].cnt.textContent = `${num(want[k])} want`; });
    await K.wait(k >= 5 ? 700 : 420);
  }
  // he taps at least one day (any days: a guess is never wrong)
  K.mark(1); if(!taps.size){ K.caption('Tap the days that look different from the rest.'); await new Promise(res => { const t = setInterval(() => { if(taps.size){ clearInterval(t); res(); } }, 150); }); await K.wait(900); }
  tapping = false; hitbox.forEach(h => h.remove());
  // the weekend shows itself
  K.mark(2); [5, 6].forEach(k => { bays[k].outline.setAttribute('stroke', '#F2C14E'); bays[k].outline.setAttribute('opacity', 1); });
  [0, 1, 2, 3, 4].forEach(k => { if(taps.has(k)) bays[k].outline.setAttribute('opacity', .35); });
  const overW = [5, 6].some(k => want[k] > seats[k]);
  K.question(`Saturday and Sunday: <b>${pct}% ${up ? 'more' : 'fewer'}</b> people, and different ones`);
  await K.caption(up ? 'Business travel stops at the weekend; families and holidaymakers take its place, more of them.' : 'Business travel fills the weekdays; at the weekend fewer people fly.');
  if(overW){ const k = want[5] - seats[5] >= want[6] - seats[6] ? 5 : 6; leftCall = K.call(bays[k].x + 100, ROWY(rowsOf(Math.round(want[k] / per))) - 30, `<b>${num(want[k] - seats[k])}</b> left at the gate`, ''); }
  await K.wait(1800);
  // his timetable slides in beneath: the same flights every day
  await K.caption('Your timetable: <b>the same flights every day</b>.');
  await Promise.all(strips.map((g, k) => K.wait(k * 90).then(() => K.tween(500, t => { g.setAttribute('opacity', t); g.setAttribute('transform', `translate(0 ${40 * (1 - t)})`); }, 'out'))));
  await K.wait(1400);
  await K.cont('Go on');
  // the Operations Request
  K.mark(3); K.question('<b>Operations request:</b> what should the planner let you do?');
  await K.caption('Choose the change that fits this week.');
  const order = [1, 0, 2].filter(i => i < D.options.length);
  let chosen = null;
  for(;;){
    const ch = K.chips({ x:800, y:150, center:true, label:'Operations request', items:order.map(i => ({ label:D.options[i][0], small:D.options[i][1], value:i })) });
    ch.btns.forEach(b => { b.style.width = '20cqw'; b.style.fontSize = '1.15cqw'; b.style.padding = '.8cqw 1cqw'; });
    chosen = await ch.wait(); ch.off();
    const shown = await consequence(chosen); ch.remove();
    if(chosen === 0) break;
    const again = K.chips({ x:800, y:160, center:true, label:'Again', items:[{ label:'Choose again', value:'a' }, { label:'Keep this choice', value:'k' }] });
    const a = await again.wait(); again.remove(); if(a === 'k') break; reset(shown);
  }
  await K.caption(chosen === 0 ? 'Approved: from Monday each flight has <b>Days</b> — every day, Mon–Fri or Sat–Sun.' : 'Noted. The systems team will look at it again.');
  await K.cont(chosen === 0 ? 'To next week' : 'Continue');
  K.done({ chosen, right:chosen === 0 });
})();

/* what each choice does to the week */
const extra = [];
async function consequence(c){
  K.question(null); const out = [];
  const add = (k, label) => { const g = K.s('g', { opacity:0 }, L.top); K.s('rect', { x:bays[k].x + 30, y:762, width:140, height:30, fill:'#F2C14E' }, g); K.txt(g, bays[k].x + 100, 783, label, { 'font-size':15, 'font-weight':700, 'text-anchor':'middle', fill:'#1a1200' }); out.push(g); return K.tween(500, t => { g.setAttribute('opacity', t); g.setAttribute('transform', `translate(0 ${-30 * (1 - t)})`); }, 'out'); };
  const board = async k => { const P = bays[k].people.filter(p => p.over); if(leftCall) leftCall.out(); await Promise.all(P.map((p, i) => K.walk(p, bays[k].x + 100, 330, 900, i * 30).then(() => { p.g.style.opacity = 0; }))); out.push({ k, P }); };
  if(c === 0){
    if(up){ await Promise.all([5, 6].map(k => add(k, '+ a flight'))); raise(out); await K.caption('Two timetables: the weekend gets its own flights, and the waiting travellers fly.'); await Promise.all([5, 6].map(board)); }
    else { await Promise.all([5, 6].map(k => add(k, '− a flight'))); await K.caption('Two timetables: a quieter weekend flies fewer, fuller flights.'); }
  } else if(c === 1){
    await Promise.all([0, 1, 2, 3, 4, 5, 6].map(k => add(k, up ? '+ a flight' : '− a flight')));
    await K.caption(up ? 'Every day together: an extra flight every day, half empty on weekdays.' : 'Every day together: one flight fewer every day, and weekday travellers left behind.');
  } else {
    await add(5, 'this Saturday'); if(up) await board(5);
    await K.caption('One date: it fixes one Saturday. Next weekend is the same again.');
  }
  await K.wait(1400); return out;
}
/* an extra weekend flight: the seats line rises by one plane's seats (and comes back down if he chooses again) */
function raise(out){ const extra = (D.flights[0] && D.flights[0].n) || 19;
  [5, 6].forEach(k => { const b = bays[k], t = b.line.querySelector('text'), ny = ROWY(Math.round((seats[k] + extra) / per) / 6) - 30; if(t) t.textContent = `${num(seats[k] + extra)} seats`;
    K.tween(600, s => b.line.setAttribute('transform', `translate(0 ${(ny - b.lineY) * s})`), 'out');
    out.push({ remove:() => { b.line.removeAttribute('transform'); if(t) t.textContent = `${num(seats[k])} seats`; } }); }); }
function reset(out){ if(leftCall) leftCall.out(false); out.forEach(o => { if(o.P){ o.P.forEach(p => { p.g.style.opacity = 1; }); const k = o.k; let i = 0; bays[k].people.forEach((p, j) => { const r = Math.floor(j / 6), c = j % 6; p.set(COLX(k, c) + (r % 2 ? 6 : -6), ROWY(r)); }); } else o.remove(); }); }
</script>
</body>
</html>
