<?xml version="1.0" encoding="UTF-8"?>
<svg data-piece="frame-cash-tank-profit" width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hangar-side scene: coins stream from a cash vault into a fuel tank holding 2,600 litres worth £3,900; a departures board shows the day's costs">
<defs>
<linearGradient id="f2wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050f25"/><stop offset="1" stop-color="#0c2852"/></linearGradient>
<linearGradient id="f2floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2a55"/><stop offset="1" stop-color="#040e22"/></linearGradient>
<radialGradient id="f2pool" cx="0.3" cy="0.72" r="0.6"><stop offset="0" stop-color="#36c6ff" stop-opacity="0.12"/><stop offset="1" stop-color="#36c6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="f2shadow"><stop offset="0" stop-color="#000" stop-opacity="0.55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="f2steelF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a5c8a"/><stop offset="1" stop-color="#1b3863"/></linearGradient>
<linearGradient id="f2steelT" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c80b0"/><stop offset="1" stop-color="#3d5f8e"/></linearGradient>
<linearGradient id="f2steelS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16305a"/><stop offset="1" stop-color="#0c1f3e"/></linearGradient>
<linearGradient id="f2cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4c70a2"/><stop offset="0.35" stop-color="#2f5384"/><stop offset="1" stop-color="#112a50"/></linearGradient>
<linearGradient id="f2fuel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36c6ff" stop-opacity="0.85"/><stop offset="1" stop-color="#2c7fd0" stop-opacity="0.55"/></linearGradient>
<radialGradient id="f2glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#36c6ff" stop-opacity="0.22"/><stop offset="1" stop-color="#36c6ff" stop-opacity="0"/></radialGradient>
<symbol id="f2coin" viewBox="-15 -15 30 30" width="30" height="30" x="-15" y="-15" overflow="visible">
<ellipse cx="0" cy="2.2" rx="13" ry="13" fill="#a87a0c"/>
<ellipse cx="0" cy="0" rx="13" ry="13" fill="#f2c14e"/>
<ellipse cx="0" cy="0" rx="9" ry="9" fill="none" stroke="#c99512" stroke-width="1.6"/>
<path d="M-8,-7 A11,11 0 0 1 4,-11" stroke="#fff3c4" stroke-width="2" fill="none" stroke-linecap="round"/>
</symbol>
</defs>

<!-- hangar wall and floor -->
<rect width="1600" height="900" fill="url(#f2wall)"/>
<g stroke="#5a95c8" stroke-opacity="0.07"><line x1="80" y1="0" x2="80" y2="660"/><line x1="200" y1="0" x2="200" y2="660"/><line x1="320" y1="0" x2="320" y2="660"/><line x1="440" y1="0" x2="440" y2="660"/><line x1="560" y1="0" x2="560" y2="660"/><line x1="680" y1="0" x2="680" y2="660"/><line x1="800" y1="0" x2="800" y2="660"/><line x1="920" y1="0" x2="920" y2="660"/><line x1="1040" y1="0" x2="1040" y2="660"/><line x1="1160" y1="0" x2="1160" y2="660"/><line x1="1280" y1="0" x2="1280" y2="660"/><line x1="1400" y1="0" x2="1400" y2="660"/><line x1="1520" y1="0" x2="1520" y2="660"/></g>
<rect y="660" width="1600" height="240" fill="url(#f2floor)"/>
