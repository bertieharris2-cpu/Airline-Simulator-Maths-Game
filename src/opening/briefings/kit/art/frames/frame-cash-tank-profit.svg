<use href="#f2coin" transform="translate(523,203) rotate(28) scale(1,0.89)"/>
<use href="#f2coin" transform="translate(565,186) rotate(-15) scale(1,0.56)"/>
<use href="#f2coin" transform="translate(606,173) rotate(22) scale(1,0.95)"/>
<use href="#f2coin" transform="translate(647,166) rotate(-21) scale(1,0.61)"/>
<use href="#f2coin" transform="translate(689,163) rotate(16) scale(1,0.86)"/>
<use href="#f2coin" transform="translate(730,166) rotate(-27) scale(1,0.83)"/>
<use href="#f2coin" transform="translate(767,172) rotate(10) scale(1,0.66)"/>

<!-- fuel tank -->
<ellipse cx="820" cy="690" rx="190" ry="16" fill="url(#f2shadow)"/>
<ellipse cx="790" cy="480" rx="230" ry="250" fill="url(#f2glow)"/>
