<path d="M735,186 L845,186" stroke="#a8ccf2" stroke-opacity="0.7" stroke-width="2"/>
<ellipse cx="790" cy="234" rx="22" ry="5" fill="#061226"/>
<g stroke="#0e2346" stroke-width="2" stroke-opacity="0.7"><path d="M640,360 A150,30 0 0 0 940,360" fill="none"/><path d="M640,580 A150,30 0 0 0 940,580" fill="none"/></g>
<rect x="715" y="296" width="150" height="344" fill="#050f22" stroke="#5a95c8" stroke-opacity="0.5" stroke-width="1.5"/>
