<g stroke="#9cb8dc" stroke-width="7" stroke-linecap="round"><line x1="260" y1="530" x2="260" y2="478"/><line x1="260" y1="530" x2="305" y2="556"/><line x1="260" y1="530" x2="215" y2="556"/></g>
<circle cx="260" cy="530" r="14" fill="#9cb8dc"/><circle cx="260" cy="530" r="6" fill="#1a3866"/>
<rect x="114" y="452" width="10" height="34" rx="2" fill="#0e2346"/><rect x="114" y="574" width="10" height="34" rx="2" fill="#0e2346"/>
<text x="110" y="726" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="18" fill="#9fbde3">Cash</text>
<text x="110" y="760" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" style="font-variant-numeric:tabular-nums lining-nums" font-size="28" font-weight="600" fill="#f2c14e">£20,000 → £16,100</text>

<!-- coin stream: the one gold thing -->
<path d="M330,352 Q560,110 790,178" fill="none" stroke="#f2c14e" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
