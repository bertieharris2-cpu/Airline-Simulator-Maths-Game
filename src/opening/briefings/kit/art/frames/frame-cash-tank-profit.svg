<g stroke="#9fbde3" stroke-width="1.5"><line x1="865" y1="385" x2="878" y2="385"/><line x1="865" y1="470" x2="878" y2="470"/><line x1="865" y1="555" x2="878" y2="555"/><line x1="865" y1="300" x2="878" y2="300"/></g>
<g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" style="font-variant-numeric:tabular-nums lining-nums" font-size="14" fill="#9fbde3"><text x="884" y="305">4,000 L</text><text x="884" y="390">3,000</text><text x="884" y="475">2,000</text><text x="884" y="560">1,000</text></g>
<text x="660" y="760" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="18" fill="#9fbde3">In the tank</text>
<text x="660" y="796" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" style="font-variant-numeric:tabular-nums lining-nums" font-size="34" font-weight="600" fill="#eaf2ff">2,600 L</text>
<text x="660" y="828" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="19" fill="#9fbde3">worth <tspan font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" style="font-variant-numeric:tabular-nums lining-nums" fill="#f2c14e">£3,900</tspan> at <tspan font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" style="font-variant-numeric:tabular-nums lining-nums">£1.50</tspan> a litre</text>

<!-- fuel line to the day's flights (not yet used) -->
<path d="M940,620 L1000,620 L1000,600 L1040,600" fill="none" stroke="#3d5f8e" stroke-width="8"/>
<path d="M940,620 L1000,620 L1000,600 L1040,600" fill="none" stroke="#36c6ff" stroke-opacity="0.18" stroke-width="2"/>

<!-- departures board: the day's costs -->
<ellipse cx="1300" cy="688" rx="270" ry="12" fill="url(#f2shadow)"/>
<rect x="1060" y="640" width="12" height="40" fill="#16305a"/><rect x="1488" y="640" width="12" height="40" fill="#16305a"/>
<rect x="1040" y="232" width="480" height="412" fill="#05152b" stroke="#5a95c8" stroke-opacity="0.42"/>
<line x1="1040" y1="232.5" x2="1520" y2="232.5" stroke="#9cc4f0" stroke-opacity="0.5"/>
<text x="1066" y="270" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4" fill="#36c6ff">DEPARTURES · TODAY'S COSTS</text>
<g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#9fbde3"><text x="1066" y="304">TIME</text><text x="1146" y="304">FLIGHT</text><text x="1236" y="304">TO</text><text x="1400" y="304" text-anchor="end">FUEL</text><text x="1494" y="304" text-anchor="end">OTHER</text></g>
<line x1="1060" y1="316" x2="1500" y2="316" stroke="#5a95c8" stroke-opacity="0.2"/>
<g font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" style="font-variant-numeric:tabular-nums lining-nums" font-size="18" fill="#eaf2ff">
<text x="1066" y="352">06:00</text><text x="1146" y="352">AS101</text><text x="1236" y="352">DUBLIN</text><text x="1400" y="352" text-anchor="end">£975</text><text x="1494" y="352" text-anchor="end">£410</text>
<text x="1066" y="398">09:45</text><text x="1146" y="398">AS102</text><text x="1236" y="398">LONDON</text><text x="1400" y="398" text-anchor="end">£975</text><text x="1494" y="398" text-anchor="end">£410</text>
<text x="1066" y="444">10:20</text><text x="1146" y="444">AS103</text><text x="1236" y="444">PARIS</text><text x="1400" y="444" text-anchor="end">£975</text><text x="1494" y="444" text-anchor="end">£450</text>
<text x="1066" y="490">13:05</text><text x="1146" y="490">AS104</text><text x="1236" y="490">LONDON</text><text x="1400" y="490" text-anchor="end">£975</text><text x="1494" y="490" text-anchor="end">£450</text>
</g>
<g stroke="#5a95c8" stroke-opacity="0.1"><line x1="1060" y1="368" x2="1500" y2="368"/><line x1="1060" y1="414" x2="1500" y2="414"/><line x1="1060" y1="460" x2="1500" y2="460"/></g>
<line x1="1060" y1="512" x2="1500" y2="512" stroke="#5a95c8" stroke-opacity="0.35"/>
<text x="1066" y="552" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="18" fill="#9fbde3">Today's costs</text>
<text x="1494" y="552" text-anchor="end" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" style="font-variant-numeric:tabular-nums lining-nums" font-size="26" font-weight="600" fill="#eaf2ff">£5,620</text>
<text x="1066" y="610" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="15" fill="#9fbde3">Fuel becomes a cost when each flight uses it.</text>

<!-- briefing caption -->
<text x="80" y="54" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.32" fill="#36c6ff">OPERATIONS BRIEFING</text>
<text x="80" y="92" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="34" font-weight="600" fill="#eaf2ff">Cash, tank, profit</text>
<text x="80" y="124" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="19" fill="#9fbde3">Buying fuel moves cash into the tank. Profit doesn't change until the fuel is used.</text>
</svg>
