<g data-part="icon" fill="none" stroke="#9fbde3" stroke-width="1.5" stroke-linejoin="round"><rect x="20" y="46" width="40" height="30"/><line x1="20" y1="56" x2="60" y2="56"/><line x1="30" y1="42" x2="30" y2="50"/><line x1="50" y1="42" x2="50" y2="50"/><rect x="40" y="62" width="10" height="8"/></g>
