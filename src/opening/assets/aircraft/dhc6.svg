  <path d="M300 178 C300 160 318 154 350 154 L470 156 C492 158 500 168 500 176 C500 184 490 192 470 194 L350 198 C318 198 300 192 300 178 Z" fill="url(#shadeS@U)"/>
  <path class="p-line" d="M300 178 C300 160 318 154 350 154 L470 156 C492 158 500 168 500 176 C500 184 490 192 470 194 L350 198 C318 198 300 192 300 178 Z"/>
  <rect x="396" y="190" width="30" height="8" rx="3" fill="#2A3442"/>
  <ellipse cx="290" cy="176" rx="6" ry="82" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.18)"/>
  <rect class="blade" x="286" y="98" width="8" height="156" rx="4" fill="#1E2630"/>
  <rect class="blade b2" x="286" y="98" width="8" height="156" rx="4" fill="#1E2630" opacity=".6"/>
