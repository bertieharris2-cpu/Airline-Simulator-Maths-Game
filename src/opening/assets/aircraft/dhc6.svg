<!-- DHC-6 Twin Otter, port side, nose left. Box 0 0 1200 440. Ids carry @U (made unique per copy); paint classes p-body p-belly p-engine p-second;
     stripes .st.st-<id>, tail symbols .tl.tl-<id>; text @NAME @REG @PNAME with @NAMEFILL @REGFILL @PNAMEFILL; @LOGO is the airline logo (40 x 40). -->
<defs>
  <clipPath id="fus@U"><path d="M118 268 C118 250 150 236 196 228 L238 206 C252 192 270 186 300 186 L860 186 C930 188 1000 200 1052 224 L1056 236 C1000 246 900 262 790 296 C760 304 720 306 690 306 L250 306 C190 306 140 292 118 268 Z"/></clipPath>
